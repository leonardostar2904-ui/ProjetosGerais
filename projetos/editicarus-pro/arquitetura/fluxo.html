 {x:0,y:650,w:1330,h:420,t:'Fase C · Edição',c:'core',i:'Quatro trilhas paralelas sobre o mesmo documento.'},
 {x:0,y:1110,w:1330,h:330,t:'Fase D · Saída',c:'shell',i:'Assíncrono por padrão. O usuário não espera na tela.'}
],
n:[
 {id:'j1',x:25,y:230,w:230,h:95,l:'user',t:'Abrir o app',s:'Alvo: janela utilizável em menos de 1,5s.',
  d:{q:'Boot da casca, restauração de sessão em cache e carga do último projeto se existir.',p:'Tempo de abertura é a primeira impressão e é a métrica mais fácil de perder sem notar. O Tauri ajuda aqui (cold start medido na faixa de 380ms contra 1.420ms do Electron em comparativos de 2026), mas o que pesa de verdade é quanto você carrega antes de desenhar.',te:'Carga em duas ondas: casca e último projeto primeiro, catálogo e modelos de IA depois, sob demanda.',f:'Projeto anterior corrompido: abre a Home com aviso e link para o snapshot anterior.',k:['cold start','carga em ondas']}},
 {id:'j2',x:345,y:230,w:230,h:95,l:'user',t:'Sessão válida?',s:'Decisão. Offline é caminho normal, não exceção.',dec:1,
  d:{q:'Verifica o token em cache. Não bloqueia a entrada.',p:'O editor inteiro funciona sem conta. Login é exigido só para sincronizar, publicar ou usar servidor. Exigir conta para editar é a forma mais rápida de perder o usuário que baixou para testar.',te:'Token em cache vale até 7 dias offline. Expirado: modo convidado com banner discreto.',f:'Auth fora do ar: entra como convidado. Nenhum bloqueio.',k:['convidado','7 dias offline']}},
 {id:'j3',x:665,y:230,w:230,h:95,l:'shell',t:'Home e rascunhos',s:'Projetos recentes, templates, receitas.',
  d:{q:'A cena Home. Lista de projetos com miniatura, duração e data. Atalhos para as receitas.',p:'É aqui que os cliques são economizados. "Legendar um vídeo" começa como receita na Home, não como sequência de menus dentro do editor.',te:'Lista paginada por cursor, miniaturas em cache local. Nenhuma chamada de rede para renderizar a Home.',f:'Índice de projetos ilegível: reconstrói varrendo a pasta de projetos.',k:['receitas','cursor','sem rede']}},
 {id:'j4',x:985,y:230,w:230,h:95,l:'shell',t:'Novo projeto',s:'Formato e proporção. Dois campos, não um formulário.',
  d:{q:'Cria o documento vazio com proporção e taxa de quadros.',p:'Pedir mais que isso no início é fricção pura. Resolução de export é decisão do momento do export, não da criação.',te:'Presets: vertical 9:16, quadrado 1:1, horizontal 16:9. A proporção é mutável a qualquer momento sem recriar o projeto.',f:'Falha ao criar arquivo: avisa com o caminho e o motivo do sistema operacional.',k:['2 campos','proporção mutável']}},

 {id:'j5',x:25,y:465,w:230,h:95,l:'render',t:'Importar mídia',s:'Referência, não cópia. Nada sobe para servidor.',
  d:{q:'O arquivo fica onde está. O projeto guarda caminho mais hash de conteúdo.',p:'Copiar para dentro do projeto duplica dezenas de GB sem motivo. O hash resolve o caso de mover o arquivo: o app reencontra pelo conteúdo.',te:'Drag and drop, seletor de arquivo e pasta observada. Hash incremental calculado em worker.',f:'Arquivo removido depois: o clipe aparece com estado "mídia ausente" e botão de relocalizar. A timeline não quebra.',k:['por referência','hash','relocalizar']}},
 {id:'j6',x:345,y:465,w:230,h:95,l:'render',t:'Gerar proxy',s:'540p em worker. O usuário já pode editar.',
  d:{q:'Versão em resolução menor usada para scrub e preview, mais miniaturas da timeline.',p:'Editar 4K direto trava qualquer máquina. O proxy é o que entrega os 60fps. E ele é gerado em segundo plano: o usuário começa a cortar antes de terminar.',te:'Worker dedicado, prioridade abaixo do preview. Proxy em cache de disco com LRU.',f:'Geração falha: edita no original com aviso de performance reduzida. Nunca bloqueia.',k:['540p','worker','LRU']}},
 {id:'j7',x:665,y:465,w:230,h:95,l:'render',t:'Waveform e cenas',s:'Áudio desenhado, cortes sugeridos.',
  d:{q:'Calcula a forma de onda e detecta mudanças de cena para sugerir pontos de corte.',p:'Detecção de cena é cálculo barato com ganho alto de tempo. É o tipo de recurso que parece IA e não é.',te:'Waveform por picos em múltiplas resoluções. Detecção de cena por diferença de histograma.',f:'Falha: a track mostra bloco liso sem forma de onda. Edição continua.',k:['picos','histograma']}},
 {id:'j8',x:985,y:465,w:230,h:95,l:'core',t:'Editor pronto',s:'Documento montado. A partir daqui, zero rede.',
  d:{q:'A cena de edição com o layout escolhido pela receita ou pelo último uso.',p:'O ponto onde o produto é o produto. Toda interação daqui para frente responde em menos de 16ms ou é um job com estado visível. Não existe meio termo.',te:'Layout restaurado por projeto. Painéis colapsáveis com estado persistido localmente.',f:'Nenhuma: é estado local.',k:['16ms ou job']}},

 {id:'j9',x:25,y:700,w:230,h:95,l:'core',t:'Cortar e arrastar',s:'Síncrono. Nunca pode ter loading.',
  d:{q:'A interação mais frequente do produto: mover, cortar, esticar, reordenar.',p:'Se isso tiver qualquer latência perceptível, o produto é considerado ruim por inteiro, não importa quantos recursos de IA existam.',te:'Comando coalescido por janela de tempo. Resolução de timeline por índice de intervalo, alvo abaixo de 1ms com 1.000 clipes.',f:'Não aplicável: é cálculo local em memória.',k:['síncrono','coalescência']}},
 {id:'j10',x:345,y:700,w:230,h:95,l:'cat',t:'Aplicar efeito',s:'Pack local? Aplica. Senão, baixa primeiro.',dec:1,
  d:{q:'Decisão de catálogo. Se o descritor e o shader já estão em cache, aplicação é instantânea.',p:'A vitrine mostra o que já está local de forma distinta do que precisa baixar. O usuário sabe antes de clicar se vai esperar.',te:'Ícone de download no item remoto. Download sob demanda, retomável, com aplicação otimista assim que o shader chega.',f:'Sem rede: itens remotos aparecem esmaecidos com rótulo "precisa de conexão". O pack base continua inteiro.',k:['local vs remoto','otimista']}},
 {id:'j11',x:665,y:700,w:230,h:95,l:'ai',t:'Pedir IA',s:'O roteador decide onde executa.',dec:1,
  d:{q:'Remover fundo, legendar, reduzir ruído, interpolar. O roteador mede o device e escolhe.',p:'A decisão é tomada antes de gastar o tempo do usuário, não no meio. E quando o caminho é servidor, o preço aparece antes do clique de confirmação.',te:'Heurística por memória, GPU e tamanho do trabalho. Resultado em cache por sessão.',f:'Em dúvida, device em resolução menor. Servidor nunca sem consentimento explícito.',k:['roteador','preço antes do clique']}},
 {id:'j12',x:985,y:700,w:230,h:95,l:'render',t:'Preview',s:'Loop contínuo a 60fps. O coração do produto.',
  d:{q:'Composição em tempo real do frame atual com todos os efeitos aplicados.',p:'Qualidade percebida mora aqui. Um preview que engasga faz o usuário desconfiar do export, mesmo quando o export está correto.',te:'WebGPU, cadeia de passes sem round trip para CPU, cache de três níveis.',f:'Perda de contexto de GPU: recria e redesenha. Piscar, não perda.',k:['60fps','WebGPU']}},

 {id:'j13',x:25,y:830,w:230,h:95,l:'ai',t:'Executa no device',s:'Sem fila, sem crédito, sem upload.',
  d:{q:'Caminho padrão. O modelo roda localmente via ONNX Runtime.',p:'Custo marginal zero para você. Privacidade real para o usuário. É a frase de posicionamento inteira.',te:'Progresso por frame ou por bloco. Cancelável a qualquer momento sem deixar resíduo.',f:'Memória insuficiente no meio: cai para resolução menor e avisa, em vez de travar o app.',k:['custo zero','cancelável']}},
 {id:'j14',x:345,y:830,w:230,h:95,l:'infra',t:'Vai para fila',s:'Só com consentimento. Preço na tela antes.',
  d:{q:'Caminho de exceção: upscale 4K, modelo grande, device fraco.',p:'O usuário vê o que será enviado, por quanto tempo fica armazenado e quanto custa, antes de confirmar. Essa tela é a diferença entre confiança e desinstalação.',te:'Outbox local, chave de idempotência, upload só do trecho necessário e não do projeto inteiro.',f:'Fila fora: fica no outbox com estado "aguardando conexão". Nada se perde.',k:['consentimento','outbox','trecho']}},
 {id:'j15',x:665,y:830,w:230,h:95,l:'cat',t:'Baixa o pack',s:'Retomável. Aplicação otimista.',
  d:{q:'Download do shader e dos assets do item escolhido.',p:'Aplicação otimista: o efeito entra na timeline com placeholder e é substituído quando chega. O usuário continua editando.',te:'Verificação por hash. Retomada de download interrompido.',f:'Hash divergente: descarta, tenta outra origem, e só então avisa.',k:['retomável','otimista']}},
 {id:'j16',x:985,y:830,w:230,h:95,l:'core',t:'Ajusta e refaz',s:'Undo confiável. O ciclo real da edição.',
  d:{q:'O loop onde o usuário passa 90% do tempo: aplicar, olhar, desfazer, ajustar.',p:'Undo que falha uma vez destrói a confiança do usuário em experimentar. E experimentar é o que faz ele descobrir o valor do produto.',te:'Histórico por comando, não por diff de estado. Persistido junto com o documento.',f:'Comando que falha não entra no histórico. Documento nunca em estado parcial.',k:['undo por comando']}},

 {id:'j17',x:25,y:1160,w:230,h:95,l:'shell',t:'Exportar',s:'Resolução, formato, destino. Preset primeiro.',
  d:{q:'A decisão final. Presets por destino (Reels, TikTok, YouTube, arquivo) à frente dos controles avançados.',p:'A maioria dos usuários quer "vertical para Reels", não bitrate. Os controles existem, mas depois do preset.',te:'Presets com resolução, taxa de bits e codec coerentes com cada plataforma.',f:'Destino indisponível: salva local e oferece reenviar depois.',k:['preset por destino']}},
 {id:'j18',x:345,y:1160,w:230,h:95,l:'render',t:'Local ou servidor?',s:'Decisão. Local é o padrão sempre que couber.',dec:1,
  d:{q:'Avalia resolução, duração, efeitos pesados e capacidade do device.',p:'Local é grátis para você e mais rápido para ele. O servidor é exceção justificada, nunca conveniência de arquitetura.',te:'Critério declarado: acima de 4K com mais de 3 efeitos de GPU pesados em device sem WebGPU, sugere servidor.',f:'Local falha no meio: salva o parcial e oferece retomar ou mandar para o servidor.',k:['local primeiro','retomável']}},
 {id:'j19',x:665,y:1160,w:230,h:95,l:'render',t:'Render em background',s:'O usuário continua editando outro projeto.',
  d:{q:'O export roda em worker ou processo separado, com progresso visível e cancelável.',p:'Prender a tela durante 4 minutos de export é a diferença entre uma ferramenta e um incômodo. Quem edita, edita em lote.',te:'Worker dedicado no web, processo separado no desktop. Notificação do sistema ao terminar.',f:'App fechado no meio: o job é retomável no próximo boot, a partir do último segmento.',k:['background','notificação do SO']}},
 {id:'j20',x:985,y:1160,w:230,h:95,l:'user',t:'Pronto',s:'Arquivo no disco. Compartilhar é opcional.',
  d:{q:'Fim do fluxo principal. O arquivo existe, com ou sem conta, com ou sem internet.',p:'Terminar sem depender de nada remoto é a prova da arquitetura. Se isso falhar, a camada errada ficou no caminho crítico.',te:'Notificação com ação direta: abrir pasta, abrir arquivo, compartilhar.',f:'Nenhuma: o arquivo já está no disco.',k:['independente de rede']}}
],

k:[
 {x:0,y:1480,w:648,c:'accent',b:'Receitas: como sair de doze cliques para cinco',
  h:'Uma receita é um pipeline nomeado disparado da Home. <b>"Legendar e cortar pausas"</b> executa: importar, gerar proxy, transcrever, detectar silêncio, cortar, montar a track de legenda e abrir no layout de legenda. Um clique.<br><br>O usuário ajusta <b>depois</b>, com o resultado na tela. O erro clássico é pedir a configuração antes, quando ele ainda não viu nada e não sabe o que quer.<br><br>É o mesmo conceito dos sete layouts do CapCut, levado um passo adiante: o layout já vem com o trabalho feito.'},
 {x:682,y:1480,w:648,c:'render',b:'A regra dos 16 milissegundos',
  h:'Qualquer interação se encaixa em uma de duas caixas, sem terceira opção:<br><br><b>Abaixo de 16ms:</b> cortar, arrastar, scrub, zoom, selecionar, desfazer. Síncrono, sem spinner, sem exceção.<br><br><b>Acima de 2s:</b> vira job com estado visível, cancelável e retomável. Acima de 30s, libera a UI e notifica no fim.<br><br>A faixa entre 16ms e 2s é onde moram os bugs de percepção: rápido demais para justificar spinner, lento demais para parecer instantâneo. Resolva com <b>feedback otimista</b>, aplicando o resultado esperado e corrigindo se falhar.'}
],
t:[
 {x:0,y:1700,w:900,cap:'Cliques até o objetivo principal: vídeo vertical legendado, pronto para publicar',

]

head:{x:0,y:0,w:780,kick:'Entrada, processamento, armazenamento, descarte',
  t:'Ciclo de vida do dado',
  p:'A decisão que governa este quadro é uma só: mídia bruta não sobe por padrão. Isso zera o custo de armazenamento no lançamento, elimina a maior superfície de risco de privacidade e vira argumento comercial. O que sobe, sobe por exceção consentida e morre em 24 horas.'},

 {x:0,y:460,w:1290,h:230,t:'Processa',c:'render',i:'Device por padrão. Servidor por exceção consentida.'},
 {x:0,y:730,w:1290,h:230,t:'Armazena',c:'cat',i:'Local é a fonte de verdade. Nuvem é réplica opcional.'},
 {x:0,y:1000,w:1290,h:230,t:'Descarta',c:'ent',i:'Prazo declarado para cada classe. Apagamento efetivo.'}

n:[
 {id:'d1',x:25,y:245,w:235,h:100,l:'user',t:'Mídia bruta',s:'Vídeo, áudio e imagem do usuário. Fica no disco dele.',
  d:{q:'O arquivo original. Entra por referência: o projeto guarda caminho mais hash, nunca uma cópia.',p:'Um projeto de 20 minutos em 4K passa de 40 GB. Copiar isso para dentro do app é desperdício de disco; subir é desperdício de banda, de dinheiro e de confiança.',te:'Hash incremental em worker. Relocalização automática por conteúdo se o arquivo mudar de lugar.',f:'Arquivo apagado: clipe em estado "mídia ausente" com botão de relocalizar. O documento permanece íntegro.',k:['por referência','nunca sobe','hash']}},
 {id:'d2',x:278,y:245,w:235,h:100,l:'core',t:'Ações de edição',s:'Cada clique vira um comando nomeado.',
  d:{q:'A sequência de comandos que constrói o vídeo. É o dado mais valioso do sistema e o menor.',p:'Dá undo determinístico, serve de telemetria de uso real sem instrumentação extra, e é o que viabilizaria colaboração depois sem reescrever nada.',te:'Comandos serializáveis. Log desde o último snapshot.',f:'Log corrompido: volta ao último snapshot íntegro. Perde minutos, nunca o projeto.',k:['comando','undo','telemetria']}},
 {id:'d3',x:531,y:245,w:235,h:100,l:'cat',t:'Material de catálogo',s:'Efeitos, fontes, sons, LUTs, templates.',
  d:{q:'Descritor JSON mais assets. Pack base vem no instalador, extras baixam sob demanda.',p:'Única classe que exige rede, e mesmo assim só para o que está além do pack base.',te:'Imutável e endereçado por hash, então cache pode ser longo.',f:'CDN fora: pack base intacto, extras marcados como indisponíveis.',k:['imutável','pack base']}},
 {id:'d4',x:784,y:245,w:235,h:100,l:'ent',t:'Conta e cobrança',s:'E-mail, plano, histórico de pagamento.',
  d:{q:'O mínimo necessário. Sem telefone, sem endereço, sem documento no lançamento.',p:'Cada campo coletado é um campo a proteger, a justificar na LGPD e a apagar quando pedirem. Coletar menos é mais barato e mais seguro.',te:'Postgres. Dado de cartão nunca toca o seu servidor: fica no provedor (Stripe ou Pagar.me).',f:'Banco indisponível: login por token em cache continua. Compra nova espera.',k:['mínimo necessário','LGPD','tokenização']}},
 {id:'d5',x:1037,y:245,w:235,h:100,l:'infra',t:'Telemetria',s:'Evento anônimo de uso e de erro.',
  d:{q:'Qual recurso foi usado, quanto tempo levou, em qual device, o que falhou. Sem conteúdo do vídeo, nunca.',p:'Sozinho, sem equipe de suporte, isso é o único jeito de descobrir que um shader quebra num driver específico ou que o export falha num codec.',te:'Opt out visível nas preferências. Identificador de instalação, não de pessoa.',f:'Coletor fora: buffer local com teto. Enche, descarta o mais antigo. Nunca afeta o app.',k:['anônimo','opt out','buffer com teto']}},

 {id:'d6',x:25,y:515,w:235,h:100,l:'render',t:'Decode e proxy',s:'No device. Worker separado.',
  d:{q:'Gera proxy 540p, miniaturas e waveform. Prioridade abaixo do preview.',p:'É o que entrega os 60fps de scrub. Roda em segundo plano para não atrasar o início da edição.',te:'WebCodecs quando disponível, FFmpeg nativo no desktop. Worker dedicado.',f:'Falha: edita no original com aviso de performance.',k:['worker','540p']}},
 {id:'d7',x:278,y:515,w:235,h:100,l:'ai',t:'IA on device',s:'ONNX Runtime. Nada sai da máquina.',
  d:{q:'Matting, transcrição, denoise, interpolação. Modelo baixa uma vez e fica em cache.',p:'Esse é o ponto onde a arquitetura vira posicionamento: "seu material não sai do seu computador" é verdade verificável, não slogan.',te:'ONNX Runtime Web com WebGPU, nativo no mobile. Modelos quantizados.',f:'Memória insuficiente: resolução menor com aviso, ou oferta do caminho servidor.',k:['ONNX','cache de modelo']}},
 {id:'d8',x:531,y:515,w:235,h:100,l:'infra',t:'IA em servidor',s:'Exceção. Só o trecho necessário sobe.',
  d:{q:'Upscale 4K, modelo grande, device incapaz. Sobe o trecho, não o projeto.',p:'Enviar o trecho e não o arquivo inteiro reduz upload, custo e exposição ao mesmo tempo. É a diferença entre subir 40 MB e subir 40 GB.',te:'Recorte no device antes do upload. Chave de idempotência. URL assinada de validade curta.',f:'Falha no worker: retry com backoff, depois dead letter com motivo visível ao usuário.',k:['só o trecho','idempotência']}},
 {id:'d9',x:784,y:515,w:235,h:100,l:'render',t:'Export local',s:'O caminho padrão. Custo de servidor: zero.',
  d:{q:'Render final no device, com FFmpeg nativo no desktop ou WebCodecs na web.',p:'Cada export local é dinheiro que você não gasta. Na projeção de ano 1, é a diferença entre centenas e milhares de reais por mês.',te:'Job em background, retomável, com notificação do sistema.',f:'Falha no meio: parcial salvo, job retomável, ou oferta de mandar ao servidor.',k:['custo zero','retomável']}},
 {id:'d10',x:1037,y:515,w:235,h:100,l:'ent',t:'Resolução de acesso',s:'Servidor decide. Cliente obedece.',
  d:{q:'A lição central do CapCut: o entitlement é calculado no servidor, por item, e normalizado para um booleano antes de chegar na UI.',p:'Permite mudar preço e pacote sem release. E impede que trocar um flag local libere qualquer coisa, porque o export pago revalida.',te:'TTL curto na resposta. Revalidação obrigatória no export server side.',f:'Fora do ar: cache dentro do TTL vale, sem cache cai no gratuito.',k:['por item','TTL','revalida']}},

 {id:'d11',x:25,y:785,w:235,h:100,l:'core',t:'Projeto (EDL)',s:'JSON de dezenas de KB. Local é a verdade.',
  d:{q:'O documento completo do vídeo, sem mídia. Um projeto de 20 minutos cabe em 40 KB.',p:'Tamanho pequeno é o que permite snapshot frequente, undo barato e sync instantâneo quando ele existir.',te:'Escrita atômica, snapshot a cada 30 comandos mais 1 por minuto. Sync opcional como réplica, nunca como fonte.',f:'Disco cheio: para de gravar, avisa claramente, mantém em memória.',k:['40 KB','atômico','réplica opcional']}},
 {id:'d12',x:278,y:785,w:235,h:100,l:'render',t:'Cache de mídia',s:'Proxies, miniaturas, waveforms. Descartável.',
  d:{q:'Tudo que pode ser recalculado a partir do original.',p:'Por ser derivado, pode ser apagado sem perda. Isso resolve o problema de disco crescendo sem controle.',te:'LRU com teto configurável nas preferências. Padrão: 20 GB no desktop, 2 GB no mobile.',f:'Apagado por fora: regenera no próximo uso.',k:['derivado','LRU','teto']}},
 {id:'d13',x:531,y:785,w:235,h:100,l:'cat',t:'Packs baixados',s:'Imutável, endereçado por hash.',
  d:{q:'Shaders, fontes, sons e LUTs que o usuário baixou.',p:'Imutabilidade permite cache longo e dispensa invalidação, que é uma das fontes mais comuns de bug sutil.',te:'Cache por hash. Expiração por desuso, não por tempo.',f:'Cache corrompido: hash não bate, baixa de novo.',k:['imutável','hash']}},
 {id:'d14',x:784,y:785,w:235,h:100,l:'infra',t:'Bucket temporário',s:'Só mídia de job server side. TTL de 24h.',
  d:{q:'O único lugar onde material do usuário fica em infraestrutura sua, e por tempo curto.',p:'Prazo curto com apagamento efetivo é compromisso de privacidade, controle de custo e redução de risco jurídico, tudo com uma regra só.',te:'Cloudflare R2, egress zero, regra de ciclo de vida de 24h. Apagamento efetivo, não lógico.',f:'Storage fora: jobs server side falham, nada local é afetado.',k:['TTL 24h','R2','hard delete']}},
 {id:'d15',x:1037,y:785,w:235,h:100,l:'ent',t:'Dados de conta',s:'Postgres. Mínimo, com prazo de exclusão.',
  d:{q:'Conta, assinatura, histórico de cobrança e consentimentos.',p:'Guardar o mínimo pelo menor tempo possível simplifica LGPD e reduz o estrago de qualquer incidente.',te:'Postgres gerenciado, backup diário com retenção de 30 dias, criptografia em repouso.',f:'Réplica de leitura assume. Escrita entra em modo degradado com fila.',k:['mínimo','backup 30d','LGPD']}},

 {id:'d16',x:25,y:1055,w:235,h:100,l:'ent',t:'Lixeira de projeto',s:'30 dias. Depois, purga efetiva.',

BOARDS.push({
id:'espera', nome:'Espera', num:'05',
head:{x:0,y:0,w:800,kick:'Onde o usuário espera e como ele é avisado',
  t:'Jobs, loadings e erro',
  p:'Três perguntas respondidas aqui: onde teremos espera longa, o que acontece na tela enquanto isso, e como uma API que falha avisa sem quebrar nada. A regra que governa tudo: abaixo de 16ms é síncrono, acima de 2s é job com estado, acima de 30s libera a tela e notifica.'},
g:[
 {x:0,y:190,w:1340,h:220,t:'Máquina de estados do job',c:'infra',i:'Seis estados. Qualquer job do sistema usa esta máquina.'},
 {x:0,y:450,w:1340,h:330,t:'Erro de API: três níveis de aviso',c:'ent',i:'O nível é escolhido pelo custo do erro para o usuário, não pelo código HTTP.'}
],
n:[
 {id:'q1',x:30,y:250,w:185,h:85,l:'infra',t:'queued',s:'No outbox local ou na fila.',term:1,
  d:{q:'O job foi criado e persistido localmente antes de qualquer chamada de rede.',p:'Esse é o padrão outbox e resolve o caso mais comum de perda: o usuário pede, a rede cai, e ninguém sabe se chegou.',te:'Chave de idempotência gerada no cliente. Posição na fila visível quando o servidor responde.',f:'Fila fora: fica aqui com rótulo "aguardando conexão". Nada se perde.',k:['outbox','idempotência']}},
 {id:'q2',x:245,y:250,w:185,h:85,l:'infra',t:'running',s:'Com progresso real, não indeterminado.',term:1,
  d:{q:'Executando no device ou no worker. Progresso por frame, bloco ou segmento.',p:'Barra indeterminada é a pior UI de espera que existe: não dá informação e faz tudo parecer travado. Se dá para contar, conte.',te:'Progresso por servidor enviado via SSE. No device, por callback do worker.',f:'Sem progresso disponível: mostra tempo decorrido e etapa atual, nunca uma barra girando sozinha.',k:['progresso real','SSE']}},
 {id:'q3',x:460,y:250,w:185,h:85,l:'ok',t:'succeeded',s:'Resultado aplicado. Notificação se demorou.',term:1,
  d:{q:'Resultado disponível e já aplicado no documento quando faz sentido.',p:'Se o job passou de 30s, o usuário provavelmente saiu da tela. Notificação do sistema com ação direta traz ele de volta ao ponto exato.',te:'Notificação nativa no desktop e mobile, aba com indicador na web.',f:'Resultado aplicado sobre documento já alterado: entra como comando normal, portanto reversível com undo.',k:['notificação','reversível']}},
 {id:'q4',x:675,y:250,w:185,h:85,l:'ent',t:'failed',s:'Com motivo em português e ação possível.',term:1,
  d:{q:'Falhou após esgotar as tentativas. O usuário vê o que houve e o que pode fazer.',p:'"Erro 500" não é mensagem, é desistência. Toda falha precisa dizer o que falhou, o que já foi salvo e qual o próximo passo.',te:'Dead letter após 5 tentativas com backoff exponencial. Motivo traduzido e registrado.',f:'Nunca descarta trabalho sem avisar. O parcial fica disponível.',k:['dead letter','motivo claro']}},
 {id:'q5',x:890,y:250,w:185,h:85,l:'infra',t:'cancelled',s:'Cancelável sempre. Sem resíduo.',term:1,
  d:{q:'Usuário cancelou. Recursos liberados, parciais apagados, cobrança não acontece.',p:'Job que não dá para cancelar faz o usuário fechar o app na marra, e aí você perde o estado inteiro em vez de um job.',te:'Sinal de cancelamento propagado até o worker. Limpeza garantida por finally, não por caminho feliz.',f:'Cancelamento não propaga: o job expira pelo TTL e nada é cobrado.',k:['sem resíduo','sem cobrança']}},
 {id:'q6',x:1105,y:250,w:185,h:85,l:'infra',t:'expired',s:'TTL de 24h. Entrada e saída apagadas.',term:1,
  d:{q:'Passou o prazo. Tudo que estava no bucket temporário foi removido de fato.',p:'Prazo declarado na tela de consentimento e cumprido por regra de ciclo de vida do bucket, não por rotina de aplicação que pode falhar sem ninguém ver.',te:'Regra no R2. Alerta de observabilidade se o volume de storage não cair como esperado.',f:'Regra falha: o custo de storage é o sinal, e o alerta dispara antes de virar problema.',k:['TTL 24h','regra do bucket']}},

 {id:'er1',x:30,y:510,w:400,h:110,l:'ok',t:'Nível 1 · Inline',s:'O erro vive dentro do componente que falhou. Não interrompe.',
  d:{q:'Catálogo que não carregou, miniatura que falhou, item indisponível, campo inválido.',p:'A maioria dos erros é local e recuperável. Tirar o usuário do fluxo para avisar algo que ele pode ignorar é desrespeito com o tempo dele.',te:'Estado de erro no próprio card ou lista, com botão de tentar de novo. Resto da tela intacto.',f:'É o tratamento de falha, não o que falha.',k:['não interrompe','retry no lugar']}},
 {id:'er2',x:450,y:510,w:400,h:110,l:'warn',t:'Nível 2 · Toast',s:'Informa algo que mudou fora da tela atual. Some sozinho.',
  d:{q:'Job terminou, sincronização falhou, voltou a ficar offline, pack baixado.',p:'Informação que o usuário precisa saber mas não precisa agir agora. Toast com ação opcional, nunca com botão obrigatório.',te:'Fila de toasts com teto de 3 simultâneos. Duração proporcional ao tamanho do texto. Ação opcional embutida.',f:'É o tratamento de falha.',k:['efêmero','ação opcional']}},
 {id:'er3',x:870,y:510,w:420,h:110,l:'ent',t:'Nível 3 · Modal',s:'Só quando o usuário perderia trabalho ou dinheiro.',
  d:{q:'Disco cheio durante gravação, sessão expirada com alterações não salvas, cobrança que falhou, exclusão definitiva.',p:'Modal é o recurso mais caro da interface porque bloqueia. Usar para aviso comum treina o usuário a fechar sem ler, e aí ele fecha o que importava.',te:'Sempre com duas saídas nomeadas pela consequência: "Salvar em outro lugar" e "Continuar sem salvar", nunca "OK" e "Cancelar".',f:'É o tratamento de falha.',k:['bloqueia','duas saídas nomeadas']}},

 {id:'er4',x:30,y:650,w:1260,h:105,l:'accent',t:'A regra única: toda mensagem de erro responde três coisas',
  s:'1. O que falhou, em palavra que o usuário reconhece, não em nome de componente.  ·  2. O que já foi salvo, porque o medo real é perder trabalho.  ·  3. O que ele pode fazer agora, com o botão ao lado da frase.  ·  Nunca: código HTTP cru, stack trace, nome de serviço interno, ou a palavra "inesperado".',
  d:{q:'O contrato de escrita de erro do produto inteiro.',p:'Erro é o momento em que o usuário mais precisa de clareza e é onde quase todo produto escreve pior. Fazer isso bem custa texto, não código, e é o diferencial mais barato que existe.',te:'Catálogo de mensagens centralizado, com chave por causa e não por código. Testado com os mesmos critérios de qualquer componente.',f:'Causa sem mensagem catalogada: mensagem genérica honesta mais identificador do evento para suporte. Nunca inventa uma explicação.',k:['3 perguntas','sem jargão','sem stack trace']}}
],

k:[
 {x:0,y:1230,w:655,c:'render',b:'A faixa perigosa: entre 16ms e 2 segundos',
  h:'Rápido demais para justificar spinner, lento demais para parecer instantâneo. É onde a percepção de qualidade se perde sem ninguém saber por quê.<br><br>Solução: <b>feedback otimista</b>. Aplica o resultado esperado na hora e corrige se falhar. Vale para aplicar efeito, salvar, renomear, reordenar.<br><br>O risco é reverter visivelmente. Mitigação: só otimize onde a taxa de falha é comprovadamente baixa, e quando reverter, explique no mesmo lugar onde o otimismo apareceu.'},
 {x:685,y:1230,w:655,c:'ai',b:'O caso específico da IA: preview progressivo',
  h:'Remover fundo em um clipe de 30s leva de 10 a 60 segundos no device. Esperar isso com barra é ruim, mas mandar embora também: o usuário precisa <b>validar a qualidade</b> antes de confiar.<br><br>Padrão: processa <b>os 3 primeiros segundos primeiro</b>, mostra na hora, e continua o resto em background. Ele aprova ou cancela em 4 segundos em vez de 60.<br><br>Isso corta o custo do erro. Hoje, no CapCut, errar o recurso de IA custa crédito que não estorna: <code>pc_ai_expand_m10n_popup_desc_stop_generate_credits_consumed</code> diz literalmente que as imagens não serão geradas e os créditos ainda serão consumidos.'}
],

     ['Baixar pack remoto','<span class="num">2 a 15 s</span>','<span class="pill wa">Job curto</span>','Placeholder na timeline mais progresso no item'],
     ['Remover fundo (device)','<span class="num">10 a 60 s</span>','<span class="pill wa">Job com preview</span>','3 primeiros segundos prontos em 4s para validar'],

     ['Export 4K em servidor','<span class="num">5 a 20 min</span>','<span class="pill da">Assíncrono</span>','Pode fechar o app. Notificação e e-mail'],

BOARDS.push({
id:'acesso', nome:'Acesso', num:'06',
head:{x:0,y:0,w:820,kick:'A lição central do CapCut, com a economia invertida',
  t:'Entitlement e cobrança',
  p:'A mecânica é copiada: servidor decide por item, cliente resolve e obedece, UI lê um booleano. O que muda é o que fica atrás do muro. No CapCut, o que roda na máquina do usuário é pago. Aqui, o que roda na máquina do usuário é grátis, porque custa zero para você.'},
g:[
 {x:0,y:190,w:1300,h:430,t:'Resolução do acesso em runtime',c:'ent',i:'Mesmo desenho do CapCut 9.5.0.4050, com o campo de decisão vindo do servidor.'}
],
n:[
 {id:'g1',x:30,y:250,w:280,h:110,l:'cat',t:'Catálogo devolve o item',s:'Metadados em lote de 50, como o mget_item.',
  d:{q:'A vitrine pede metadados em lote. Cada item traz sua descrição e, separadamente, sua condição comercial.',p:'Lote de 50 evita N+1 e mantém a vitrine fluida. A separação entre descrição e condição é o que permite mudar preço sem reprocessar catálogo.',te:'POST /v1/catalog/mget. Resposta com ETag. Condição comercial em bloco próprio, com TTL próprio.',f:'Catálogo fora: cache local mais pack base. A vitrine mostra estado offline.',k:['lote de 50','ETag','TTL']}},
 {id:'g2',x:340,y:250,w:280,h:110,l:'ent',t:'Servidor resolve a condição',s:'Por conta e por item. Nunca no cliente.',
  d:{q:'Dada a conta e a lista de itens, o servidor devolve o que ela pode usar. É o equivalente ao commercial_strategy mais paid_strategy_list do CapCut.',p:'A decisão não pode viver no cliente porque o cliente é modificável. Trocar o flag localmente não libera nada, já que o export pago e a publicação revalidam do lado do servidor.',te:'Resposta com TTL curto. Cache no cliente respeitando o TTL. Revalidação obrigatória no export server side.',f:'Dentro do TTL, o cache vale (fail-open curto). Sem cache, cai no gratuito (fail-closed). Nunca o contrário.',k:['por item','fail-closed','revalida no export']}},
 {id:'g3',x:650,y:250,w:280,h:110,l:'ent',t:'Normaliza para um booleano',s:'A UI nunca vê a estratégia crua.',
  d:{q:'Copiado literalmente: business_info.json = { is_vip: isVip }. Qualquer que seja a forma da resposta, a interface lê um campo só.',p:'Permite trocar o modelo comercial inteiro, de assinatura para pacote, de pacote para avulso, sem tocar em um componente de tela. Também dá compatibilidade retroativa de graça, exatamente como o código do CapCut faz ao cair no is_vip antigo quando commercial_strategy vem indefinido.',te:'Função pura, testada, com caminho legado explícito. Formato desconhecido assume gratuito.',f:'Formato novo não reconhecido: gratuito mais evento de telemetria. Falha segura.',k:['um booleano','função pura','legado explícito']}},
 {id:'g4',x:960,y:250,w:280,h:110,l:'shell',t:'UI aplica ou oferece',s:'Com marca d água, nunca com bloqueio seco.',
  d:{q:'Item liberado entra no projeto. Item não liberado entra com marca, igual ao areaLocked/AmazingFeature do CapCut, que é uma cena de efeito completa e não um alerta.',p:'O usuário vê o resultado antes de decidir. Esconder o recurso atrás de um cadeado impede justamente a experiência que justificaria o pagamento.',te:'Shader de marca aplicado na cadeia de preview. Removido no export quando o entitlement confirma.',f:'Shader de marca falha: export server side bloqueia. Marca ausente nunca pode virar export limpo.',k:['marca d água','prova antes da compra']}},
 {id:'g5',x:30,y:400,w:280,h:110,l:'ent',t:'Revalidação no export',s:'O único momento que não aceita cache.',
  d:{q:'Antes de gerar o arquivo final sem marca, o servidor confirma o direito, ignorando qualquer cache local.',p:'É o fecho do sistema. Sem ele, todo o resto é decoração: bastaria editar um JSON local. Com ele, o cliente pode ser adulterado à vontade sem liberar nada que custe dinheiro.',te:'Chamada obrigatória, sem cache, com o identificador do projeto e a lista de itens pagos usados.',f:'Fora do ar no momento do export: export local com marca, mais oferta de refazer depois sem marca. Nunca libera por omissão.',k:['sem cache','fecho do sistema']}},
 {id:'g6',x:340,y:400,w:280,h:110,l:'ent',t:'Webhook de cobrança',s:'Fonte de verdade do plano. Não o redirect.',
  d:{q:'O estado da assinatura vem por webhook do provedor, com verificação de assinatura e processamento idempotente.',p:'Confiar na tela de sucesso é o mesmo erro de confiar no cliente para decidir o preço. A aba fecha, a rede cai, e o estado diverge silenciosamente.',te:'Verificação de assinatura, idempotência por identificador de evento, fila de retry e reconciliação diária.',f:'Webhook perdido: a reconciliação diária corrige em até 24h. O usuário nunca fica pagando sem acesso.',k:['webhook','idempotente','reconciliação']}},
 {id:'g7',x:650,y:400,w:280,h:110,l:'ai',t:'Sem créditos de IA',s:'A decisão que o CapCut não pode tomar.',
  d:{q:'Nenhum contador, nenhuma cota, nenhuma unidade a comprar. IA on device é ilimitada no plano gratuito.',p:'O CapCut precisa de crédito porque a IA dele roda em servidor com custo real por operação. Se a sua roda no device, cobrar crédito seria inventar fricção. Crédito gera ansiedade de uso, ticket de suporte e abandono, e as traduções pt BR mostram o pior caso: crédito consumido mesmo quando a geração é interrompida.',te:'Único limite é o hardware do usuário, e ele é informado antes, não no meio.',f:'Não aplicável: não existe o mecanismo.',k:['sem cota','sem crédito','posicionamento']}},
 {id:'g8',x:960,y:400,w:280,h:110,l:'ent',t:'Permissões de criador',s:'Segundo sistema, separado do consumo.',
  d:{q:'Publicar template, publicar efeito, destacar na vitrine. É whitelist por conta, não assinatura.',p:'O CapCut separa os dois sistemas e isso é correto: EffectSetVip é permissão de publicação, não gate de consumidor. Misturar os dois é o erro clássico que leva a "assinante pode publicar qualquer coisa".',te:'Lista de capacidades habilitadas por conta, filtrada por is_enable. Mesmo desenho do enable_list observado no publish-text-effect.',f:'Serviço fora: publicação indisponível com aviso. Consumo não é afetado.',k:['whitelist','publicação ≠ consumo']}}
],

k:[
 {x:0,y:1070,w:640,c:'accent',b:'Por que isso é defensável e não é promoção',
  h:'O CapCut <b>não pode copiar</b> "sem crédito, sem cota, sem upload" sem destruir a própria receita, porque a IA dele é server side por decisão de arquitetura, e cada operação tem custo marginal real.<br><br>Sua vantagem é estrutural, não comercial. Isso é raro e vale mais que qualquer desconto.<br><br><b>O limite honesto:</b> só vale enquanto a IA on device entregar qualidade comparável. Para matting (RMBG-2.0, BiRefNet) e legenda (Whisper), hoje entrega. Para geração de vídeo, não entrega e não vai entregar tão cedo. Esse é o recorte real do produto.'},
 {x:670,y:1070,w:630,c:'ent',b:'Risco que precisa ser dito',
  h:'Se o plano pago for só "export 4K mais packs extras", a conversão será baixa. O gratuito resolve o caso completo, e é isso que a arquitetura entrega de propósito.<br><br>Isso não é defeito, é a escolha. Mas obriga a <b>receita a vir de onde o valor é maior</b>: equipe (vários editores no mesmo projeto), marca (templates e kit da empresa) e volume (lote, API, integração).<br><br>Em outras palavras: o modelo de consumidor paga pouco. O modelo que fecha conta é o de pequena empresa que produz vídeo toda semana. Isso muda o público alvo, não só o preço. Veja o quadro <b>Veredito</b>.'}
],

 {x:0,y:660,w:1300,cap:'O corte entre gratuito e pago, derivado do custo marginal real',

head:{x:0,y:0,w:810,kick:'Se o componente X cai, o que para?',

  p:'A pergunta certa não é se algo vai cair, é o que fica de pé quando cair. Esta arquitetura tem um único ponto de falha total, o disco do usuário, e ele não é seu. Todo o resto degrada em funcionalidade, nunca em disponibilidade do editor.'},
g:[

n:[
 {id:'f1',x:30,y:250,w:255,h:100,l:'core',t:'Núcleo de edição',s:'Em memória. Sem rede, sem disco no caminho quente.',
  d:{q:'Se isso falha, o produto falha. É a única parte sem rede de segurança possível.',p:'Por isso é TypeScript puro, sem framework e sem DOM: a superfície de falha é a menor possível e a cobertura de teste pode ser quase total.',te:'Mitigação: invariantes verificadas em desenvolvimento, cobertura alta nos caminhos de comando, teste baseado em propriedade para a resolução de timeline.',f:'Exceção não tratada: captura no limite do comando, descarta o comando, mantém o documento. Nunca deixa o documento em estado parcial.',k:['sem rede','teste por propriedade']}},
 {id:'f2',x:303,y:250,w:255,h:100,l:'core',t:'Autosave',s:'Se isso falha, o usuário perde trabalho.',
  d:{q:'O segundo componente sem tolerância. Perder trabalho uma vez custa o usuário.',p:'A causa mais comum não é bug, é disco cheio. E é a que mais produto trata mal, gravando pela metade e corrompendo o projeto.',te:'Escrita atômica: grava em temporário e renomeia. Nunca sobrescreve direto. Verifica espaço antes de começar.',f:'Disco cheio: para de gravar, modal de nível 3 com duas saídas nomeadas, mantém em memória. Jamais grava parcial.',k:['escrita atômica','modal nível 3']}},
 {id:'f3',x:30,y:370,w:255,h:100,l:'render',t:'Motor de render',s:'Falha é visível e localizada.',
  d:{q:'Perda de contexto de GPU, shader que não compila, driver com bug.',p:'Falha de GPU é comum e específica de hardware. Precisa ser tratada como evento esperado, não como exceção.',te:'Recria o dispositivo e redesenha a partir do documento. Fallback WebGL2 se WebGPU falhar duas vezes seguidas.',f:'Clipe que não renderiza fica preto com marcador de erro. O resto da timeline continua.',k:['recria dispositivo','fallback WebGL2']}},
 {id:'f4',x:303,y:370,w:255,h:100,l:'cat',t:'Pack base',s:'Embarcado. Não existe cenário de indisponibilidade.',
  d:{q:'Efeitos, fontes, sons e LUTs que vão no instalador.',p:'É a apólice de seguro contra qualquer falha de rede. Enquanto ele existir, o usuário termina o vídeo.',te:'Verificação de integridade no boot. Reinstalável a partir do instalador.',f:'Arquivo corrompido no disco: regenera do instalador ou baixa, com aviso.',k:['embarcado','seguro']}},
 {id:'f5',x:30,y:480,w:528,h:80,l:'accent',t:'Ponto único de falha total: o disco do usuário',s:'Se o disco dele morre, nada do que você construir resolve. É o limite honesto da arquitetura local first, e a razão de existir sync opcional como réplica.',
  d:{q:'O custo da escolha local first. Em troca de custo zero de servidor e privacidade real, a durabilidade fica com o usuário.',p:'Precisa ser dito na cara, não escondido. E é exatamente o gancho do plano pago: sync de projeto como réplica, não como fonte de verdade.',te:'Sync opcional replica o EDL (dezenas de KB), nunca a mídia. Barato de operar, alto valor percebido.',f:'É o cenário sem saída. Mitigação é oferecer a réplica, não prometer o que não dá para cumprir.',k:['limite honesto','réplica paga']}},

 {id:'f6',x:680,y:250,w:310,h:100,l:'cat',t:'CDN de catálogo cai',s:'Impacto: packs novos indisponíveis.',

 {id:'f7',x:1010,y:250,w:310,h:100,l:'ent',t:'Autenticação cai',s:'Impacto: login novo. Sessão existente continua.',
  d:{q:'Nenhuma sessão nova pode ser criada.',p:'Token em cache com validade de 7 dias offline cobre praticamente todo o uso real. Quem já está dentro não percebe.',te:'Grace period de 7 dias. Modo convidado sempre disponível para quem não tem sessão.',f:'<b>Degradação:</b> quem está dentro continua. Quem chega entra como convidado e edita.',k:['grace 7 dias','convidado']}},
 {id:'f8',x:680,y:360,w:310,h:100,l:'infra',t:'Fila de jobs cai',s:'Impacto: nada. O outbox segura.',
  d:{q:'Jobs server side não são despachados.',p:'O padrão outbox garante que a intenção foi persistida localmente antes de qualquer chamada. Nada se perde, só atrasa.',te:'Outbox local com retry e backoff. Estado visível: "aguardando conexão".',f:'<b>Degradação:</b> jobs aguardam. Tudo que é on device continua sem nenhum impacto.',k:['outbox','nada se perde']}},
 {id:'f9',x:1010,y:360,w:310,h:100,l:'infra',t:'Workers de GPU caem',s:'Impacto: fila cresce. Caminho local liberado.',
  d:{q:'Jobs ficam em queued e a fila cresce.',p:'O usuário vê a posição e a estimativa, e tem sempre a alternativa on device na mesma tela.',te:'Escala a zero significa que a recuperação é automática quando a capacidade volta.',f:'<b>Degradação:</b> espera visível mais alternativa local oferecida no mesmo lugar.',k:['fila visível','alternativa local']}},
 {id:'f10',x:680,y:470,w:310,h:100,l:'ent',t:'Entitlement cai',s:'Impacto: a regra assimétrica resolve.',
  d:{q:'Não dá para resolver quem pode usar o quê.',p:'A assimetria é deliberada. Cache válido continua valendo, porque tirar acesso de quem pagou por uma falha sua é inaceitável. Sem cache, cai no gratuito, porque liberar pago por falha sua é prejuízo.',te:'Fail-open dentro do TTL, fail-closed fora dele. Export pago sempre revalida, nunca aceita cache.',f:'<b>Degradação:</b> quem pagou continua. Quem chega vê o gratuito, que resolve o caso completo.',k:['fail-open no TTL','fail-closed fora']}},
 {id:'f11',x:1010,y:470,w:310,h:100,l:'infra',t:'Banco cai',s:'Impacto: escrita de conta. Leitura segue por réplica.',
  d:{q:'Cadastro, mudança de plano e sync de projeto param.',p:'Nada disso está no caminho de editar. O editor sequer percebe.',te:'Réplica de leitura assume. Escrita entra em modo degradado com fila e reconciliação.',f:'<b>Degradação:</b> somente leitura com banner. Edição local intacta.',k:['réplica','modo leitura']}}
],

 {x:0,y:1030,w:655,c:'accent',b:'O princípio que organiza tudo acima',
  h:'<b>Nenhuma camada de rede está no caminho de abrir, editar ou exportar.</b><br><br>Esse foi o critério de desenho, não uma consequência feliz. A camada 5 (acesso e cobrança) ficou <i>embaixo</i> da camada 4 (catálogo) justamente para que nada acima dependa dela.<br><br>No CapCut, a camada de rede é caminho crítico: sem internet o app vira casca, porque não há catálogo embarcado nem IA on device. A diferença não é de competência, é de modelo de negócio. Eles podem pagar essa dependência, você não.'},
 {x:685,y:1030,w:655,c:'infra',b:'O que medir para saber que está funcionando',
  h:'Métrica de resiliência não é uptime do servidor, é <b>a fração de sessões que terminaram num arquivo exportado</b>, cruzada com o estado de rede da sessão.<br><br>Se a taxa de export cair junto com uma queda de serviço, a arquitetura vazou: alguma coisa remota entrou no caminho crítico sem ninguém notar. Esse é o alarme que importa.<br><br>Alvo: <b>sessões offline devem ter a mesma taxa de export que sessões online.</b> Qualquer diferença é um bug de arquitetura, não de infraestrutura.'}

BOARDS.push({
id:'seguranca', nome:'Segurança', num:'08',
head:{x:0,y:0,w:810,kick:'Autenticação, segredos e o que nunca sai do servidor',
  t:'Segurança e acesso',
  p:'OAuth2 Authorization Code com PKCE em todos os clientes, porque desktop, mobile e web são clientes públicos e nenhum deles consegue guardar segredo. Token de acesso curto, refresh rotativo com detecção de reuso, e nenhuma credencial de terceiro no cliente, jamais.'},
g:[
 {x:0,y:190,w:1340,h:290,t:'Fluxo de autenticação (Authorization Code + PKCE)',c:'ent',i:'O mesmo fluxo nas três plataformas. Diferença só no cofre.'},
 {x:0,y:520,w:1340,h:270,t:'Onde cada segredo mora',c:'infra',i:'Regra: se o cliente consegue ler, não é segredo.'}
],
n:[
 {id:'a1',x:30,y:250,w:230,h:95,l:'shell',t:'1. Gera o verifier',s:'Aleatório no cliente. Nunca trafega.',
  d:{q:'O cliente gera um valor aleatório (code_verifier) e envia só o hash dele (code_challenge) no pedido de autorização.',p:'É o que impede que um app malicioso instalado na mesma máquina intercepte o código de autorização e troque por token. Sem PKCE, o deeplink de retorno é um buraco aberto.',te:'43 a 128 caracteres de aleatoriedade criptográfica. SHA-256 como método de desafio, nunca "plain".',f:'Falha de geração: aborta o login com erro claro. Nunca cai para fluxo sem PKCE.',k:['PKCE','S256','cliente público']}},
 {id:'a2',x:278,y:250,w:230,h:95,l:'ent',t:'2. Autoriza',s:'Navegador do sistema, nunca WebView embutida.',
  d:{q:'Abre a tela de login no navegador padrão do sistema operacional.',p:'WebView embutida permite ao app ler o que o usuário digita, e por isso Google e Apple recusam esse fluxo. Além de bloqueado, é prática ruim: quebra o gerenciador de senha e o 2FA do usuário.',te:'ASWebAuthenticationSession no iOS, Custom Tabs no Android, navegador padrão no desktop via Tauri.',f:'Navegador indisponível: mostra URL e código para digitar em outro device.',k:['navegador do sistema','sem WebView']}},
 {id:'a3',x:526,y:250,w:230,h:95,l:'ent',t:'3. Troca por token',s:'Código mais verifier. Só então vem o token.',
  d:{q:'O cliente apresenta o código recebido junto do code_verifier original. O servidor confere contra o challenge.',p:'Essa conferência é o que amarra o código ao cliente que iniciou o fluxo. Código interceptado sem o verifier é inútil.',te:'Access token JWT de 15 minutos. Refresh token opaco, rotativo.',f:'Verifier não bate: recusa e registra. Possível tentativa de interceptação.',k:['JWT 15min','refresh opaco']}},
 {id:'a4',x:774,y:250,w:230,h:95,l:'ent',t:'4. Guarda',s:'Keychain do sistema. Nunca localStorage.',
  d:{q:'Onde o refresh token descansa em cada plataforma.',p:'Token em localStorage é roubado por qualquer XSS. É a falha mais comum em aplicação web e a mais barata de evitar: custa uma linha de configuração.',te:'Web: cookie HttpOnly com SameSite=Strict, access só em memória. Desktop: Tauri Stronghold ou keychain do SO. Mobile: Keychain iOS e Keystore Android.',f:'Cofre inacessível: sessão só em memória, expira ao fechar, com aviso ao usuário.',k:['HttpOnly','Stronghold','Keystore']}},
 {id:'a5',x:1022,y:250,w:230,h:95,l:'ent',t:'5. Rotaciona',s:'Reuso detectado revoga a família inteira.',
  d:{q:'Cada uso do refresh token emite um novo e invalida o anterior. Se um token já usado reaparecer, toda a família de tokens daquela sessão é revogada.',p:'É o que transforma roubo de refresh token em incidente detectável em vez de acesso permanente e silencioso.',te:'Família de tokens com identificador comum. Reuso dispara revogação e notificação ao usuário.',f:'Revogação por falso positivo: o usuário faz login de novo. Incômodo pequeno, proteção alta.',k:['rotação','detecção de reuso']}},
 {id:'a6',x:30,y:370,w:478,h:95,l:'ent',t:'Autorização: escopo por conta, verificado no servidor a cada chamada',
  s:'Token de acesso válido não significa permissão para a ação. O servidor verifica escopo e propriedade do recurso em toda requisição, mesmo nas que a UI já escondeu.',
  d:{q:'Autenticação diz quem é. Autorização diz o que pode. São checagens separadas e a segunda nunca pode ser delegada ao cliente.',p:'Esconder um botão não é controle de acesso, é organização visual. A falha mais explorada em API é justamente o endpoint que confia na UI.',te:'Verificação de propriedade em toda operação sobre recurso identificado. Escopo no token é teto, nunca permissão final.',f:'Falha na checagem: nega por padrão. Nunca libera por exceção não tratada.',k:['nega por padrão','propriedade do recurso']}},
 {id:'a7',x:526,y:370,w:478,h:95,l:'infra',t:'Rate limit por conta e por IP, com 429 que o cliente respeita',
  s:'Janela deslizante na borda. Resposta com Retry-After, e o cliente espera de verdade em vez de insistir.',
  d:{q:'Proteção contra abuso, enumeração de conta e custo descontrolado de GPU.',p:'Sem limite por conta, uma única conta pode esgotar a sua capacidade de GPU e a sua conta bancária numa tarde.',te:'Limite separado para autenticação (mais rígido), catálogo e jobs. Cliente implementa backoff exponencial respeitando Retry-After.',f:'Limite atingido: mensagem com o tempo de espera, não erro genérico.',k:['429','Retry-After','backoff']}},

 {id:'s1',x:30,y:580,w:255,h:95,l:'infra',t:'Chaves de API de terceiro',s:'Secrets manager. Nunca no cliente, nunca no repositório.',
  d:{q:'Credenciais de provedor de pagamento, e-mail, storage e qualquer serviço externo.',p:'Chave em cliente é chave pública: basta abrir o bundle. Chave em repositório vive para sempre no histórico do git, mesmo depois de removida.',te:'AWS Secrets Manager, Doppler ou Infisical. Injeção por variável de ambiente no deploy. Rotação programada. Varredura de segredo no CI, bloqueando o merge.',f:'Secrets manager fora: as instâncias já rodando mantêm o que carregaram. Deploy novo espera.',k:['secrets manager','rotação','varredura no CI']}},
 {id:'s2',x:303,y:580,w:255,h:95,l:'infra',t:'Chave de assinatura de JWT',s:'Só no servidor de autenticação. Rotação com janela.',
  d:{q:'A chave privada que assina os tokens de acesso.',p:'Vazou, o atacante emite token de qualquer conta. É o segredo mais crítico do sistema inteiro.',te:'Assimétrica (RS256 ou EdDSA): só o emissor assina, os verificadores usam a pública. Rotação com JWKS e período de sobreposição.',f:'Rotação malfeita derruba todas as sessões. Por isso a janela de sobreposição não é opcional.',k:['RS256','JWKS','sobreposição']}},
 {id:'s3',x:576,y:580,w:255,h:95,l:'cat',t:'URL assinada de CDN',s:'Validade curta para material pago.',
  d:{q:'Acesso temporário aos bytes de um pack pago.',p:'Sem isso, descobrir uma URL vale compartilhar o material inteiro. Com validade curta, o link vazado morre antes de circular.',te:'Assinatura com validade de 5 minutos, vinculada à conta. Pack gratuito usa URL pública com cache longo.',f:'Relógio do cliente errado: aceita janela de tolerância pequena, com mensagem clara se expirar.',k:['5 minutos','por conta']}},
 {id:'s4',x:849,y:580,w:255,h:95,l:'ent',t:'Dado de cartão',s:'Nunca toca o seu servidor.',
  d:{q:'Número, validade e código de segurança.',p:'Tokenização no provedor tira você inteiro do escopo de PCI. É a diferença entre uma auditoria cara e nenhuma auditoria.',te:'Elementos hospedados do Stripe ou Pagar.me. Você armazena apenas o identificador do cliente e o do método.',f:'Provedor fora: compra nova indisponível. Assinatura ativa não é afetada.',k:['tokenização','fora do PCI']}},
 {id:'s5',x:1122,y:580,w:190,h:95,l:'ai',t:'Modelos de IA',s:'Públicos. Verificados por hash.',
  d:{q:'Os pesos ONNX que descem para o device.',p:'Não são segredo (são modelos abertos), mas são vetor de ataque: um modelo trocado executa no device do usuário.',te:'Verificação de hash na carga. Origem fixa e declarada. Sem carregar modelo de URL arbitrária.',f:'Hash divergente: recusa carregar e avisa. Nunca executa modelo não verificado.',k:['hash','origem fixa']}},
 {id:'s6',x:30,y:695,w:1282,h:80,l:'accent',t:'A regra que resolve 90% das decisões de segredo neste sistema',
  s:'Se o cliente consegue ler, não é segredo. Se não é segredo, não pode proteger nada. Todo controle que importa (entitlement, cobrança, publicação, export pago) é verificado no servidor, e a verificação do cliente existe só para dar boa experiência, nunca para dar garantia.',
  d:{q:'O princípio derivado direto da engenharia reversa: o CapCut não guarda a decisão de preço no cliente, e por isso adulterar o cliente não libera nada.',p:'Essa é a única postura que sobrevive a um cliente que pode ser descompilado, e todo cliente pode. Assumir isso desde o começo é mais barato que descobrir depois.',te:'Revalidação obrigatória nos pontos que custam dinheiro: export sem marca, upload para GPU, publicação.',f:'Revalidação indisponível: nega a operação paga e oferece a alternativa local. Nunca libera por omissão.',k:['nega por padrão','cliente não garante']}}
],
e:[
 {f:'a1',t:'a2'},{f:'a2',t:'a3'},{f:'a3',t:'a4'},{f:'a4',t:'a5'},{f:'a5',t:'a3',l:'novo ciclo',k:'d'}
],
k:[
 {x:0,y:1130,w:440,c:'ent',b:'OWASP: o que de fato se aplica aqui',
  h:'<b>Controle de acesso quebrado:</b> maior risco do sistema. Mitigado por verificação de propriedade em toda operação.<br><b>Falha criptográfica:</b> TLS obrigatório, criptografia em repouso, nenhum segredo no cliente.<br><b>Injeção:</b> consultas parametrizadas sempre. Nome de arquivo e caminho vindos do usuário são tratados como hostis.<br><b>Desenho inseguro:</b> endereçado pela assimetria fail-open e fail-closed do entitlement.<br><b>SSRF:</b> relevante por causa de import por URL. Lista de permissão de destino, nunca lista de bloqueio.'},
 {x:470,y:1130,w:440,c:'render',b:'Riscos específicos de um editor de vídeo',
  h:'<b>Arquivo de mídia malformado:</b> decodificador é superfície clássica de exploração. Mitigação: decodificar em worker isolado, com limite de memória e tempo, e nunca no processo principal.<br><br><b>Shader vindo do catálogo:</b> código executando na GPU do usuário. Mitigação: shader só de origem assinada, compilado com validação, nunca de URL arbitrária.<br><br><b>Projeto compartilhado:</b> um EDL é dado estruturado vindo de terceiro. Validação de schema estrita e caminho de mídia tratado como não confiável.'},
 {x:940,y:1130,w:400,c:'infra',b:'O que fazer antes do primeiro usuário real',

  h:'A biblioteca de material é tabela densa no desktop (miniatura, nome, duração, formato, tamanho, data, ações) e precisa caber em 390px.<br><br><b>Regra de transposição:</b> cada linha da tabela vira um card com três níveis. <b>Primário</b> (miniatura e nome) sempre visível. <b>Secundário</b> (duração e formato) na mesma linha, menor. <b>Terciário</b> (tamanho, data, caminho) só ao expandir.<br><br>Ordenação e filtro, que no desktop são cabeçalho de coluna, viram uma barra de controle no topo. <b>Nenhum dado desaparece</b>, a hierarquia é que muda. Esconder coluna no mobile é o erro comum: o usuário procura o que sumiu e não encontra.'},
 {x:685,y:1270,w:655,c:'shell',b:'O que aprender de quem já faz isso bem',

 {id:'c1',x:30,y:485,w:245,h:100,l:'shell',t:'Botão',s:'Cinco estados, inclusive carregando e desabilitado com motivo.',
  d:{q:'Padrão, secundário, fantasma, perigo. Estados: repouso, foco, hover, carregando, desabilitado.',p:'Botão desabilitado sem explicação é a falha de usabilidade mais comum em software. Se está desabilitado, o tooltip diz por quê e o que fazer para habilitar.',te:'shadcn/ui. O código fica no seu repositório, então o estado "desabilitado com motivo" é adicionado sem fork de biblioteca.',f:'Carregando sem resposta por mais de 10s: vira estado de erro com retry.',k:['5 estados','motivo no desabilitado']}},

 {id:'c3',x:556,y:485,w:245,h:100,l:'shell',t:'Diálogo e popover',s:'Foco preso, Escape fecha, foco volta ao gatilho.',

 {id:'c4',x:819,y:485,w:245,h:100,l:'shell',t:'Tabela e lista',s:'Virtualizada. Dez mil itens sem travar.',

 {id:'c5',x:1082,y:485,w:228,h:100,l:'shell',t:'Feedback',s:'Toast, inline e modal. Três níveis, regra clara.',

 {id:'o2',x:358,y:725,w:310,h:100,l:'infra',t:'Cartão de job',s:'A máquina de estados do quadro Espera, em componente.',

 {id:'o3',x:686,y:725,w:310,h:100,l:'ent',t:'Oferta contextual',s:'Aparece no ponto de uso, com o resultado já na tela.',

 {id:'o4',x:1014,y:725,w:296,h:100,l:'shell',t:'Painel de propriedades',s:'Muda com a seleção. Painel lateral ou folha inferior.',

 {id:'x1',x:30,y:965,w:310,h:110,l:'render',t:'Timeline',s:'Canvas, não DOM. O componente mais caro do projeto.',

 {id:'x3',x:686,y:965,w:310,h:110,l:'render',t:'Editor de curvas',s:'Keyframe, easing, curva de volume.',

 {id:'x4',x:1014,y:965,w:296,h:110,l:'render',t:'Scrubber e navegação',s:'Precisão de frame com atalhos.',

e:[],
k:[
 {x:0,y:1420,w:655,c:'accent',b:'Decisão: shadcn/ui sobre Radix, com Tailwind',

 {id:'pc2',x:914,y:250,w:402,h:160,l:'user',tag:['req'],
  t:'O que você confirmou no briefing',
  s:'Desktop e mobile, tablet quando fizer sentido. Uso diário por profissionais e por quem precisa editar rápido. Prevenção de perda de trabalho. Área de edição com tudo fácil de localizar.',
  d:{sec:[
   ['Requisitos','<ul><li>Plataformas: desktop e mobile; tablet quando aplicável.</li><li>Público: profissionais e pessoas que precisam editar de forma rápida e eficiente, em uso diário.</li><li>Área de edição com pré visualização, timeline, ferramentas, biblioteca de mídia e propriedades claramente identificáveis.</li><li>Desempenho percebido, estados de processamento e prevenção contra perda de trabalho.</li><li>Mobile com experiência própria, nunca redução do desktop.</li><li>Estrutura antes da aparência, em duas etapas.</li></ul>'],
   ['O que está ambíguo','<p>"Profissionais" e "quem precisa editar rápido" descrevem produtos com interfaces opostas. Um pede densidade e precisão de quadro, o outro pede poucos passos e escolhas prontas. É a decisão D02.</p>'],
   ['O que é lista para avaliar, não requisito','<p>Os 19 módulos da seção 5 do briefing. Você pediu para não assumir que todos entram. A avaliação está no quadro D4.</p>']]}},

 {id:'sg1',x:24,y:530,w:305,h:190,l:'user',tag:['hip','rec'],
  t:'S1 · Criador solo e pequeno negócio',
  s:'Publica vídeo curto toda semana. Grava no celular, edita entre outras tarefas e quer o vídeo vertical legendado em minutos. Recomendado como principal.',
  d:{sec:[
   ['Tarefa que faz alguém usar o produto','<p>Quando gravo um vídeo falando para a câmera, quero transformar em vídeo vertical, legendado e sem pausas em menos de 15 minutos, para publicar no mesmo dia.</p>'],
   ['Por que recomendo como principal','<ul><li>As duas tarefas mais caras desse público, legendar e remover fundo, são exatamente o que a IA no aparelho resolve sem custo.</li><li>É o segmento que o quadro Veredito aponta como pagante: quem produz vídeo toda semana.</li><li>O caso cabe no celular e no desktop, como o briefing pede.</li></ul>'],
   ['Risco','<p>É o território mais disputado do mercado. O CapCut atende esse público de graça. O diferencial precisa aparecer no primeiro uso, não na página de preço.</p>'],
   ['Como validar','<p>Lacuna L01: cinco conversas curtas com pessoas desse perfil.</p>']]}},
 {id:'sg2',x:349,y:530,w:305,h:190,l:'user',tag:['hip'],
  t:'S2 · Social media e agência',
  s:'Edita para vários clientes, no notebook. Precisa repetir a identidade de cada marca e produzir em volume. Secundário.',
  d:{sec:[
   ['Tarefa','<p>Quando entrego vídeos para cinco clientes por semana, quero aplicar o estilo de cada marca sem refazer do zero, para manter consistência sem gastar horas.</p>'],
   ['Por que secundário','<p>Tem a maior disposição a pagar (kit de marca, volume, equipe), mas depende de recursos de V2: templates de marca, biblioteca entre projetos, exportação em lote. A V1 só precisa não fechar a porta: projeto como unidade e estilos reaproveitáveis em vez de valores soltos.</p>']]}},
 {id:'sg3',x:674,y:530,w:305,h:190,l:'user',tag:['hip'],
  t:'S3 · Editor avançado',
  s:'Vídeo longo, várias câmeras, correção de cor, precisão de quadro. Vive no desktop, com atalhos. Fora da V1.',
  d:{sec:[
   ['Recomendação','<p>Fora da V1.</p>'],
   ['Por que','<ul><li>Compete de frente com DaVinci Resolve, que é gratuito, e com Premiere.</li><li>Trilhas livres em quantidade multiplicam o custo da timeline, que já é o componente mais caro do projeto (quadro 10 da arquitetura).</li><li>Desenhar para ele deixa a interface densa demais para S1, que é quem a proposta atende melhor.</li></ul>'],
   ['O que preservar dele mesmo assim','<p>Atalhos de teclado e precisão de quadro no desktop. Custam pouco e não atrapalham S1.</p>']]}},
 {id:'sg4',x:999,y:530,w:317,h:190,l:'ent',tag:['bb','lac'],
  t:'S4 · Público da marca ICARUS',
  s:'Pessoas a partir de 20 anos que sabem que têm potencial e se sentem travadas. Público aprovado no brand book. Encaixe a validar.',
  d:{sec:[
   ['O que o brand book diz','<p>A arquitetura de marca aprovada em 26.09.2026 tem três frentes: rotina (App ICARUS), hobby (ICARUS TOM) e presença (ICARUS Scent). Editor de vídeo não está nela.</p>'],
   ['Leitura possível, minha','<p>O encaixe seria o verbo "fazer" da estratégia: quem trava para começar a publicar porque editar dá trabalho. A promessa herdada "menos atrito entre intenção e ação" descreve bem um editor rápido. Isso é interpretação minha e não está escrito no brand book.</p>'],

 {id:'p1',x:24,y:840,w:305,h:105,l:'core',tag:['bb'],t:'Conforto: acolher antes de exigir',

 {id:'p2',x:349,y:840,w:305,h:105,l:'core',tag:['bb'],t:'Clareza: uma coisa grande, o resto pequeno',

 {id:'p3',x:674,y:840,w:305,h:105,l:'core',tag:['bb'],t:'Controle: o usuário decide',

 {id:'p4',x:999,y:840,w:317,h:105,l:'core',tag:['bb'],t:'Constância: o retorno importa',

 {id:'p5',x:24,y:960,w:305,h:105,l:'core',tag:['bb'],t:'Sem punição: a falha é dado',

n:[
 {id:'d01',x:24,y:250,w:305,h:120,l:'shell',tag:['dec'],dcs:'D01',
  t:'D01 · Escopo da V1',
  s:'Recomendo: editor enxuto de vídeo curto, com a fatia mínima marcada dentro dele.',
  d:{sec:[
   ['A pergunta','<p>O que a V1 do produto cobre, e onde fica a fatia mínima recomendada no quadro Veredito?</p>'],
   ['Opções','<ul><li><strong>A.</strong> Os 19 módulos da sua lista, completos.</li><li><strong>B.</strong> Editor V1 enxuto para vídeo curto: o essencial dos 19, timeline simplificada e os recursos de IA.</li><li><strong>C.</strong> Só a fatia mínima: remover fundo e legendar, sem timeline.</li></ul>'],
   ['Recomendação','<p><strong>B</strong>, com as telas da fatia C marcadas dentro dela.</p>'],
   ['Por que','<p>A leva a uma V1 que compete com o DaVinci em profundidade e com o CapCut em amplitude ao mesmo tempo. C valida mercado mas não é um editor, e o seu briefing pede timeline, área de edição e propriedades. B desenha o editor que você descreveu, cortado ao que o segmento principal usa. A ordem dos wireframes entrega primeiro as telas da fatia C: se você decidir construir só ela, o desenho fica pronto antes do resto.</p><p>Mantenho a leitura do quadro Veredito: construir tudo agora atrasa a sua meta financeira. Desenhar é outra conta: custa semanas, e o resultado vira portfólio de produto.</p>'],
   ['O que muda se você aprovar','<p>28 unidades de wireframe em vez de cerca de 40. O que está marcado V2 no quadro D4 fica fora desta etapa.</p>']]}},
 {id:'d02',x:349,y:250,w:305,h:120,l:'shell',tag:['dec'],dcs:'D02',
  t:'D02 · Usuário principal',
  s:'Recomendo: S1 criador e pequeno negócio. S2 como evolução, S3 fora da V1.',
  d:{sec:[
   ['A pergunta','<p>Para quem a V1 é desenhada primeiro, e o que "profissionais" significa no seu briefing?</p>'],
   ['Opções','<ul><li><strong>A.</strong> S1, criador e pequeno negócio.</li><li><strong>B.</strong> S3, editor avançado.</li><li><strong>C.</strong> Os dois por igual.</li></ul>'],
   ['Recomendação','<p><strong>A</strong>, com S2 como evolução natural e S3 fora da V1.</p>'],
   ['Por que','<p>Os dois públicos do briefing pedem interfaces opostas: densidade e precisão contra poucos passos e escolhas prontas. Desenhar para os dois por igual produz uma interface densa demais para S1 e rasa demais para S3.</p><p>Se "profissional" significa a pessoa de social media que edita para clientes (S2), a recomendação atende. Se significa editor de vídeo de carreira (S3), preciso saber agora, porque muda a timeline, a densidade e a ordem dos wireframes.</p>'],
   ['O que muda se você aprovar','<p>Define a densidade padrão, o modelo de timeline (D04) e o que fica a um toque ou recolhido.</p>']]}},
 {id:'d05',x:674,y:250,w:305,h:120,l:'shell',tag:['dec','arq'],dcs:'D05',
  t:'D05 · Receitas como entrada principal',
  s:'Recomendo: duas receitas em destaque na Início. Projeto em branco disponível, em segundo plano.',
  d:{sec:[
   ['A pergunta','<p>A Início leva primeiro a receitas (sequências prontas) ou a um projeto em branco?</p>'],
   ['Opções','<ul><li><strong>A.</strong> Receitas em destaque, projeto em branco disponível.</li><li><strong>B.</strong> Projeto em branco em destaque, receitas como atalho.</li></ul>'],
   ['Recomendação','<p><strong>A</strong>, com duas receitas na V1: "Legendar e cortar pausas" e "Remover fundo".</p>'],
   ['Por que','<p>É o que leva o objetivo principal de 12 para 4 interações (quadro Jornada da arquitetura). Mostra o valor do produto no primeiro uso, em vez de entregar uma timeline vazia para quem nunca editou. O risco é a receita virar ruído se for fraca; por isso só duas, ligadas às tarefas T1, T3 e T4.</p>'],
   ['O que muda se você aprovar','<p>A Início ganha uma área de receitas acima dos projetos. Cada receita abre o editor já no layout certo, com o trabalho feito.</p>']]}},
 {id:'d06',x:999,y:250,w:317,h:120,l:'shell',tag:['dec','arq'],dcs:'D06',
  t:'D06 · Conta obrigatória',
  s:'Recomendo: editar e exportar sem conta. Conta só para servidor, sincronização e cobrança.',
  d:{sec:[
   ['A pergunta','<p>Editar exige cadastro?</p>'],
   ['Opções','<ul><li><strong>A.</strong> Não. Conta só quando o recurso exige.</li><li><strong>B.</strong> Conta no primeiro uso.</li></ul>'],
   ['Recomendação','<p><strong>A</strong>.</p>'],
   ['Por que','<p>Pedir cadastro antes do primeiro resultado é o ponto de abandono mais caro de um app criativo. A arquitetura local first permite isso sem custo, porque o projeto vive no aparelho. Também é o princípio Conforto.</p>'],
   ['O que muda se você aprovar','<p>Login sai do fluxo principal e vira tela transversal (seção 8). Custo: menos dado de uso identificado até a pessoa criar conta.</p>']]}},
 {id:'d07',x:24,y:390,w:305,h:120,l:'shell',tag:['dec','hip'],dcs:'D07',
  t:'D07 · Formato e duração de referência',
  s:'Recomendo: vertical 9:16 como padrão. Interface pensada para até 3 minutos, sem quebrar até 15.',
  d:{sec:[
   ['A pergunta','<p>Qual o formato padrão de projeto e a duração de vídeo que a interface otimiza?</p>'],
   ['Recomendação','<p>Vertical 9:16 como padrão, trocável a qualquer momento. Interface otimizada para vídeos de até 3 minutos e funcional até 15.</p>'],
   ['Por que','<p>Define quantos segundos cabem na tela da timeline, o tamanho das miniaturas e o tempo de processamento das receitas. É uma hipótese sobre S1. Acima de 15 minutos o caso já é S3.</p>'],
   ['Lacuna','<p>Não há dado real de duração típica. Validar nas conversas da L01.</p>']]}},
 {id:'d12',x:349,y:390,w:305,h:120,l:'shell',tag:['dec','rec'],dcs:'D12',
  t:'D12 · Onde os wireframes vivem',
  s:'Recomendo: neste mesmo canvas, com desktop e mobile lado a lado e comentários numerados clicáveis.',
  d:{sec:[
   ['A pergunta','<p>Os wireframes da Etapa 1 são feitos aqui ou no Figma?</p>'],
   ['Opções','<ul><li><strong>A.</strong> Neste canvas: um quadro por seção, wireframes em blocos cinza, numeração no desenho que abre o comentário, interações simuladas marcadas como simuladas, e o mesmo registro de aprovação.</li><li><strong>B.</strong> Figma.</li></ul>'],
   ['Recomendação','<p><strong>A</strong> para a Etapa 1.</p>'],
   ['Por que','<p>Mantém arquitetura, decisões e wireframes num lugar só, com histórico de aprovação. Permite simular abrir painel e trocar estado, que você pediu.</p>'],
   ['Limitação','<p>O conector de design do Figma (plugin) recusou conexão nesta sessão. Há um segundo conector do Figma listado que eu ainda não testei. Avalio para a Etapa 2 se você quiser um arquivo que outro designer edite.</p>']]}},

 {id:'d04',x:24,y:630,w:305,h:120,l:'core',tag:['dec','rec'],dcs:'D04',
  t:'D04 · Modelo de timeline',
  s:'Recomendo: magnética, com trilha principal e o resto preso a ela.',
  d:{sec:[
   ['A pergunta','<p>A timeline é magnética ou de trilhas livres?</p>'],
   ['Opções','<ul><li><strong>A.</strong> Magnética: uma trilha principal onde os clipes se encostam sozinhos. Texto, legenda, áudio e sobreposições ficam presos a ela. Modelo do CapCut e do Final Cut.</li><li><strong>B.</strong> Trilhas livres: várias trilhas independentes, posição livre. Modelo do Premiere e do DaVinci.</li></ul>'],
   ['Recomendação','<p><strong>A</strong>.</p>'],
   ['Por que','<p>Para S1, a magnética elimina os erros mais comuns de quem começa: buraco preto entre clipes e legenda fora de sincronia depois de um corte. Funciona no toque. Trilhas livres dão um controle que S3 quer e S1 não usa, e custam mais no componente mais caro do projeto. É também o que permite uma timeline mobile sem virar outro produto.</p>'],
   ['O que muda se você aprovar','<p>Define a seção 2 inteira e o comportamento de cortar, mover e excluir.</p>']]}},
 {id:'d08',x:349,y:630,w:305,h:120,l:'core',tag:['dec','rec'],dcs:'D08',
  t:'D08 · Organização da mídia',
  s:'Recomendo: mídia por projeto na V1. Biblioteca global entre projetos na V2.',
  d:{sec:[
   ['A pergunta','<p>A mídia mora dentro de cada projeto ou numa biblioteca global?</p>'],
   ['Recomendação','<p>Por projeto na V1. Biblioteca global, com pastas e etiquetas, na V2.</p>'],
   ['Por que','<p>Biblioteca global é um produto dentro do produto: indexação, busca, duplicatas, arquivo que mudou de lugar. S1 importa a gravação do dia, usa e esquece. S2 vai precisar dela, e ela entra junto com o kit de marca.</p>']]}},
 {id:'d09',x:674,y:630,w:305,h:120,l:'core',tag:['dec','rec'],dcs:'D09',
  t:'D09 · Tablet',
  s:'Recomendo: sem layout próprio. Paisagem usa o desktop, retrato usa o mobile.',
  d:{sec:[
   ['A pergunta','<p>Tablet ganha um terceiro layout?</p>'],
   ['Recomendação','<p>Não na V1. Tablet em paisagem usa o layout desktop com alvos de toque ampliados. Em retrato, usa o layout mobile com mais área de preview.</p>'],
   ['Por que','<p>Um terceiro layout aumenta em metade o trabalho de wireframe e de testes para a menor fatia de uso. Os dois layouts cobrem o tablet com ajuste de densidade.</p>'],
   ['Faixas propostas','<ul><li>Até 599 px: mobile.</li><li>De 600 a 1023 px: mobile expandido (tablet em retrato).</li><li>A partir de 1024 px: desktop (tablet em paisagem incluso).</li></ul>']]}},

 {id:'d03',x:24,y:870,w:305,h:120,l:'ent',tag:['dec','bb'],dcs:'D03',
  t:'D03 · Relação com a marca ICARUS',
  s:'Recomendo: decidir antes da Etapa 2. Até lá, EDITICARUS PRO é nome de trabalho.',
  d:{sec:[
   ['A pergunta','<p>O EDITICARUS é submarca da ICARUS ou marca independente?</p>'],
   ['Contexto do brand book','<ul><li>A arquitetura de marca aprovada em 26.09.2026 lista rotina, hobby e presença. Editor de vídeo não está nela.</li><li>O padrão de nome das submarcas é ICARUS mais uma palavra (ICARUS TOM, ICARUS Scent). EDITICARUS PRO foge dele.</li><li>"PRO" puxa para o território de performance que a marca combate. Entre as palavras evitadas estão "alta performance" e "produtividade extrema".</li></ul>'],

const FASES = {legendar:[[0,'Preparando a mídia'],[.15,'Transcrevendo a fala'],[.45,'Detectando pausas'],[.6,'Cortando os silêncios'],[.8,'Montando a legenda']],

const faseDe = (tipo, p) => { const f = FASES[tipo]; let i = 0; f.forEach((x, k) => { if (p >= x[0]) i = k; }); return i; };
function receitaProc(dev){
  const r = S.rec, j = S.jobs.find(x => x.id === r.jid), p = r.step === 'pronto' ? 1 : (j ? j.p : 0), fs = FASES[r.tipo], fi = r.step === 'pronto' ? fs.length : faseDe(r.tipo, p);

      : '<p class="mut" style="margin:0">Fundo removido no clipe inteiro. Você pode desfazer no editor.</p>') : '';
  return '<div class="etb">' + ibtn('back', 'recCancelar', null, 'Cancelar a receita') + '<b class="h3" style="margin-left:6px">' + (r.tipo === 'fundo' ? 'Remover fundo' : 'Legendar e cortar pausas') + '</b></div>' +

/* ---------- timeline ---------- */
function onda(w, h, tot){
  let d = ''; const n = Math.max(1, Math.floor(tot * 12)), mid = h / 2;
  for (let i = 0; i < n; i++){ const x = (i / n * w).toFixed(1), a = ondas[i % ondas.length] * (h / 2 - 3); d += 'M' + x + ' ' + (mid - a).toFixed(1) + 'V' + (mid + a).toFixed(1); }
  return '<svg viewBox="0 0 ' + Math.round(w) + ' ' + h + '" preserveAspectRatio="none" aria-hidden="true"><path d="' + d + '"/></svg>';
}
function faixas(dev, Z, x0){
  const doc = S.doc, L = lay(doc), m = !D(dev);
  const sel = (k, id) => S.sel && S.sel.k === k && S.sel.id === id;
  const clips = doc.clips.map(c => { const x = x0 + L.st[c.id] * Z, w = c.dur * Z, s = sel('clip', c.id);
    return '<div class="el cl' + (s ? ' sel' : '') + '" data-el="clip" data-id="' + c.id + '" style="left:' + (x + 1) + 'px;width:' + Math.max(4, w - 2) + 'px;background-image:url(' + FOTO(c.f) + ')">' +
      '<span class="cl-l">' + esc(ARQ[c.f][0]) + (c.vel !== 1 ? ' · ' + String(c.vel).replace('.', ',') + '×' : '') + (c.fundo ? '<span class="tgx">sem fundo</span>' : '') + '</span>' +
      (s ? '<span class="hdl l" data-hdl="l" data-id="' + c.id + '" title="Aparar o início"></span><span class="hdl r" data-hdl="r" data-id="' + c.id + '" title="Aparar o fim"></span>' : '') + '</div>'; }).join('');
  const item = (cls, k) => v => '<div class="el ' + cls + (sel(k, v.k.id) ? ' sel' : '') + '" data-el="' + k + '" data-id="' + v.k.id + '" style="left:' + (x0 + v.ini * Z + 1) + 'px;width:' + Math.max(4, (v.fim - v.ini) * Z - 2) + 'px" title="' + esc(v.k.t) + '">' + esc(v.k.t) + '</div>';
  const tw = L.tot * Z;

  const d = S.doc, k = S.sel.k;
  if (k === 'clip') return d.clips.find(c => c.id === S.sel.id);
  if (k === 'cap') return d.caps.find(c => c.id === S.sel.id);
  if (k === 'text') return d.texts.find(c => c.id === S.sel.id);

}

function caminho(e, w){ const p = []; while (e && e !== w){ const pai = e.parentElement; if (!pai) return null; p.unshift(Array.prototype.indexOf.call(pai.children, e)); e = pai; } return p; }
function pelo(w, p){ let e = w; for (const i of p){ e = e && e.children[i]; } return e; }
function guardaRolagem(w){
  const out = [];
  w.querySelectorAll('*').forEach(e => { if ((e.scrollTop || e.scrollLeft) && !e.hasAttribute('data-msc')){ const p = caminho(e, w); if (p) out.push([p, e.className, e.scrollTop, e.scrollLeft]); } });
  return out;
}
function poeRolagem(w, l){ l.forEach(([p, cls, t, x]) => { const e = pelo(w, p); if (e && e.className === cls){ e.scrollTop = t; e.scrollLeft = x; } }); }

function render(){

    const fr = ae.closest('[data-dev]');

    if (fr) foco = {dev:fr.dataset.dev, fk:ae.dataset.fk, a, b};
  }
  frames().forEach(w => {
    const rol = guardaRolagem(w);
    w.innerHTML = appHTML(w.dataset.dev);

    const msc = w.querySelector('[data-msc]');

}

function ajusta(){
  if (!ROOT) return;
  const stg = ROOT.querySelector('.p1-stage'), devs = ROOT.querySelector('.p1-devs');
  const wd = ROOT.querySelector('.dvw[data-w="d"]'), wm = ROOT.querySelector('.dvw[data-w="m"]');

  wd.hidden = !vd; wm.hidden = !vm;
  const real = ESC === 'real', estreito = ROOT.clientWidth < 900;
  stg.classList.toggle('real', real);
  devs.classList.toggle('stk', estreito);
  const W = stg.clientWidth - 40, H = stg.clientHeight - 96;
  let kd = 1, km = 1;
  if (!real){
    if (estreito){ kd = Math.min(1, W / 1280); km = Math.min(1, W / 410); }
    else if (vd && vm){ kd = km = Math.max(.3, Math.min(1, (W - 36) / 1690, H / 864)); }
    else if (vd) kd = Math.max(.3, Math.min(1, W / 1280, H / 800));
    else km = Math.max(.3, Math.min(1, W / 410, H / 864));
  }
  K.d = kd; K.m = km;
  wd.style.width = Math.round(1280 * kd) + 'px'; wd.style.height = Math.round(800 * kd) + 'px'; wd.firstElementChild.style.transform = 'scale(' + kd + ')';
  wm.style.width = Math.round(410 * km) + 'px'; wm.style.height = Math.round(864 * km) + 'px'; wm.firstElementChild.style.transform = 'scale(' + km + ')';
}

function pintaCtl(){
  if (!ROOT) return;
  const base = codigoAtual(), ativo = ULT && ULT.base === base ? ULT.id : base;
  ROOT.querySelectorAll('[data-p1="dev"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === S.dev)));

function ctl(a, v, el){
  if (a === 'tog'){ const c = ROOT.querySelector('.p1-ctl'), ab = c.dataset.open !== 'false'; c.dataset.open = ab ? 'false' : 'true'; el.setAttribute('aria-expanded', String(!ab)); ajusta(); return; }

  if (a === 'esc'){ ESC = v; ajusta(); pintaCtl(); return; }
  if (a === 'cena'){ jump(v); return; }
  if (a === 'reset'){ jump('A1'); return; }
  if (a === 'ir'){ if (typeof window.irPara === 'function') window.irPara(v); else location.hash = '#' + v; return; }
  if (a === 'off'){ S.off = el.checked; S.offOk = false; aviso(S.off ? 'Conexão desligada. A edição continua normal.' : 'Conexão de volta. Tarefas na fila sobem sozinhas.', null, null, true, S.off ? 'semrede' : 'check'); if (!S.off) garanteTick(); render(); return; }
  if (a === 'fraco'){ S.fraco = el.checked; return; }

}
function jump(id){
