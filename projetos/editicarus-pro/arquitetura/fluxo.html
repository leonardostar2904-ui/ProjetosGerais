<title>EDITICARUS PRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: casca fixa (topo + trilha de boards) sobre um canvas infinito com pan/zoom,
   painel de detalhe deslizante. Tudo derivado dos tokens abaixo. */
:root{
  --bg:#0C0E12; --grid:#171B22; --surface:#13171D; --surface-2:#1A1F27; --surface-3:#222832;
  --line:#272E39; --line-strong:#3A4451;
  --fg:#E9ECF1; --fg-2:#A8B1BF; --fg-3:#6E7889;
  --accent:#F2A33C; --accent-soft:#3A2B16;
  --l-shell:#5AA9F0; --l-core:#F2A33C; --l-render:#2FC4B2; --l-ai:#A98BF5;
  --l-cat:#58C97A; --l-ent:#F0665A; --l-infra:#8B93A3; --l-user:#E8C84A;
  --ok:#58C97A; --warn:#E0A32E; --danger:#F0665A;
  --shadow:0 10px 30px rgba(0,0,0,.45); --shadow-sm:0 2px 10px rgba(0,0,0,.3);
  --radius:10px;
  --ff-d:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ff-m:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#F3F4F7; --grid:#E3E6EC; --surface:#FFFFFF; --surface-2:#F7F8FA; --surface-3:#EDEFF4;
  --line:#DDE1E9; --line-strong:#BFC6D2;
  --fg:#14181F; --fg-2:#4D5666; --fg-3:#7E8798;
  --accent:#B86C0A; --accent-soft:#FBEFDC;
  --l-shell:#2A7FC9; --l-core:#B86C0A; --l-render:#108275; --l-ai:#6F4CD0;
  --l-cat:#2A8F4C; --l-ent:#C93B2E; --l-infra:#5F6878; --l-user:#9A7D0A;
  --ok:#2A8F4C; --warn:#9A6B08; --danger:#C93B2E;
  --shadow:0 10px 28px rgba(20,24,31,.12); --shadow-sm:0 1px 6px rgba(20,24,31,.1);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#F3F4F7; --grid:#E3E6EC; --surface:#FFFFFF; --surface-2:#F7F8FA; --surface-3:#EDEFF4;
  --line:#DDE1E9; --line-strong:#BFC6D2;
  --fg:#14181F; --fg-2:#4D5666; --fg-3:#7E8798;
  --accent:#B86C0A; --accent-soft:#FBEFDC;
  --l-shell:#2A7FC9; --l-core:#B86C0A; --l-render:#108275; --l-ai:#6F4CD0;
  --l-cat:#2A8F4C; --l-ent:#C93B2E; --l-infra:#5F6878; --l-user:#9A7D0A;
  --ok:#2A8F4C; --warn:#9A6B08; --danger:#C93B2E;
  --shadow:0 10px 28px rgba(20,24,31,.12); --shadow-sm:0 1px 6px rgba(20,24,31,.1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ff-d);overflow:hidden;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------- casca ---------- */
#app{display:flex;flex-direction:column;height:100%}
#top{display:flex;align-items:center;gap:14px;padding:10px 16px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
  background:var(--surface);border-bottom:1px solid var(--line);z-index:30;flex:0 0 auto}
.brand{display:flex;align-items:baseline;gap:9px;min-width:0}
.brand b{font-size:15px;font-weight:800;letter-spacing:-.2px;white-space:nowrap}
.brand b i{font-style:normal;color:var(--accent)}
.brand span{font-family:var(--ff-m);font-size:10.5px;color:var(--fg-3);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
#top .sp{flex:1}
.tbtn{padding:6px 11px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);
  font-size:12px;font-weight:500;color:var(--fg-2);white-space:nowrap}
.tbtn:hover{border-color:var(--line-strong);color:var(--fg)}
.zoomwrap{display:flex;align-items:center;gap:1px;border:1px solid var(--line);border-radius:7px;
  overflow:hidden;background:var(--surface-2)}
.zoomwrap button{padding:6px 10px;font-size:13px;color:var(--fg-2);line-height:1}
.zoomwrap button:hover{background:var(--surface-3);color:var(--fg)}
.zoomwrap span{font-family:var(--ff-m);font-size:10.5px;color:var(--fg-3);padding:0 8px;
  min-width:46px;text-align:center;font-variant-numeric:tabular-nums}

/* ---------- trilha de boards ---------- */
#rail{display:flex;gap:6px;padding:8px 16px;background:var(--surface);
  border-bottom:1px solid var(--line);overflow-x:auto;z-index:25;flex:0 0 auto;
  scrollbar-width:thin}
#rail::-webkit-scrollbar{height:5px}
#rail::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:3px}
.rb{display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:7px;
  border:1px solid transparent;white-space:nowrap;font-size:12px;font-weight:500;color:var(--fg-3)}
.rb:hover{background:var(--surface-2);color:var(--fg-2)}
.rb[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.rb em{font-family:var(--ff-m);font-style:normal;font-size:10px;color:var(--fg-3);
  font-variant-numeric:tabular-nums}
.rb[aria-current="true"] em{color:var(--accent)}

/* ---------- viewport ---------- */
#stage{position:relative;flex:1;overflow:hidden;min-height:0;
  background-color:var(--bg);
  background-image:radial-gradient(circle,var(--grid) 1.1px,transparent 1.1px);
  background-size:26px 26px;cursor:grab;touch-action:none}
#stage.drag{cursor:grabbing}
#world{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
#edges{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}

/* ---------- cabeçalho do board ---------- */
.bhead{position:absolute;max-width:620px}
.bhead h2{margin:0 0 7px;font-size:27px;font-weight:800;letter-spacing:-.6px;text-wrap:balance}
.bhead p{margin:0;font-size:13.5px;line-height:1.6;color:var(--fg-2)}
.bhead .kick{display:inline-block;font-family:var(--ff-m);font-size:10px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--accent);margin-bottom:9px}

/* ---------- grupos (camadas) ---------- */
.grp{position:absolute;border:1px dashed var(--line-strong);border-radius:14px;
  background:color-mix(in srgb,var(--surface) 45%,transparent)}
.grp>b{position:absolute;top:-9px;left:16px;padding:1px 9px;background:var(--bg);
  font-family:var(--ff-m);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--gc,var(--fg-3));font-weight:700}
.grp>i{position:absolute;top:14px;right:16px;font-style:normal;font-size:11px;color:var(--fg-3);
  max-width:46%;text-align:right;line-height:1.45}

/* ---------- nós ---------- */
.n{position:absolute;background:var(--surface);border:1px solid var(--line);
  border-left:3px solid var(--c,var(--line-strong));border-radius:var(--radius);
  padding:11px 13px;box-shadow:var(--shadow-sm);cursor:pointer;text-align:left;
  display:flex;flex-direction:column;gap:4px;transition:transform .12s,box-shadow .12s,border-color .12s}
.n:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--line-strong)}
.n.on{border-color:var(--c,var(--accent));box-shadow:0 0 0 2px color-mix(in srgb,var(--c,var(--accent)) 35%,transparent),var(--shadow)}
.n b{font-size:13px;font-weight:650;letter-spacing:-.15px;line-height:1.3}
.n small{font-size:11px;color:var(--fg-2);line-height:1.45;display:block}
.n .tag{font-family:var(--ff-m);font-size:9px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--c,var(--fg-3));font-weight:700}
.n.dec{border-radius:var(--radius);border-left-width:1px;border-style:solid;
  background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--surface);
  border-color:var(--c,var(--accent));align-items:center;justify-content:center;text-align:center}
.n.dec b{font-size:12px}
.n.sm{padding:9px 11px}
.n.sm b{font-size:12px}
.n.term{border-radius:999px;align-items:center;justify-content:center;text-align:center;
  border-left-width:1px;border-color:var(--c)}
.n.ghost{background:var(--surface-2);border-style:dashed;box-shadow:none;opacity:.9}

/* ---------- notas ---------- */
.note{position:absolute;background:var(--surface-2);border:1px solid var(--line);
  border-top:2px solid var(--c,var(--accent));border-radius:8px;padding:11px 13px;
  font-size:11.5px;line-height:1.55;color:var(--fg-2)}
.note > b:first-child{display:block;color:var(--fg);font-size:11.5px;margin-bottom:5px;font-weight:650}
.note b{color:var(--fg);font-weight:650}
.note code{font-family:var(--ff-m);font-size:10.5px;background:var(--surface-3);
  padding:1px 4px;border-radius:3px;color:var(--fg)}
.note ul{margin:5px 0 0;padding-left:16px}
.note li{margin-bottom:3px}

/* ---------- tabelas no canvas ---------- */
.tbl{position:absolute;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)}
.tbl table{border-collapse:collapse;width:100%;font-size:11.5px}
.tbl caption{text-align:left;padding:10px 13px 9px;font-weight:700;font-size:12.5px;
  background:var(--surface-2);border-bottom:1px solid var(--line)}
.tbl th{text-align:left;padding:7px 13px;font-family:var(--ff-m);font-size:9.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);font-weight:700;
  border-bottom:1px solid var(--line);background:var(--surface-2)}
.tbl td{padding:7px 13px;border-bottom:1px solid var(--line);color:var(--fg-2);
  vertical-align:top;line-height:1.45}
.tbl tr:last-child td{border-bottom:none}
.tbl td:first-child{color:var(--fg);font-weight:550}
.tbl code{font-family:var(--ff-m);font-size:10px;background:var(--surface-3);padding:1px 4px;
  border-radius:3px;color:var(--fg)}
.tbl .num{font-variant-numeric:tabular-nums;font-family:var(--ff-m);font-size:11px}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:9.5px;font-weight:700;
  font-family:var(--ff-m);letter-spacing:.05em;text-transform:uppercase}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.wa{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.da{background:color-mix(in srgb,var(--danger) 18%,transparent);color:var(--danger)}

/* ---------- rótulos de aresta ---------- */
.elab{position:absolute;transform:translate(-50%,-50%);background:var(--bg);
  padding:1px 7px;border-radius:5px;font-family:var(--ff-m);font-size:9.5px;
  color:var(--fg-3);white-space:nowrap;border:1px solid var(--line);pointer-events:none}
.elab.hi{color:var(--accent);border-color:var(--accent)}

/* ---------- painel de detalhe ---------- */
#panel{position:absolute;top:0;right:0;bottom:0;width:min(400px,92vw);background:var(--surface);
  border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:40;
  transform:translateX(101%);transition:transform .22s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;overflow:hidden}
#panel.open{transform:none}
#ph{padding:16px 18px 13px;border-bottom:1px solid var(--line);flex:0 0 auto}
#ph .row{display:flex;align-items:flex-start;gap:12px}
#ph h3{margin:5px 0 0;font-size:18px;font-weight:750;letter-spacing:-.35px;line-height:1.25;flex:1;min-width:0}
#ph .lay{display:inline-block;font-family:var(--ff-m);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;font-weight:700;color:var(--c,var(--accent))}
#pclose{font-size:19px;line-height:1;color:var(--fg-3);padding:3px 6px;flex:0 0 auto}
#pclose:hover{color:var(--fg)}
#pb{padding:16px 18px 32px;overflow-y:auto;flex:1;min-height:0}
#pb section{margin-bottom:17px}
#pb h4{margin:0 0 6px;font-family:var(--ff-m);font-size:9.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--fg-3);font-weight:700}
#pb p{margin:0;font-size:13px;line-height:1.62;color:var(--fg-2)}
#pb p+p{margin-top:8px}
#pb strong{color:var(--fg);font-weight:600}
#pb code{font-family:var(--ff-m);font-size:11.5px;background:var(--surface-3);padding:1.5px 5px;
  border-radius:4px;color:var(--fg)}
#pb ul{margin:0;padding-left:17px}
#pb li{font-size:12.5px;line-height:1.6;color:var(--fg-2);margin-bottom:5px}
#pb .fail{border-left:2px solid var(--danger);padding-left:12px}
#pb .chips{display:flex;flex-wrap:wrap;gap:5px}
#pb .chip{font-family:var(--ff-m);font-size:10px;padding:3px 8px;border-radius:5px;
  background:var(--surface-3);color:var(--fg-2);border:1px solid var(--line)}

/* ---------- legenda ---------- */
#legend{position:absolute;left:14px;bottom:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb,var(--surface) 94%,transparent);border:1px solid var(--line);
  border-radius:9px;padding:10px 12px;z-index:20;backdrop-filter:blur(6px);max-width:min(340px,calc(100vw - 28px))}
#legend b{display:block;font-family:var(--ff-m);font-size:9px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--fg-3);margin-bottom:7px;font-weight:700}
#legend .ls{display:flex;flex-wrap:wrap;gap:4px 12px}
#legend span{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--fg-2)}
#legend i{width:9px;height:9px;border-radius:2.5px;flex:0 0 auto}
#legend .hint{margin-top:8px;padding-top:7px;border-top:1px solid var(--line);
  font-size:10px;color:var(--fg-3);line-height:1.5}
#legend .hint kbd{font-family:var(--ff-m);font-size:9.5px;background:var(--surface-3);
  padding:1px 4px;border-radius:3px;border:1px solid var(--line)}

@media (max-width:760px){
  #top{padding:9px 14px;padding-top:calc(9px + env(safe-area-inset-top,0px));gap:10px}
  .brand span{display:none}
  .tbtn.hide-s{display:none}
  #rail{padding:7px 14px}
  .bhead h2{font-size:22px}
  #panel{width:100%;top:auto;height:76%;border-left:none;border-top:1px solid var(--line);
    border-radius:16px 16px 0 0;transform:translateY(101%)}
  #panel.open{transform:none}
  #legend{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- etapa de design: etiquetas, status, esquemas, aprovação ---------- */
.rgrp{display:flex;align-items:center;padding:0 4px 0 2px;font-family:var(--ff-m);font-size:9.5px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--fg-3);white-space:nowrap;font-weight:700}
.rgrp:not(:first-child){margin-left:10px;border-left:1px solid var(--line);padding-left:14px}
.n .tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:2px}
.tg{font-family:var(--ff-m);font-size:8.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;
  padding:1.5px 6px;border-radius:4px;border:1px solid var(--line-strong);color:var(--fg-2);
  white-space:nowrap;font-style:normal;line-height:1.5}
.tg.req{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tg.arq{border-color:var(--l-core);color:var(--l-core)}
.tg.hip{border-style:dashed}
.tg.rec{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tg.lac{border-style:dashed;color:var(--fg-3)}
.tg.bb{border-color:var(--l-ent);color:var(--l-ent)}
.tg.dec{border-color:var(--l-shell);color:var(--l-shell)}
.tg.v2{color:var(--fg-3);border-color:var(--line)}
.stp{display:inline-block;font-family:var(--ff-m);font-size:9px;letter-spacing:.06em;text-transform:uppercase;
  font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;align-self:flex-start;margin-top:3px}
.stp.aguardando{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.stp.aprovado{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.stp.ajustes{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
.stp.nao_iniciado{background:var(--surface-3);color:var(--fg-3)}
.stp.em_elaboracao{background:color-mix(in srgb,var(--l-shell) 18%,transparent);color:var(--l-shell)}
.pill.nu{background:var(--surface-3);color:var(--fg-3)}
#legend em.tg{margin-right:2px}
/* esquema espacial: modelo de áreas, não wireframe */
.zfr{position:absolute}
.zfr>b{display:block;font-size:12.5px;font-weight:700;margin-bottom:8px}
.zdev{position:relative;border:2px solid var(--line-strong);border-radius:12px;background:var(--surface);overflow:hidden}
.zz{position:absolute;border:1px dashed var(--line-strong);background:var(--surface-3);display:flex;
  align-items:center;justify-content:center;text-align:center;padding:4px}
.zz span{font-size:10.5px;color:var(--fg-2);line-height:1.3}
.zz span em{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;
  border-radius:50%;background:var(--fg);color:var(--bg);font-family:var(--ff-m);font-size:9.5px;font-weight:700;
  margin-right:4px;vertical-align:middle}
.zz.hot{background:var(--surface-2);border-style:solid;border-color:var(--fg-3)}
.zfr>i{display:block;font-style:normal;font-size:11px;color:var(--fg-3);margin-top:8px;line-height:1.5}
/* aprovação no painel */
#pb .appr{border-top:1px solid var(--line);padding-top:16px;margin-top:6px}
#pb .appr label{display:block;font-size:11.5px;color:var(--fg-3);margin:12px 0 5px}
#pb .appr textarea{width:100%;min-height:76px;resize:vertical;background:var(--surface-2);color:var(--fg);
  border:1px solid var(--line);border-radius:7px;padding:9px 10px;font:inherit;font-size:12.5px;line-height:1.5}
#pb .apb{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
#pb .apb button{padding:8px 13px;border-radius:7px;font-size:12.5px;font-weight:600;border:1px solid var(--line-strong);
  background:var(--surface-2)}
#pb .apb button:hover:not(:disabled){border-color:var(--fg-3)}
#pb .apb button.pri{background:var(--fg);border-color:var(--fg);color:var(--bg)}
#pb .apb button.lnk{border:none;background:none;color:var(--fg-3);text-decoration:underline;padding:8px 4px;font-weight:500}
#pb .apb button:disabled{opacity:.45;cursor:default}
#pb .aph{font-size:11.5px;color:var(--fg-3);margin-top:9px;min-height:1em;line-height:1.5}
#pb .stline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--fg-3)}
#pb .stline .stp{margin-top:0}
</style>

<div id="app">
  <header id="top">
    <div class="brand">
      <b>EDIT<i>ICARUS</i> PRO</b>
      <span>arquitetura v0.1 · design etapa 1</span>
    </div>
    <div class="sp"></div>
    <button class="tbtn hide-s" id="btheme">tema</button>
    <button class="tbtn" id="bfit">enquadrar</button>
    <div class="zoomwrap">
      <button id="bzo" aria-label="Diminuir zoom">&minus;</button>
      <span id="zlvl">100%</span>
      <button id="bzi" aria-label="Aumentar zoom">+</button>
    </div>
  </header>
  <nav id="rail" aria-label="Quadros"></nav>
  <div id="stage">
    <div id="world">
      <svg id="edges" aria-hidden="true"></svg>
    </div>
    <aside id="legend">
      <b id="lhead">Camadas</b>
      <div class="ls" id="lkeys"></div>
      <div class="hint">Arraste para mover. <kbd>Ctrl</kbd>+scroll ou pinça para zoom. Clique num bloco para abrir o detalhe.</div>
    </aside>
    <aside id="panel" aria-hidden="true">
      <div id="ph">
        <div class="row">
          <div style="flex:1;min-width:0">
            <span class="lay" id="player"></span>
            <h3 id="ptitle"></h3>
          </div>
          <button id="pclose" aria-label="Fechar detalhe">&times;</button>
        </div>
      </div>
      <div id="pb"></div>
    </aside>
  </div>
</div>
<script>
/* ===========================================================================
   DADOS DOS QUADROS
   n: nós | g: grupos (camadas) | e: arestas | t: tabelas | k: notas
   d: detalhe do nó -> q (o que é) p (por que) te (tecnologia) f (se cair)
   =========================================================================== */
const L = {
  shell:'Casca de UI', core:'Núcleo de edição', render:'Motor de render', ai:'Inteligência',
  cat:'Catálogo', ent:'Acesso e cobrança', infra:'Plataforma', user:'Usuário'
};

const BOARDS = [
{

n:[
 {id:'p1',x:0,y:190,w:700,h:170,l:'core',t:'A condição comercial é dado de servidor, nunca código de cliente',
  s:'O campo is_vip chega serializado dentro de business_info.json_str, por item. O cliente resolve a condição e obedece. Trocar o flag localmente não libera nada, porque exportação e consumo de crédito são revalidados no servidor.',
  d:{q:'O achado central do documento. A decisão "este material é Pro" não existe no binário: ela é calculada em runtime a partir de metadados que o servidor envia item a item. O Ghidra confirmou pelo lado negativo: zero strings de gating no EffectPlatform.dll.',
     p:'Isso separa a política comercial do ciclo de release. Muda preço, muda pacote, muda promoção, tudo sem publicar versão nova. É o mesmo princípio que vale para um produto de um desenvolvedor só, por outro motivo: você não tem banda para fazer release toda vez que mudar de ideia sobre o modelo.',
     te:'Fonte: static/js/publish-text-effect.3a6eb5bb.js linha 1, colunas 2284 a 2288. O REA marcou is_vip como unknown-coverage, prova estática de que o valor vem de fora.',

 {id:'c3',x:30,y:682,w:560,h:86,l:'shell',t:'Uma janela, troca de cena',

     p:'Os "modos" (corte rápido, shorts por IA, tradução, vídeo de marketing) não são produtos separados: são layouts alternativos da mesma cena, operando o mesmo documento. Isso evita duplicar estado e evita sincronizar telas.',
     te:'EditorLayout, RCEditorLayout, AiShortsEditorLayout, AiTranslateEditorLayout, MarketingVideoEditorLayout, CaptionTemplateCreatorEditorLayout, TemplatePublishLayout.',

 {id:'c5',x:30,y:874,w:560,h:86,l:'ent',t:'O bloqueio é renderizado como efeito',

 {id:'x1',x:690,y:490,w:560,h:86,l:'ent',t:'Catálogo 100% remoto',

 {id:'x2',x:690,y:586,w:560,h:86,l:'ent',t:'Créditos de IA por operação',
  s:'Segundo eixo de cobrança além da assinatura. Cota mensal que não estorna.',
  d:{q:'pc_aigc_credit_consume_purchase, pc_aigc_credit_bar e a família m10n (abreviação de monetization) nas traduções pt BR provam o modelo: ser Pro dá cota, não uso ilimitado. E "as imagens não serão geradas, os créditos ainda serão consumidos".',
     p:'Isso existe porque a IA do CapCut roda em servidor e tem custo marginal real. Se a sua IA roda no device, o custo marginal é zero e cobrar crédito seria inventar uma fricção que você não precisa ter. Crédito gera ansiedade de uso, ticket de suporte e abandono.',

 {id:'x3',x:690,y:682,w:560,h:86,l:'infra',t:'Monolito de 262 MB',

 {id:'x4',x:690,y:778,w:560,h:86,l:'shell',t:'Três pilhas de UI no mesmo app',
  s:'Qt 6 nativo, CEF/Chromium embutido e Lynx da ByteDance convivendo.',
  d:{q:'Qt para a janela e a timeline, CEF para loja e conta, Lynx para painéis atualizáveis sem update do app. Há um gerenciador de popup que fala as três línguas: NativePopupWindow, H5PopupWindow, LynxPopupWindow, NotificationPopupWindow.',
     p:'Resolve o problema deles: times gigantes, ciclos de release longos, necessidade de mudar painel sem passar por loja de app. Cria o seu: três vezes a superfície de bug, três modelos de estado, três perfis de performance. Para uma pessoa é inviável.',

 {id:'inv',x:0,y:1060,w:1280,h:150,l:'accent',t:'A inversão: o que roda no device é grátis e ilimitado, o que custa servidor é pago e explícito',
  s:'O CapCut cobra pelo que é barato para ele (catálogo em CDN) e dá de graça o que é caro (render na máquina do usuário). Isso faz sentido na escala da ByteDance. Na sua, inverta. Matting, legendas, denoise e interpolação rodam com ONNX Runtime no device: custo marginal zero, sem cota, sem crédito, sem fila. O servidor entra só onde o device não dá conta, e aí o preço é visível antes do clique.',
  d:{q:'A tese comercial do EDITICARUS, derivada direto da engenharia reversa. O documento já mapeou os equivalentes abertos: RMBG-2.0 e BiRefNet para matting, Whisper para legendas, Real-ESRGAN para upscale, RNNoise para ruído (que é literalmente o que o CapCut usa, rnnoise_v2.0.model), RIFE para interpolação.',
     p:'Isso dá uma frase de posicionamento que o CapCut não pode copiar sem destruir a própria receita: "sem crédito, sem cota, sem upload do seu material". É defensável porque é estrutural, não é promoção.',
     te:'ONNX Runtime Web com execution provider WebGPU no navegador e no Tauri. ONNX Runtime nativo no mobile. Os modelos descem uma vez e ficam no cache.',
     f:'Device fraco demais para o modelo: o roteador de IA oferece a execução em servidor com o custo na tela. Degradação explícita, nunca silenciosa.',
     k:['custo marginal zero','ONNX Runtime','posicionamento']}}
],

 {x:0,y:1250,w:620,c:'core',b:'Separar o que é fato do que é inferência',
  h:'<b>Fato:</b> tudo que está em <code>business_info.json_str</code>, nos 743 caminhos <code>qrc:</code>, nas 22 rotas do Lynx e nas chaves de tradução. Foi lido no disco.<br><br><b>Inferência:</b> a lógica nativa de decisão. O <code>VECreator.dll</code> nunca foi descompilado. A convergência entre JS e as 1674 ocorrências de <code>vip</code> sustenta a leitura, não prova.<br><br><b>Desconhecido:</b> o payload real de entitlement, como a validação acontece no export, e a evolução do modelo entre as 6 versões instaladas.'},
 {x:660,y:1250,w:620,c:'ent',b:'O que isso significa para o seu caixa',
  h:'A arquitetura local first não é só uma escolha técnica. Ela decide a sua estrutura de custo: <b>servidor opcional significa que 1 usuário e 1.000 usuários custam quase o mesmo</b>. Sem isso, cada usuário gratuito queima dinheiro seu antes de você ter validado que alguém paga. Veja o quadro <b>Carga e custo</b> para os números.'}

n:[
 {id:'s1',x:24,y:250,w:255,h:100,l:'shell',t:'Casca Web',s:'React 18 + Vite. A base de código principal.',
  d:{q:'A aplicação que roda no navegador e que o Tauri empacota no desktop. Mesmo código, dois alvos.',p:'Escrever duas vezes web e desktop é o erro mais caro que um time de uma pessoa pode cometer. O Tauri embrulha a mesma build.',te:'React 18, Vite, Tailwind, Radix via shadcn/ui. Roteamento por tabela em JSON, seguindo o padrão do Lynx.',f:'Falha de carga de chunk: retry com backoff e, após 3 tentativas, oferta de recarregar mantendo o autosave.',k:['React','Vite','shadcn/ui']}},
 {id:'s2',x:303,y:250,w:255,h:100,l:'shell',t:'Casca Desktop',s:'Tauri v2. Embrulha a build web, bundle 20x a 50x menor que Electron.',
  d:{q:'O mesmo app web rodando numa janela nativa, com acesso a sistema de arquivos, FFmpeg nativo e GPU sem as restrições do navegador.',p:'Desktop é onde um editor de vídeo é usado de verdade para trabalho pago. É também onde você entrega export sem limite de memória de aba.',te:'Tauri v2. Bundles típicos de 2,5 a 10 MB contra 80 a 200 MB do Electron, e RAM em repouso na faixa de 40 a 80 MB contra 150 a 400 MB. O custo é WebView por sistema operacional, então o QA de render multiplica por 3.',f:'WebView do sistema desatualizado sem WebGPU: cai para WebGL2 e avisa o usuário uma vez, com link de atualização.',k:['Tauri v2','FFmpeg sidecar','WebView por SO']}},
 {id:'s3',x:582,y:250,w:255,h:100,l:'shell',t:'Casca Mobile',s:'Expo + React Native + NativeWind. Compartilha núcleo e tokens, não a timeline.',
  d:{q:'App iOS e Android. Reaproveita 100% do núcleo de edição e dos tokens de design, cerca de 40% da UI.',p:'A timeline touch é outro produto: gesto, alvo de toque, zoom por pinça e precisão de trim não têm nada a ver com mouse. Fingir que compartilha gera uma UI ruim nas duas pontas.',te:'Expo, React Native, NativeWind para falar a mesma linguagem de tokens do Tailwind. ONNX Runtime nativo para IA.',f:'Sem suporte a codec por hardware: render em resolução menor com aviso, nunca falha silenciosa.',k:['Expo','NativeWind','ONNX nativo']}},
 {id:'s4',x:861,y:250,w:255,h:100,l:'shell',t:'SceneManager',s:'Uma janela. Sete layouts do mesmo editor.',
  d:{q:'Copiado direto do CapCut. Não existe pilha de navegação: existe uma superfície e uma cena ativa.',p:'Modos (corte rápido, shorts, legenda, publicação) operam o mesmo documento. Sem duplicar estado, sem sincronizar telas, sem bug de "voltar".',te:'Cena = layout + painéis ativos + ferramentas visíveis. O documento não sabe qual layout está aberto.',f:'Cena que não monta cai para Home com o projeto salvo. Nunca tela branca.',k:['cena','layout','documento único']}},
 {id:'s5',x:1140,y:250,w:255,h:100,l:'shell',t:'Tabela de rotas',s:'JSON versionado. Navegação muda sem build.',
  d:{q:'Rotas, deeplinks e tamanho de painel declarados em dado, lendo a lição do lynx_config.json.',p:'Permite testar ordem de passos, abrir o app direto num recurso e medir atribuição por featureEntry, sem publicar versão.',te:'Schema validado no build. Fallback para a tabela embarcada se a remota falhar ou for inválida.',f:'Rota desconhecida leva a uma tela de fallback nomeada com link para Home.',k:['rota como dado','deeplink']}},

 {id:'k1',x:24,y:460,w:255,h:100,l:'core',t:'Documento do projeto',s:'EDL em JSON. A fonte única de verdade.',
  d:{q:'Edit Decision List: a descrição completa do vídeo (tracks, clipes, cortes, efeitos, keyframes) sem conter um byte de mídia.',p:'Separar descrição de mídia é o que permite: projeto de 40 KB, undo barato, sync rápido, colaboração futura e render em qualquer máquina. É o mesmo princípio do business_info.json do CapCut aplicado ao projeto inteiro.',te:'JSON versionado com migrações. Mídia referenciada por hash de conteúdo mais caminho, então mover arquivo não quebra o projeto.',f:'Documento corrompido: restaura do último snapshot íntegro. Snapshots a cada 30 operações mais 1 por minuto.',k:['EDL','hash de conteúdo','migração de schema']}},
 {id:'k2',x:303,y:460,w:255,h:100,l:'core',t:'Barramento de comandos',s:'Toda mudança é um comando. Undo e redo saem de graça.',
  d:{q:'Nada muda o documento diretamente. Tudo passa por um comando nomeado, reversível e serializável.',p:'Undo confiável é requisito não negociável num editor. Fazer isso por diff de estado é lento e cheio de bug; por comando é determinístico. E o log de comandos vira telemetria de uso real sem instrumentar nada a mais.',te:'Command pattern com apply/revert. Coalescência por janela de tempo para arrastar e redimensionar (um drag vira 1 comando, não 200).',f:'Comando que falha no apply não entra no histórico e dispara toast com o motivo. Documento nunca fica em estado parcial.',k:['undo/redo','coalescência','telemetria]']}},
 {id:'k3',x:582,y:460,w:255,h:100,l:'core',t:'Motor de timeline',s:'Tracks, clipes, transições, keyframes. Puro cálculo.',
  d:{q:'Resolve qual frame de qual clipe, com quais efeitos, toca em cada instante. Sem desenhar nada.',p:'É a parte mais difícil e mais valiosa do produto. Mantida sem DOM, dá para testar com assert em milissegundos e reusar inteira no mobile.',te:'Estruturas imutáveis com cópia estrutural. Resolução por intervalo com índice, não varredura linear: 1.000 clipes precisam responder em menos de 1 ms.',f:'Erro de resolução num clipe: o clipe renderiza preto com marcador de erro visível. O resto da timeline continua.',k:['imutável','índice por intervalo','sem DOM']}},
 {id:'k4',x:861,y:460,w:255,h:100,l:'core',t:'Autosave e recuperação',s:'Crash não pode custar trabalho.',
  d:{q:'Persistência contínua do documento e do histórico de comandos em disco local.',p:'Um editor que perde trabalho perde o usuário na primeira vez. Isso vale mais que qualquer recurso de IA do roadmap.',te:'Escrita atômica (arquivo temporário mais rename). IndexedDB na web, sistema de arquivos no desktop e mobile. Snapshot mais log de comandos desde o snapshot.',f:'Disco cheio: para de gravar, avisa com clareza e mantém o documento em memória. Nunca grava pela metade.',k:['escrita atômica','snapshot + log']}},
 {id:'k5',x:1140,y:460,w:255,h:100,l:'core',t:'Registro de efeitos',s:'Efeito é um descritor, não um if no código.',
  d:{q:'Tabela que mapeia tipo de efeito para shader, parâmetros, faixas e preview. Lida do catálogo.',p:'Adicionar efeito vira publicar JSON mais shader. Sem recompilar, sem release, sem tocar no núcleo.',te:'Validação de schema na carga. Shader compilado sob demanda com cache por hash.',f:'Shader que não compila: o efeito some da vitrine e um evento sobe para a telemetria. O projeto que já usava renderiza sem o efeito, com aviso.',k:['registro','WGSL/GLSL','cache por hash']}},

 {id:'r1',x:24,y:670,w:255,h:100,l:'render',t:'Compositor de preview',s:'WebGPU. Alvo de 60fps na timeline.',
  d:{q:'Monta cada frame: decodifica, aplica efeitos em cadeia, compõe camadas, desenha no canvas.',p:'Scrub na timeline não pode ter loading. É a interação mais frequente do produto e é onde a qualidade percebida é decidida.',te:'WebGPU com fallback WebGL2. Cadeia de efeitos como passes de shader, sem round trip CPU entre passes.',f:'Perda de contexto de GPU: recria o dispositivo e redesenha a partir do documento. O usuário vê um piscar, não perde estado.',k:['WebGPU','60fps','passes de shader']}},
 {id:'r2',x:303,y:670,w:255,h:100,l:'render',t:'Cache de frames',s:'Três níveis. Scrub sem espera.',
  d:{q:'Memória (frames decodificados recentes), disco (proxies em resolução menor) e preview de efeito (resultado já composto).',p:'O que separa um editor usável de um travado. Decodificar sob demanda a cada movimento do cursor é inviável em qualquer hardware.',te:'LRU com orçamento de memória explícito. Proxy em 540p gerado no import, em worker, sem bloquear a UI.',f:'Cache frio: a timeline mostra miniatura de menor qualidade enquanto preenche. Nunca bloqueia o cursor.',k:['LRU','proxy 540p','worker']}},
 {id:'r3',x:582,y:670,w:255,h:100,l:'render',t:'Decoder',s:'WebCodecs primeiro, FFmpeg WASM depois.',
  d:{q:'Transforma bytes de arquivo em frames. WebCodecs usa o decodificador de hardware do sistema.',p:'A diferença de performance entre hardware e WASM é de uma ordem de grandeza. Mas o WebCodecs ainda é Working Draft do W3C e não é Baseline, com cobertura desigual fora de Chrome e Edge, então o fallback não é opcional.',te:'WebCodecs para H.264, H.265, VP9 e AV1. FFmpeg WASM para ProRes, DNxHR e formatos que o navegador recusa. No Tauri, FFmpeg nativo como sidecar cobre tudo.',f:'Codec não suportado: oferece transcodificar no import, uma vez, com barra de progresso. Nunca falha sem saída.',k:['WebCodecs','ffmpeg.wasm','sidecar nativo']}},
 {id:'r4',x:861,y:670,w:255,h:100,l:'render',t:'Encoder e export',s:'Export local é o caminho padrão.',
  d:{q:'Captura frames direto do canvas da GPU e codifica. No desktop, entrega para o FFmpeg nativo.',p:'Export no device significa custo zero de servidor, nenhum upload, nenhuma fila, nenhuma espera de rede. É o eixo inteiro da economia invertida.',te:'VideoEncoder do WebCodecs na web. FFmpeg nativo via sidecar no Tauri. Mux em MP4 ou MOV. Job em background com notificação do sistema.',f:'Encoder falha no meio: salva o parcial, mantém o job retomável e mostra o que já foi renderizado.',k:['export local','sem upload','retomável']}},
 {id:'r5',x:1140,y:670,w:255,h:100,l:'render',t:'Grafo de áudio',s:'WebAudio mais RNNoise. Waveform no import.',
  d:{q:'Mixagem, ganho, fade, ducking automático e redução de ruído.',p:'Áudio ruim derruba um vídeo mais rápido que imagem ruim. E o RNNoise é exatamente o modelo que o CapCut usa (rnnoise_v2.0.model), então a paridade de qualidade é um fato verificado, não uma aposta.',te:'WebAudio API, AudioWorklet para processamento em tempo real. RNNoise via WASM. Waveform calculada no import, em worker, e cacheada.',f:'AudioWorklet indisponível: processamento só no export, com preview sem o efeito e aviso explícito.',k:['RNNoise','AudioWorklet','ducking']}},

 {id:'a0',x:24,y:880,w:255,h:100,l:'ai',t:'Roteador de IA',s:'Decide: device ou servidor. É onde a economia é aplicada.',
  d:{q:'Antes de qualquer operação de IA, mede o device (memória, GPU, suporte a WebGPU) e o tamanho do trabalho, e escolhe onde executar.',p:'É o componente que torna a promessa "sem crédito" sustentável. Sem ele, ou você roda tudo no servidor e queima dinheiro, ou roda tudo no device e falha nos aparelhos fracos.',te:'Heurística: memória disponível, presença de WebGPU, duração do clipe, resolução. Resultado da medição fica em cache por sessão.',f:'Em dúvida, roda no device em resolução menor. Servidor só com consentimento explícito e preço na tela.',k:['on device por padrão','consentimento explícito']}},
 {id:'a1',x:303,y:880,w:255,h:100,l:'ai',t:'ONNX Runtime',s:'WebGPU no navegador e no Tauri. Nativo no mobile.',
  d:{q:'O runtime que executa todos os modelos. Um só, para todos os recursos de IA.',p:'Um runtime único significa um formato de modelo, um pipeline de carga, um cache e um lugar para otimizar. Alternativa seria uma biblioteca por recurso, que é insustentável sozinho.',te:'ONNX Runtime Web com execution provider WebGPU, fallback WASM SIMD. Modelos quantizados em int8 onde a qualidade permite.',f:'Modelo que não carrega: o recurso aparece desabilitado com motivo, não some sem explicação.',k:['ONNX','WebGPU EP','int8']}},
 {id:'a2',x:582,y:880,w:255,h:100,l:'ai',t:'Remover fundo',s:'RMBG-2.0 ou BiRefNet. Qualidade comparável ou superior.',
  d:{q:'Segmentação de pessoa e objeto por frame, com refinamento temporal para evitar tremulação entre frames.',p:'O documento aponta este como um dos dois recursos que mais doem no paywall do CapCut e com melhor implementação aberta. É o MVP.',te:'RMBG-2.0 ou BiRefNet em ONNX. Máscara em resolução menor com upscale guiado pela imagem original. Suavização temporal na timeline.',f:'Memória insuficiente: processa em resolução menor, avisa a perda de qualidade e oferece o caminho servidor.',k:['RMBG-2.0','BiRefNet','coerência temporal']}},
 {id:'a3',x:861,y:880,w:255,h:100,l:'ai',t:'Legendas automáticas',s:'Whisper mais VAD. O outro recurso do MVP.',
  d:{q:'Transcrição com marcação de tempo por palavra, detecção de silêncio e geração de blocos de legenda editáveis na timeline.',p:'O VAD entrega de brinde o recurso de remover pausas, que é edição de timeline, não IA. Dois recursos pelo preço de um modelo.',te:'faster-whisper ou whisper.cpp em ONNX, modelo small ou medium conforme o device. VAD Silero. Legenda vira track editável, não imagem queimada.',f:'Áudio inaudível ou idioma não suportado: devolve o que conseguiu com marcação de baixa confiança, nunca texto inventado.',k:['Whisper','VAD','track editável']}},
 {id:'a4',x:1140,y:880,w:255,h:100,l:'ai',t:'Upscale, interpolação, voz',s:'Real-ESRGAN, RIFE, Piper. Fase 2.',
  d:{q:'Super resolução, interpolação de quadros para câmera lenta e síntese de voz.',p:'São os recursos com melhor relação entre impressão causada e esforço, mas nenhum deles resolve uma dor diária. Entram depois que os dois primeiros provarem que alguém usa o produto.',te:'Real-ESRGAN, RIFE (que o CapCut também usa, em models/interpolation) e Piper ou XTTS para TTS.',f:'Upscale 4K no device é o caso típico de roteamento para servidor, com preço na tela antes do clique.',k:['Real-ESRGAN','RIFE','fase 2']}},

 {id:'ct1',x:24,y:1090,w:255,h:100,l:'cat',t:'Schema de descritor',s:'Sem campo de cobrança. Essa é a diferença.',
  d:{q:'O contrato que descreve um efeito, fonte, som, LUT ou template. Copia a forma do business_info.json do CapCut e remove o que lá existe para cobrar.',p:'O descritor diz o que o material é e como renderizar. Se ele é pago, quem decide é a camada 5, por conta, em runtime. Material e política não podem viver no mesmo objeto, senão mudar preço vira migração de catálogo.',te:'JSON Schema versionado. Campos: id, tipo, parâmetros, preview, shader, licença da fonte, autor.',f:'Descritor inválido: item some da vitrine, evento sobe para telemetria. Nunca quebra a lista.',k:['sem campo de preço','licença explícita']}},
 {id:'ct2',x:303,y:1090,w:255,h:100,l:'cat',t:'Pack base embarcado',s:'O caso completo funciona sem internet.',
  d:{q:'Conjunto mínimo que cobre importar, cortar, legendar, remover fundo, ajustar cor, mixar áudio e exportar. Vai no instalador.',p:'É a contrapartida direta dos 3 arquivos de áudio do CapCut. Aqui, o app sem rede continua sendo um editor. Isso é argumento de venda e é seguro operacional ao mesmo tempo.',te:'Orçamento: até 80 MB no desktop, até 40 MB no mobile. Fontes e sons só com licença aberta (Freesound, Pixabay), com a licença registrada no descritor.',f:'Não falha: é local.',k:['offline','licença aberta','80 MB']}},
 {id:'ct3',x:582,y:1090,w:255,h:100,l:'cat',t:'Gerenciador de packs',s:'Baixa, verifica, cacheia, expira.',
  d:{q:'Download sob demanda com verificação de integridade, cache local e política de expiração.',p:'O usuário baixa o que usa. Não paga banda nem disco pelo que não usa.',te:'Verificação por hash. Cache LRU com teto configurável. Download retomável.',f:'Download interrompido: retoma de onde parou. Hash divergente: descarta e tenta outra origem.',k:['hash','retomável','LRU']}},
 {id:'ct4',x:861,y:1090,w:255,h:100,l:'cat',t:'API de catálogo',s:'Lotes de 50, como o mget_item.',
  d:{q:'Lista a vitrine e devolve metadados em lote. Mesma forma dos endpoints do CapCut, que são um bom desenho.',p:'Lote de 50 evita N+1 e mantém a vitrine responsiva com paginação por cursor.',te:'POST /v1/catalog/list e POST /v1/catalog/mget. Cursor, não offset. Cache HTTP com ETag.',f:'API fora do ar: vitrine mostra o cache local mais estado offline. Pack base intacto.',k:['lote de 50','cursor','ETag']}},
 {id:'ct5',x:1140,y:1090,w:255,h:100,l:'cat',t:'CDN de assets',s:'URL assinada e curta para material pago.',
  d:{q:'Entrega os bytes dos packs. Objeto imutável com cache longo.',p:'Asset imutável endereçado por hash pode ter cache eterno, o que derruba a conta de banda. Material pago usa URL assinada de validade curta.',te:'Cloudflare R2 mais CDN. Egress zero no R2 é o que torna isso viável com orçamento pequeno.',f:'CDN fora: a vitrine marca itens como indisponíveis. O editor continua.',k:['R2','imutável','URL assinada']}},

 {id:'en1',x:24,y:1350,w:255,h:100,l:'ent',t:'Autenticação',s:'OAuth2 Authorization Code com PKCE.',
  d:{q:'Login com e-mail, Google e Apple. Nunca password grant, nunca implicit flow.',p:'PKCE é obrigatório em cliente público (desktop, mobile, SPA) porque não há como guardar segredo de cliente nesses alvos.',te:'Authorization Code + PKCE. Access token JWT de 15 minutos. Refresh token rotativo com detecção de reuso.',f:'Auth indisponível: token em cache vale por até 7 dias offline. Login novo espera.',k:['PKCE','JWT 15min','refresh rotativo']}},
 {id:'en2',x:303,y:1350,w:255,h:100,l:'ent',t:'Cofre de token',s:'Keychain do sistema. Nunca localStorage.',
  d:{q:'Onde o refresh token mora em cada plataforma.',p:'Token em localStorage é roubado por qualquer XSS. Essa é a falha de segurança mais comum em app web e a mais barata de evitar.',te:'Web: refresh em cookie HttpOnly SameSite=Strict, access só em memória. Desktop: Tauri Stronghold ou keychain do SO. Mobile: Keychain iOS e Keystore Android.',f:'Cofre inacessível: sessão vira somente memória e expira ao fechar, com aviso.',k:['HttpOnly','Stronghold','Keystore']}},
 {id:'en3',x:582,y:1350,w:255,h:100,l:'ent',t:'Resolvedor de entitlement',s:'A decisão comercial. Por item, no servidor.',
  d:{q:'Dada uma conta e uma lista de itens, devolve o que ela pode usar. A lição central do CapCut, aplicada.',p:'O cliente nunca decide. Trocar o flag localmente não libera nada porque o export server side e a publicação revalidam.',te:'Resposta com TTL curto. Cache no cliente respeitando o TTL. Revalidação obrigatória no momento do export pago.',f:'Fora do ar: cache dentro do TTL vale (fail-open curto). Sem cache, plano gratuito (fail-closed). Nunca o contrário.',k:['por item','TTL','revalidação no export']}},
 {id:'en4',x:861,y:1350,w:255,h:100,l:'ent',t:'Normalizador',s:'A UI lê um booleano. Nunca a estratégia crua.',
  d:{q:'Converte a resposta de entitlement, qualquer que seja a forma, num único campo que a interface consome.',p:'Copiado literalmente do CapCut: business_info.json = { is_vip: isVip }. A UI nunca vê paid_strategy_list nem subscribe_package. Isso permite trocar o modelo comercial inteiro sem tocar em um componente de tela.',te:'Uma função pura, testada, com compatibilidade retroativa explícita para formatos antigos.',f:'Formato desconhecido: assume o plano gratuito e registra o evento. Falha segura.',k:['um booleano','função pura','retrocompatível']}},
 {id:'en5',x:1140,y:1350,w:255,h:100,l:'ent',t:'Cobrança',s:'Stripe ou Pagar.me. Webhook como fonte de verdade.',
  d:{q:'Assinatura e compra avulsa. O estado do pagamento vem por webhook, não por retorno de tela.',p:'Confiar no redirect de sucesso é como confiar no cliente para decidir o preço. O usuário fecha a aba, a rede cai, e o estado diverge.',te:'Webhook com verificação de assinatura, processamento idempotente e fila de retry. Reconciliação diária.',f:'Webhook perdido: a reconciliação diária corrige. Usuário nunca fica pagando sem acesso.',k:['webhook','idempotente','reconciliação']}},

 {id:'i1',x:24,y:1560,w:255,h:100,l:'infra',t:'API Gateway',s:'Entrada única. Rate limit e autenticação na borda.',
  d:{q:'Valida o JWT, aplica limite por conta e por IP, roteia.',p:'Centralizar autenticação e limite evita repetir essa lógica em cada serviço, que é onde buracos aparecem.',te:'Limite por conta e por IP, com janela deslizante. Resposta 429 com Retry-After que o cliente respeita.',f:'Gateway fora: o app inteiro entra em modo offline. A edição não para.',k:['rate limit','429','JWT na borda']}},
 {id:'i2',x:303,y:1560,w:255,h:100,l:'infra',t:'Fila de jobs',s:'Com outbox no cliente. Nada se perde.',
  d:{q:'Jobs de IA e export server side. O cliente grava a intenção localmente antes de enviar.',p:'O padrão outbox resolve o caso mais comum de perda: o usuário pede, a rede cai, e ninguém sabe se o pedido chegou.',te:'Chave de idempotência por job. Retry com backoff exponencial. Dead letter após 5 tentativas, com o motivo visível para o usuário.',f:'Fila fora: o job fica no outbox local e sobe quando voltar. O usuário vê "aguardando conexão", não erro.',k:['outbox','idempotência','dead letter']}},
 {id:'i3',x:582,y:1560,w:255,h:100,l:'infra',t:'Workers de GPU',s:'Escala a zero. Só existem quando há fila.',
  d:{q:'Executam o que o device não dá conta: upscale 4K, modelos grandes, export pesado.',p:'Escala a zero é o que mantém o custo fixo perto de zero enquanto o produto não tem volume. Você paga por segundo de uso, não por máquina parada.',te:'Serverless GPU com cobrança por segundo. Referência de mercado em 2026: A10 na faixa de US$ 1,10/h e H100 perto de US$ 3,95/h em provedor serverless, contra H100 a cerca de US$ 5,49/h em plataforma gerenciada. Verificar na página do fornecedor antes de fechar orçamento.',f:'Sem worker: a fila cresce, o usuário vê a posição e a estimativa. O caminho on device continua liberado.',k:['escala a zero','por segundo','fila visível']}},
 {id:'i4',x:861,y:1560,w:255,h:100,l:'infra',t:'Object storage',s:'TTL de 24h em tudo que é mídia de job.',
  d:{q:'Guarda temporariamente o que sobe para processamento no servidor.',p:'Prazo curto e apagamento efetivo é compromisso de privacidade e é o que impede a conta de storage crescer sozinha. Também é o que permite dizer, com honestidade, que o material do usuário não fica com você.',te:'Cloudflare R2 (egress zero) com regra de ciclo de vida de 24h. Apagamento efetivo, não lógico.',f:'Storage fora: jobs server side falham, on device continua. Nenhum dado local é afetado.',k:['TTL 24h','R2','hard delete']}},
 {id:'i5',x:1140,y:1560,w:255,h:100,l:'infra',t:'Observabilidade',s:'Erro de render precisa ser visível antes do usuário reclamar.',
  d:{q:'Rastreamento distribuído, erros, métricas de produto e saúde de job.',p:'Sozinho, você não tem equipe de suporte. A única forma de descobrir que um shader quebrou num driver específico é a telemetria.',te:'OpenTelemetry para traces, Sentry para erros com source map. Métricas que importam: fps de preview por device, tempo de export, taxa de falha por codec.',f:'Telemetria fora: o app não é afetado. Eventos ficam num buffer local com teto e são descartados se encher.',k:['OTel','Sentry','buffer com teto']}}
],
e:[

 {f:'r1',t:'r2',l:'cache'},{f:'r2',t:'r3',l:'decodifica'},{f:'r1',t:'r4',l:'export'},

k:[
 {x:0,y:1230,w:700,c:'accent',b:'A fronteira que define o produto',
  h:'Tudo acima desta linha (camadas 0 a 4) <b>funciona sem internet</b>. O usuário importa, corta, legenda, remove fundo, ajusta cor, mixa áudio e exporta com o avião em modo voo.<br><br>Tudo abaixo (camadas 5 e 6) é <b>opcional e assíncrono</b>. Se cair inteiro, o editor continua editando. Essa é a propriedade que separa esta arquitetura da do CapCut, onde a camada de rede é caminho crítico.'},
 {x:720,y:1230,w:700,c:'ent',b:'Por que a camada 5 fica embaixo e não em cima',
  h:'A política comercial depende do catálogo e da conta, e <b>nenhuma camada acima dela pode depender dela para funcionar</b>. Invertendo a ordem, qualquer indisponibilidade de cobrança viraria indisponibilidade de edição.<br><br>O contrato é de mão única: a camada 5 <b>enriquece</b> o que a camada 4 já entregou. Ela nunca é pré requisito para abrir, editar ou exportar o que é local.'}
],

<script>
/* ======================= 03 JORNADA ======================= */
BOARDS.push({
id:'jornada', nome:'Jornada', num:'03',
head:{x:0,y:0,w:760,kick:'Do arquivo bruto ao vídeo pronto',
  t:'Fluxo do usuário',
  p:'Quatro fases. O objetivo principal, importar, cortar, legendar e exportar, precisa caber em cinco interações. O CapCut gasta por volta de doze. A redução não vem de esconder opção, vem de receitas: pipelines nomeados que o usuário dispara de uma vez e ajusta depois.'},
g:[
 {x:0,y:180,w:1330,h:195,t:'Fase A · Entrada',c:'user',i:'Nenhuma etapa aqui exige rede.'},
 {x:0,y:415,w:1330,h:195,t:'Fase B · Preparação',c:'render',i:'Tudo em worker. A UI nunca congela.'},
 {x:0,y:650,w:1330,h:420,t:'Fase C · Edição',c:'core',i:'Quatro trilhas paralelas sobre o mesmo documento.'},
 {x:0,y:1110,w:1330,h:330,t:'Fase D · Saída',c:'shell',i:'Assíncrono por padrão. O usuário não espera na tela.'}
],
n:[
 {id:'j1',x:25,y:230,w:230,h:95,l:'user',t:'Abrir o app',s:'Alvo: janela utilizável em menos de 1,5s.',
  d:{q:'Boot da casca, restauração de sessão em cache e carga do último projeto se existir.',p:'Tempo de abertura é a primeira impressão e é a métrica mais fácil de perder sem notar. O Tauri ajuda aqui (cold start medido na faixa de 380ms contra 1.420ms do Electron em comparativos de 2026), mas o que pesa de verdade é quanto você carrega antes de desenhar.',te:'Carga em duas ondas: casca e último projeto primeiro, catálogo e modelos de IA depois, sob demanda.',f:'Projeto anterior corrompido: abre a Home com aviso e link para o snapshot anterior.',k:['cold start','carga em ondas']}},
 {id:'j2',x:345,y:230,w:230,h:95,l:'user',t:'Sessão válida?',s:'Decisão. Offline é caminho normal, não exceção.',dec:1,
  d:{q:'Verifica o token em cache. Não bloqueia a entrada.',p:'O editor inteiro funciona sem conta. Login é exigido só para sincronizar, publicar ou usar servidor. Exigir conta para editar é a forma mais rápida de perder o usuário que baixou para testar.',te:'Token em cache vale até 7 dias offline. Expirado: modo convidado com banner discreto.',f:'Auth fora do ar: entra como convidado. Nenhum bloqueio.',k:['convidado','7 dias offline']}},
 {id:'j3',x:665,y:230,w:230,h:95,l:'shell',t:'Home e rascunhos',s:'Projetos recentes, templates, receitas.',
  d:{q:'A cena Home. Lista de projetos com miniatura, duração e data. Atalhos para as receitas.',p:'É aqui que os cliques são economizados. "Legendar um vídeo" começa como receita na Home, não como sequência de menus dentro do editor.',te:'Lista paginada por cursor, miniaturas em cache local. Nenhuma chamada de rede para renderizar a Home.',f:'Índice de projetos ilegível: reconstrói varrendo a pasta de projetos.',k:['receitas','cursor','sem rede']}},
 {id:'j4',x:985,y:230,w:230,h:95,l:'shell',t:'Novo projeto',s:'Formato e proporção. Dois campos, não um formulário.',
  d:{q:'Cria o documento vazio com proporção e taxa de quadros.',p:'Pedir mais que isso no início é fricção pura. Resolução de export é decisão do momento do export, não da criação.',te:'Presets: vertical 9:16, quadrado 1:1, horizontal 16:9. A proporção é mutável a qualquer momento sem recriar o projeto.',f:'Falha ao criar arquivo: avisa com o caminho e o motivo do sistema operacional.',k:['2 campos','proporção mutável']}},

 {id:'j5',x:25,y:465,w:230,h:95,l:'render',t:'Importar mídia',s:'Referência, não cópia. Nada sobe para servidor.',
  d:{q:'O arquivo fica onde está. O projeto guarda caminho mais hash de conteúdo.',p:'Copiar para dentro do projeto duplica dezenas de GB sem motivo. O hash resolve o caso de mover o arquivo: o app reencontra pelo conteúdo.',te:'Drag and drop, seletor de arquivo e pasta observada. Hash incremental calculado em worker.',f:'Arquivo removido depois: o clipe aparece com estado "mídia ausente" e botão de relocalizar. A timeline não quebra.',k:['por referência','hash','relocalizar']}},
 {id:'j6',x:345,y:465,w:230,h:95,l:'render',t:'Gerar proxy',s:'540p em worker. O usuário já pode editar.',
  d:{q:'Versão em resolução menor usada para scrub e preview, mais miniaturas da timeline.',p:'Editar 4K direto trava qualquer máquina. O proxy é o que entrega os 60fps. E ele é gerado em segundo plano: o usuário começa a cortar antes de terminar.',te:'Worker dedicado, prioridade abaixo do preview. Proxy em cache de disco com LRU.',f:'Geração falha: edita no original com aviso de performance reduzida. Nunca bloqueia.',k:['540p','worker','LRU']}},
 {id:'j7',x:665,y:465,w:230,h:95,l:'render',t:'Waveform e cenas',s:'Áudio desenhado, cortes sugeridos.',
  d:{q:'Calcula a forma de onda e detecta mudanças de cena para sugerir pontos de corte.',p:'Detecção de cena é cálculo barato com ganho alto de tempo. É o tipo de recurso que parece IA e não é.',te:'Waveform por picos em múltiplas resoluções. Detecção de cena por diferença de histograma.',f:'Falha: a track mostra bloco liso sem forma de onda. Edição continua.',k:['picos','histograma']}},
 {id:'j8',x:985,y:465,w:230,h:95,l:'core',t:'Editor pronto',s:'Documento montado. A partir daqui, zero rede.',
  d:{q:'A cena de edição com o layout escolhido pela receita ou pelo último uso.',p:'O ponto onde o produto é o produto. Toda interação daqui para frente responde em menos de 16ms ou é um job com estado visível. Não existe meio termo.',te:'Layout restaurado por projeto. Painéis colapsáveis com estado persistido localmente.',f:'Nenhuma: é estado local.',k:['16ms ou job']}},

 {id:'j9',x:25,y:700,w:230,h:95,l:'core',t:'Cortar e arrastar',s:'Síncrono. Nunca pode ter loading.',
  d:{q:'A interação mais frequente do produto: mover, cortar, esticar, reordenar.',p:'Se isso tiver qualquer latência perceptível, o produto é considerado ruim por inteiro, não importa quantos recursos de IA existam.',te:'Comando coalescido por janela de tempo. Resolução de timeline por índice de intervalo, alvo abaixo de 1ms com 1.000 clipes.',f:'Não aplicável: é cálculo local em memória.',k:['síncrono','coalescência']}},
 {id:'j10',x:345,y:700,w:230,h:95,l:'cat',t:'Aplicar efeito',s:'Pack local? Aplica. Senão, baixa primeiro.',dec:1,

 {x:0,y:1480,w:648,c:'accent',b:'Receitas: como sair de doze cliques para cinco',
  h:'Uma receita é um pipeline nomeado disparado da Home. <b>"Legendar e cortar pausas"</b> executa: importar, gerar proxy, transcrever, detectar silêncio, cortar, montar a track de legenda e abrir no layout de legenda. Um clique.<br><br>O usuário ajusta <b>depois</b>, com o resultado na tela. O erro clássico é pedir a configuração antes, quando ele ainda não viu nada e não sabe o que quer.<br><br>É o mesmo conceito dos sete layouts do CapCut, levado um passo adiante: o layout já vem com o trabalho feito.'},
 {x:682,y:1480,w:648,c:'render',b:'A regra dos 16 milissegundos',
  h:'Qualquer interação se encaixa em uma de duas caixas, sem terceira opção:<br><br><b>Abaixo de 16ms:</b> cortar, arrastar, scrub, zoom, selecionar, desfazer. Síncrono, sem spinner, sem exceção.<br><br><b>Acima de 2s:</b> vira job com estado visível, cancelável e retomável. Acima de 30s, libera a UI e notifica no fim.<br><br>A faixa entre 16ms e 2s é onde moram os bugs de percepção: rápido demais para justificar spinner, lento demais para parecer instantâneo. Resolva com <b>feedback otimista</b>, aplicando o resultado esperado e corrigindo se falhar.'}

 {id:'f5',x:30,y:480,w:528,h:80,l:'accent',t:'Ponto único de falha total: o disco do usuário',s:'Se o disco dele morre, nada do que você construir resolve. É o limite honesto da arquitetura local first, e a razão de existir sync opcional como réplica.',

 {id:'f7',x:1010,y:250,w:310,h:100,l:'ent',t:'Autenticação cai',s:'Impacto: login novo. Sessão existente continua.',

  d:{q:'Jobs server side não são despachados.',p:'O padrão outbox garante que a intenção foi persistida localmente antes de qualquer chamada. Nada se perde, só atrasa.',te:'Outbox local com retry e backoff. Estado visível: "aguardando conexão".',f:'<b>Degradação:</b> jobs aguardam. Tudo que é on device continua sem nenhum impacto.',k:['outbox','nada se perde']}},

 {id:'f10',x:680,y:470,w:310,h:100,l:'ent',t:'Entitlement cai',s:'Impacto: a regra assimétrica resolve.',
  d:{q:'Não dá para resolver quem pode usar o quê.',p:'A assimetria é deliberada. Cache válido continua valendo, porque tirar acesso de quem pagou por uma falha sua é inaceitável. Sem cache, cai no gratuito, porque liberar pago por falha sua é prejuízo.',te:'Fail-open dentro do TTL, fail-closed fora dele. Export pago sempre revalida, nunca aceita cache.',f:'<b>Degradação:</b> quem pagou continua. Quem chega vê o gratuito, que resolve o caso completo.',k:['fail-open no TTL','fail-closed fora']}},
 {id:'f11',x:1010,y:470,w:310,h:100,l:'infra',t:'Banco cai',s:'Impacto: escrita de conta. Leitura segue por réplica.',

k:[
 {x:0,y:1030,w:655,c:'accent',b:'O princípio que organiza tudo acima',
  h:'<b>Nenhuma camada de rede está no caminho de abrir, editar ou exportar.</b><br><br>Esse foi o critério de desenho, não uma consequência feliz. A camada 5 (acesso e cobrança) ficou <i>embaixo</i> da camada 4 (catálogo) justamente para que nada acima dependa dela.<br><br>No CapCut, a camada de rede é caminho crítico: sem internet o app vira casca, porque não há catálogo embarcado nem IA on device. A diferença não é de competência, é de modelo de negócio. Eles podem pagar essa dependência, você não.'},
 {x:685,y:1030,w:655,c:'infra',b:'O que medir para saber que está funcionando',

BOARDS.push({
id:'seguranca', nome:'Segurança', num:'08',
head:{x:0,y:0,w:810,kick:'Autenticação, segredos e o que nunca sai do servidor',
  t:'Segurança e acesso',
  p:'OAuth2 Authorization Code com PKCE em todos os clientes, porque desktop, mobile e web são clientes públicos e nenhum deles consegue guardar segredo. Token de acesso curto, refresh rotativo com detecção de reuso, e nenhuma credencial de terceiro no cliente, jamais.'},
g:[
 {x:0,y:190,w:1340,h:290,t:'Fluxo de autenticação (Authorization Code + PKCE)',c:'ent',i:'O mesmo fluxo nas três plataformas. Diferença só no cofre.'},
 {x:0,y:520,w:1340,h:270,t:'Onde cada segredo mora',c:'infra',i:'Regra: se o cliente consegue ler, não é segredo.'}
],
n:[
 {id:'a1',x:30,y:250,w:230,h:95,l:'shell',t:'1. Gera o verifier',s:'Aleatório no cliente. Nunca trafega.',
  d:{q:'O cliente gera um valor aleatório (code_verifier) e envia só o hash dele (code_challenge) no pedido de autorização.',p:'É o que impede que um app malicioso instalado na mesma máquina intercepte o código de autorização e troque por token. Sem PKCE, o deeplink de retorno é um buraco aberto.',te:'43 a 128 caracteres de aleatoriedade criptográfica. SHA-256 como método de desafio, nunca "plain".',f:'Falha de geração: aborta o login com erro claro. Nunca cai para fluxo sem PKCE.',k:['PKCE','S256','cliente público']}},
 {id:'a2',x:278,y:250,w:230,h:95,l:'ent',t:'2. Autoriza',s:'Navegador do sistema, nunca WebView embutida.',
  d:{q:'Abre a tela de login no navegador padrão do sistema operacional.',p:'WebView embutida permite ao app ler o que o usuário digita, e por isso Google e Apple recusam esse fluxo. Além de bloqueado, é prática ruim: quebra o gerenciador de senha e o 2FA do usuário.',te:'ASWebAuthenticationSession no iOS, Custom Tabs no Android, navegador padrão no desktop via Tauri.',f:'Navegador indisponível: mostra URL e código para digitar em outro device.',k:['navegador do sistema','sem WebView']}},
 {id:'a3',x:526,y:250,w:230,h:95,l:'ent',t:'3. Troca por token',s:'Código mais verifier. Só então vem o token.',
  d:{q:'O cliente apresenta o código recebido junto do code_verifier original. O servidor confere contra o challenge.',p:'Essa conferência é o que amarra o código ao cliente que iniciou o fluxo. Código interceptado sem o verifier é inútil.',te:'Access token JWT de 15 minutos. Refresh token opaco, rotativo.',f:'Verifier não bate: recusa e registra. Possível tentativa de interceptação.',k:['JWT 15min','refresh opaco']}},
 {id:'a4',x:774,y:250,w:230,h:95,l:'ent',t:'4. Guarda',s:'Keychain do sistema. Nunca localStorage.',
  d:{q:'Onde o refresh token descansa em cada plataforma.',p:'Token em localStorage é roubado por qualquer XSS. É a falha mais comum em aplicação web e a mais barata de evitar: custa uma linha de configuração.',te:'Web: cookie HttpOnly com SameSite=Strict, access só em memória. Desktop: Tauri Stronghold ou keychain do SO. Mobile: Keychain iOS e Keystore Android.',f:'Cofre inacessível: sessão só em memória, expira ao fechar, com aviso ao usuário.',k:['HttpOnly','Stronghold','Keystore']}},
 {id:'a5',x:1022,y:250,w:230,h:95,l:'ent',t:'5. Rotaciona',s:'Reuso detectado revoga a família inteira.',
  d:{q:'Cada uso do refresh token emite um novo e invalida o anterior. Se um token já usado reaparecer, toda a família de tokens daquela sessão é revogada.',p:'É o que transforma roubo de refresh token em incidente detectável em vez de acesso permanente e silencioso.',te:'Família de tokens com identificador comum. Reuso dispara revogação e notificação ao usuário.',f:'Revogação por falso positivo: o usuário faz login de novo. Incômodo pequeno, proteção alta.',k:['rotação','detecção de reuso']}},
 {id:'a6',x:30,y:370,w:478,h:95,l:'ent',t:'Autorização: escopo por conta, verificado no servidor a cada chamada',
  s:'Token de acesso válido não significa permissão para a ação. O servidor verifica escopo e propriedade do recurso em toda requisição, mesmo nas que a UI já escondeu.',
  d:{q:'Autenticação diz quem é. Autorização diz o que pode. São checagens separadas e a segunda nunca pode ser delegada ao cliente.',p:'Esconder um botão não é controle de acesso, é organização visual. A falha mais explorada em API é justamente o endpoint que confia na UI.',te:'Verificação de propriedade em toda operação sobre recurso identificado. Escopo no token é teto, nunca permissão final.',f:'Falha na checagem: nega por padrão. Nunca libera por exceção não tratada.',k:['nega por padrão','propriedade do recurso']}},
 {id:'a7',x:526,y:370,w:478,h:95,l:'infra',t:'Rate limit por conta e por IP, com 429 que o cliente respeita',
  s:'Janela deslizante na borda. Resposta com Retry-After, e o cliente espera de verdade em vez de insistir.',
  d:{q:'Proteção contra abuso, enumeração de conta e custo descontrolado de GPU.',p:'Sem limite por conta, uma única conta pode esgotar a sua capacidade de GPU e a sua conta bancária numa tarde.',te:'Limite separado para autenticação (mais rígido), catálogo e jobs. Cliente implementa backoff exponencial respeitando Retry-After.',f:'Limite atingido: mensagem com o tempo de espera, não erro genérico.',k:['429','Retry-After','backoff']}},

 {id:'s1',x:30,y:580,w:255,h:95,l:'infra',t:'Chaves de API de terceiro',s:'Secrets manager. Nunca no cliente, nunca no repositório.',
  d:{q:'Credenciais de provedor de pagamento, e-mail, storage e qualquer serviço externo.',p:'Chave em cliente é chave pública: basta abrir o bundle. Chave em repositório vive para sempre no histórico do git, mesmo depois de removida.',te:'AWS Secrets Manager, Doppler ou Infisical. Injeção por variável de ambiente no deploy. Rotação programada. Varredura de segredo no CI, bloqueando o merge.',f:'Secrets manager fora: as instâncias já rodando mantêm o que carregaram. Deploy novo espera.',k:['secrets manager','rotação','varredura no CI']}},
 {id:'s2',x:303,y:580,w:255,h:95,l:'infra',t:'Chave de assinatura de JWT',s:'Só no servidor de autenticação. Rotação com janela.',
  d:{q:'A chave privada que assina os tokens de acesso.',p:'Vazou, o atacante emite token de qualquer conta. É o segredo mais crítico do sistema inteiro.',te:'Assimétrica (RS256 ou EdDSA): só o emissor assina, os verificadores usam a pública. Rotação com JWKS e período de sobreposição.',f:'Rotação malfeita derruba todas as sessões. Por isso a janela de sobreposição não é opcional.',k:['RS256','JWKS','sobreposição']}},
 {id:'s3',x:576,y:580,w:255,h:95,l:'cat',t:'URL assinada de CDN',s:'Validade curta para material pago.',
  d:{q:'Acesso temporário aos bytes de um pack pago.',p:'Sem isso, descobrir uma URL vale compartilhar o material inteiro. Com validade curta, o link vazado morre antes de circular.',te:'Assinatura com validade de 5 minutos, vinculada à conta. Pack gratuito usa URL pública com cache longo.',f:'Relógio do cliente errado: aceita janela de tolerância pequena, com mensagem clara se expirar.',k:['5 minutos','por conta']}},
 {id:'s4',x:849,y:580,w:255,h:95,l:'ent',t:'Dado de cartão',s:'Nunca toca o seu servidor.',
  d:{q:'Número, validade e código de segurança.',p:'Tokenização no provedor tira você inteiro do escopo de PCI. É a diferença entre uma auditoria cara e nenhuma auditoria.',te:'Elementos hospedados do Stripe ou Pagar.me. Você armazena apenas o identificador do cliente e o do método.',f:'Provedor fora: compra nova indisponível. Assinatura ativa não é afetada.',k:['tokenização','fora do PCI']}},
 {id:'s5',x:1122,y:580,w:190,h:95,l:'ai',t:'Modelos de IA',s:'Públicos. Verificados por hash.',

 {id:'s6',x:30,y:695,w:1282,h:80,l:'accent',t:'A regra que resolve 90% das decisões de segredo neste sistema',
  s:'Se o cliente consegue ler, não é segredo. Se não é segredo, não pode proteger nada. Todo controle que importa (entitlement, cobrança, publicação, export pago) é verificado no servidor, e a verificação do cliente existe só para dar boa experiência, nunca para dar garantia.',
  d:{q:'O princípio derivado direto da engenharia reversa: o CapCut não guarda a decisão de preço no cliente, e por isso adulterar o cliente não libera nada.',p:'Essa é a única postura que sobrevive a um cliente que pode ser descompilado, e todo cliente pode. Assumir isso desde o começo é mais barato que descobrir depois.',te:'Revalidação obrigatória nos pontos que custam dinheiro: export sem marca, upload para GPU, publicação.',f:'Revalidação indisponível: nega a operação paga e oferece a alternativa local. Nunca libera por omissão.',k:['nega por padrão','cliente não garante']}}
],

k:[
 {x:0,y:1130,w:440,c:'ent',b:'OWASP: o que de fato se aplica aqui',
  h:'<b>Controle de acesso quebrado:</b> maior risco do sistema. Mitigado por verificação de propriedade em toda operação.<br><b>Falha criptográfica:</b> TLS obrigatório, criptografia em repouso, nenhum segredo no cliente.<br><b>Injeção:</b> consultas parametrizadas sempre. Nome de arquivo e caminho vindos do usuário são tratados como hostis.<br><b>Desenho inseguro:</b> endereçado pela assimetria fail-open e fail-closed do entitlement.<br><b>SSRF:</b> relevante por causa de import por URL. Lista de permissão de destino, nunca lista de bloqueio.'},
 {x:470,y:1130,w:440,c:'render',b:'Riscos específicos de um editor de vídeo',
  h:'<b>Arquivo de mídia malformado:</b> decodificador é superfície clássica de exploração. Mitigação: decodificar em worker isolado, com limite de memória e tempo, e nunca no processo principal.<br><br><b>Shader vindo do catálogo:</b> código executando na GPU do usuário. Mitigação: shader só de origem assinada, compilado com validação, nunca de URL arbitrária.<br><br><b>Projeto compartilhado:</b> um EDL é dado estruturado vindo de terceiro. Validação de schema estrita e caminho de mídia tratado como não confiável.'},
 {x:940,y:1130,w:400,c:'infra',b:'O que fazer antes do primeiro usuário real',
  h:'<ol style="margin:0;padding-left:18px"><li>Varredura de segredo no CI, bloqueando merge</li><li>Dependências com alerta automático de vulnerabilidade</li><li>TLS com HSTS em tudo</li><li>Backup testado, com restauração ensaiada ao menos uma vez</li><li>Política de privacidade que descreva o que o sistema faz de verdade, incluindo o TTL de 24h</li><li>Canal de contato para relato de vulnerabilidade</li></ol><br>Nada disso é opcional, e tudo cabe em um dia de trabalho.'}

BOARDS.push({
id:'plataformas', nome:'Plataformas', num:'09',
head:{x:0,y:0,w:820,kick:'Web, desktop e mobile sem escrever três vezes',
  t:'Estratégia multiplataforma',
  p:'A pergunta não é qual framework roda em tudo. É onde cortar para que o reaproveitamento seja real. O corte certo: núcleo de edição e tokens são 100% compartilhados, UI de web e desktop é 100% a mesma, e a UI mobile é deliberadamente diferente onde o gesto é diferente.'},
g:[
 {x:0,y:190,w:1340,h:250,t:'Compartilhado de verdade',c:'core',i:'Escrito uma vez, roda em tudo.'},
 {x:0,y:480,w:1340,h:250,t:'Específico por plataforma',c:'shell',i:'Fingir que compartilha aqui produz UI ruim nos dois lados.'}
],
n:[
 {id:'m1',x:30,y:250,w:300,h:95,l:'core',t:'Núcleo de edição',s:'100%. TypeScript puro, sem DOM.',
  d:{q:'Documento, comandos, timeline, autosave, registro de efeitos.',p:'Por não tocar em DOM nem em framework, roda em navegador, em Tauri, em React Native e em Node para testes. É o maior ganho de reaproveitamento do projeto inteiro e é de graça, desde que a disciplina de não importar nada de UI seja mantida.',te:'Pacote isolado no monorepo, com regra de lint que proíbe importar qualquer coisa de UI.',f:'Nenhuma: é lógica pura.',k:['100%','sem DOM','regra de lint']}},
 {id:'m2',x:348,y:250,w:300,h:95,l:'core',t:'Tokens de design',s:'100%. Uma fonte, três consumidores.',
  d:{q:'Cor, tipografia, espaçamento, raio, sombra e duração de animação.',p:'Token em JSON vira variável CSS na web, objeto no NativeWind e constante no React Native. Uma mudança de marca se propaga em um commit.',te:'JSON como fonte, geradores no build. Nenhum valor literal de cor em componente, verificado por lint.',f:'Nenhuma: é build time.',k:['JSON como fonte','lint contra literal']}},
 {id:'m3',x:666,y:250,w:300,h:95,l:'ai',t:'Modelos e pipelines de IA',s:'100% do modelo, runtime por plataforma.',
  d:{q:'Os mesmos arquivos ONNX, o mesmo pré e pós processamento.',p:'Um formato só é a diferença entre manter um pipeline e manter três. Só o runtime muda: Web no navegador e no Tauri, nativo no mobile.',te:'ONNX Runtime Web com WebGPU, ONNX Runtime nativo no mobile. Mesma versão de modelo em todos.',f:'Device sem suporte: resolução menor ou caminho servidor.',k:['ONNX','um formato']}},
 {id:'m4',x:984,y:250,w:326,h:95,l:'ent',t:'Contratos de API e schemas',s:'100%. Tipos gerados, não escritos à mão.',
  d:{q:'Schema do EDL, do descritor de catálogo, das respostas de API.',p:'Tipo gerado a partir do schema elimina a classe inteira de bug de contrato divergente entre cliente e servidor, que é a mais chata de achar.',te:'OpenAPI ou tRPC para API, JSON Schema para documento e descritor, com geração de tipos no build.',f:'Schema divergente é erro de build, não de produção.',k:['geração de tipos','erro de build']}},

 {id:'m5',x:30,y:540,w:300,h:95,l:'render',t:'Timeline',s:'Mouse e toque são produtos diferentes.',
  d:{q:'Precisão de trim, zoom, seleção múltipla, atalho de teclado contra pinça, arraste e alvo de toque.',p:'No desktop o usuário ajusta frame a frame com o mouse e usa atalho. No celular ele usa o polegar numa faixa de 44px. A mesma implementação atende mal os dois. O IMG.LY documenta bem isso: a timeline mobile é o componente mais difícil do produto.',te:'Mesma máquina de estados vinda do núcleo, duas camadas de interação. O que é compartilhado é a lógica, não o gesto.',f:'Nenhuma: é UI.',k:['44px','atalho vs pinça']}},
 {id:'m6',x:348,y:540,w:300,h:95,l:'render',t:'Pipeline de render',s:'WebGPU na web, nativo no mobile.',

 {x:685,y:1270,w:655,c:'shell',b:'O que aprender de quem já faz isso bem',

  h:'<b>Por quê:</b> metade da sua interface não existe em biblioteca nenhuma e será construída de qualquer jeito. O que você precisa comprar pronto é diálogo, popover, menu e slider <b>acessíveis</b>, que é onde implementação caseira falha. O Radix resolve isso e o shadcn coloca o código no seu repositório, sem lock-in de tema.<br><br><b>Por que não Ant Design:</b> é a melhor opção para painel denso de dados, com a tabela e o formulário mais completos do ecossistema React. Mas traz um visual de sistema corporativo que briga com ferramenta criativa, e a parte densa não é o núcleo aqui. <b>Vale para o painel administrativo interno</b>, onde a velocidade importa mais que a identidade.<br><br><b>Por que não MUI:</b> Material Design é opinativo demais e o data grid avançado é pago (MUI X). Pagar por grid num produto cujo componente crítico é canvas não se justifica.'},
