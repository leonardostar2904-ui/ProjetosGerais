n:[
 {id:'d01',x:24,y:250,w:305,h:120,l:'shell',tag:['dec'],dcs:'D01',
  t:'D01 · Escopo da V1',
  s:'Recomendo: editor enxuto de vídeo curto, com a fatia mínima marcada dentro dele.',
  d:{sec:[
   ['A pergunta','<p>O que a V1 do produto cobre, e onde fica a fatia mínima recomendada no quadro Veredito?</p>'],
   ['Opções','<ul><li><strong>A.</strong> Os 19 módulos da sua lista, completos.</li><li><strong>B.</strong> Editor V1 enxuto para vídeo curto: o essencial dos 19, timeline simplificada e os recursos de IA.</li><li><strong>C.</strong> Só a fatia mínima: remover fundo e legendar, sem timeline.</li></ul>'],
   ['Recomendação','<p><strong>B</strong>, com as telas da fatia C marcadas dentro dela.</p>'],
   ['Por que','<p>A leva a uma V1 que compete com o DaVinci em profundidade e com o CapCut em amplitude ao mesmo tempo. C valida mercado mas não é um editor, e o seu briefing pede timeline, área de edição e propriedades. B desenha o editor que você descreveu, cortado ao que o segmento principal usa. A ordem dos wireframes entrega primeiro as telas da fatia C: se você decidir construir só ela, o desenho fica pronto antes do resto.</p><p>Mantenho a leitura do quadro Veredito: construir tudo agora atrasa a sua meta financeira. Desenhar é outra conta: custa semanas, e o resultado vira portfólio de produto.</p>'],
   ['O que muda se você aprovar','<p>28 unidades de wireframe em vez de cerca de 40. O que está marcado V2 no quadro D4 fica fora desta etapa.</p>']]}},
 {id:'d02',x:349,y:250,w:305,h:120,l:'shell',tag:['dec'],dcs:'D02',
  t:'D02 · Usuário principal',
  s:'Recomendo: S1 criador e pequeno negócio. S2 como evolução, S3 fora da V1.',
  d:{sec:[
   ['A pergunta','<p>Para quem a V1 é desenhada primeiro, e o que "profissionais" significa no seu briefing?</p>'],
   ['Opções','<ul><li><strong>A.</strong> S1, criador e pequeno negócio.</li><li><strong>B.</strong> S3, editor avançado.</li><li><strong>C.</strong> Os dois por igual.</li></ul>'],
   ['Recomendação','<p><strong>A</strong>, com S2 como evolução natural e S3 fora da V1.</p>'],
   ['Por que','<p>Os dois públicos do briefing pedem interfaces opostas: densidade e precisão contra poucos passos e escolhas prontas. Desenhar para os dois por igual produz uma interface densa demais para S1 e rasa demais para S3.</p><p>Se "profissional" significa a pessoa de social media que edita para clientes (S2), a recomendação atende. Se significa editor de vídeo de carreira (S3), preciso saber agora, porque muda a timeline, a densidade e a ordem dos wireframes.</p>'],
   ['O que muda se você aprovar','<p>Define a densidade padrão, o modelo de timeline (D04) e o que fica a um toque ou recolhido.</p>']]}},
 {id:'d05',x:674,y:250,w:305,h:120,l:'shell',tag:['dec','arq'],dcs:'D05',
  t:'D05 · Receitas como entrada principal',
  s:'Recomendo: duas receitas em destaque na Início. Projeto em branco disponível, em segundo plano.',
  d:{sec:[
   ['A pergunta','<p>A Início leva primeiro a receitas (sequências prontas) ou a um projeto em branco?</p>'],
   ['Opções','<ul><li><strong>A.</strong> Receitas em destaque, projeto em branco disponível.</li><li><strong>B.</strong> Projeto em branco em destaque, receitas como atalho.</li></ul>'],
   ['Recomendação','<p><strong>A</strong>, com duas receitas na V1: "Legendar e cortar pausas" e "Remover fundo".</p>'],
   ['Por que','<p>É o que leva o objetivo principal de 12 para 4 interações (quadro Jornada da arquitetura). Mostra o valor do produto no primeiro uso, em vez de entregar uma timeline vazia para quem nunca editou. O risco é a receita virar ruído se for fraca; por isso só duas, ligadas às tarefas T1, T3 e T4.</p>'],
   ['O que muda se você aprovar','<p>A Início ganha uma área de receitas acima dos projetos. Cada receita abre o editor já no layout certo, com o trabalho feito.</p>']]}},
 {id:'d06',x:999,y:250,w:317,h:120,l:'shell',tag:['dec','arq'],dcs:'D06',
  t:'D06 · Conta obrigatória',
  s:'Recomendo: editar e exportar sem conta. Conta só para servidor, sincronização e cobrança.',
  d:{sec:[
   ['A pergunta','<p>Editar exige cadastro?</p>'],
   ['Opções','<ul><li><strong>A.</strong> Não. Conta só quando o recurso exige.</li><li><strong>B.</strong> Conta no primeiro uso.</li></ul>'],
   ['Recomendação','<p><strong>A</strong>.</p>'],
   ['Por que','<p>Pedir cadastro antes do primeiro resultado é o ponto de abandono mais caro de um app criativo. A arquitetura local first permite isso sem custo, porque o projeto vive no aparelho. Também é o princípio Conforto.</p>'],
   ['O que muda se você aprovar','<p>Login sai do fluxo principal e vira tela transversal (seção 8). Custo: menos dado de uso identificado até a pessoa criar conta.</p>']]}},
 {id:'d07',x:24,y:390,w:305,h:120,l:'shell',tag:['dec','hip'],dcs:'D07',
  t:'D07 · Formato e duração de referência',
  s:'Recomendo: vertical 9:16 como padrão. Interface pensada para até 3 minutos, sem quebrar até 15.',
  d:{sec:[
   ['A pergunta','<p>Qual o formato padrão de projeto e a duração de vídeo que a interface otimiza?</p>'],
   ['Recomendação','<p>Vertical 9:16 como padrão, trocável a qualquer momento. Interface otimizada para vídeos de até 3 minutos e funcional até 15.</p>'],
   ['Por que','<p>Define quantos segundos cabem na tela da timeline, o tamanho das miniaturas e o tempo de processamento das receitas. É uma hipótese sobre S1. Acima de 15 minutos o caso já é S3.</p>'],
   ['Lacuna','<p>Não há dado real de duração típica. Validar nas conversas da L01.</p>']]}},
 {id:'d12',x:349,y:390,w:305,h:120,l:'shell',tag:['dec','rec'],dcs:'D12',
  t:'D12 · Onde os wireframes vivem',
  s:'Recomendo: neste mesmo canvas, com desktop e mobile lado a lado e comentários numerados clicáveis.',
  d:{sec:[
   ['A pergunta','<p>Os wireframes da Etapa 1 são feitos aqui ou no Figma?</p>'],
   ['Opções','<ul><li><strong>A.</strong> Neste canvas: um quadro por seção, wireframes em blocos cinza, numeração no desenho que abre o comentário, interações simuladas marcadas como simuladas, e o mesmo registro de aprovação.</li><li><strong>B.</strong> Figma.</li></ul>'],
   ['Recomendação','<p><strong>A</strong> para a Etapa 1.</p>'],
   ['Por que','<p>Mantém arquitetura, decisões e wireframes num lugar só, com histórico de aprovação. Permite simular abrir painel e trocar estado, que você pediu.</p>'],
   ['Limitação','<p>O conector de design do Figma (plugin) recusou conexão nesta sessão. Há um segundo conector do Figma listado que eu ainda não testei. Avalio para a Etapa 2 se você quiser um arquivo que outro designer edite.</p>']]}},

 {id:'d04',x:24,y:630,w:305,h:120,l:'core',tag:['dec','rec'],dcs:'D04',
  t:'D04 · Modelo de timeline',
  s:'Recomendo: magnética, com trilha principal e o resto preso a ela.',
  d:{sec:[
   ['A pergunta','<p>A timeline é magnética ou de trilhas livres?</p>'],
   ['Opções','<ul><li><strong>A.</strong> Magnética: uma trilha principal onde os clipes se encostam sozinhos. Texto, legenda, áudio e sobreposições ficam presos a ela. Modelo do CapCut e do Final Cut.</li><li><strong>B.</strong> Trilhas livres: várias trilhas independentes, posição livre. Modelo do Premiere e do DaVinci.</li></ul>'],
   ['Recomendação','<p><strong>A</strong>.</p>'],
   ['Por que','<p>Para S1, a magnética elimina os erros mais comuns de quem começa: buraco preto entre clipes e legenda fora de sincronia depois de um corte. Funciona no toque. Trilhas livres dão um controle que S3 quer e S1 não usa, e custam mais no componente mais caro do projeto. É também o que permite uma timeline mobile sem virar outro produto.</p>'],
   ['O que muda se você aprovar','<p>Define a seção 2 inteira e o comportamento de cortar, mover e excluir.</p>']]}},
 {id:'d08',x:349,y:630,w:305,h:120,l:'core',tag:['dec','rec'],dcs:'D08',
  t:'D08 · Organização da mídia',
  s:'Recomendo: mídia por projeto na V1. Biblioteca global entre projetos na V2.',
  d:{sec:[
   ['A pergunta','<p>A mídia mora dentro de cada projeto ou numa biblioteca global?</p>'],
   ['Recomendação','<p>Por projeto na V1. Biblioteca global, com pastas e etiquetas, na V2.</p>'],
   ['Por que','<p>Biblioteca global é um produto dentro do produto: indexação, busca, duplicatas, arquivo que mudou de lugar. S1 importa a gravação do dia, usa e esquece. S2 vai precisar dela, e ela entra junto com o kit de marca.</p>']]}},
 {id:'d09',x:674,y:630,w:305,h:120,l:'core',tag:['dec','rec'],dcs:'D09',
  t:'D09 · Tablet',
  s:'Recomendo: sem layout próprio. Paisagem usa o desktop, retrato usa o mobile.',
  d:{sec:[
   ['A pergunta','<p>Tablet ganha um terceiro layout?</p>'],
   ['Recomendação','<p>Não na V1. Tablet em paisagem usa o layout desktop com alvos de toque ampliados. Em retrato, usa o layout mobile com mais área de preview.</p>'],
   ['Por que','<p>Um terceiro layout aumenta em metade o trabalho de wireframe e de testes para a menor fatia de uso. Os dois layouts cobrem o tablet com ajuste de densidade.</p>'],
   ['Faixas propostas','<ul><li>Até 599 px: mobile.</li><li>De 600 a 1023 px: mobile expandido (tablet em retrato).</li><li>A partir de 1024 px: desktop (tablet em paisagem incluso).</li></ul>']]}},

 {id:'d03',x:24,y:870,w:305,h:120,l:'ent',tag:['dec','bb'],dcs:'D03',
  t:'D03 · Relação com a marca ICARUS',
  s:'Recomendo: decidir antes da Etapa 2. Até lá, EDITICARUS PRO é nome de trabalho.',
  d:{sec:[
   ['A pergunta','<p>O EDITICARUS é submarca da ICARUS ou marca independente?</p>'],
   ['Contexto do brand book','<ul><li>A arquitetura de marca aprovada em 26.09.2026 lista rotina, hobby e presença. Editor de vídeo não está nela.</li><li>O padrão de nome das submarcas é ICARUS mais uma palavra (ICARUS TOM, ICARUS Scent). EDITICARUS PRO foge dele.</li><li>"PRO" puxa para o território de performance que a marca combate. Entre as palavras evitadas estão "alta performance" e "produtividade extrema".</li></ul>'],
   ['Opções','<ul><li><strong>A.</strong> Submarca: herda logo e sistema (regra aprovada: submarcas herdam o logo da marca mãe por enquanto). Os valores viram princípios de UX e a voz vale para a microcopy.</li><li><strong>B.</strong> Marca independente: a Etapa 2 precisa de uma identidade que ainda não existe.</li></ul>'],
   ['Recomendação','<p>Decidir antes da Etapa 2, sem bloquear a Etapa 1. Enquanto isso, uso os valores da marca como princípios de UX provisórios (eles servem a um editor por mérito próprio) e escrevo a microcopy dos wireframes em tom neutro.</p>'],
   ['Por que não recomendo uma das opções','<p>É decisão de marca, e a ficha de governança do brand book diz que o responsável pela marca é você. Não cabe a mim escolher. Cabe a mim mostrar que ela precisa existir antes de aplicar qualquer identidade.</p>']]}},
 {id:'d10',x:349,y:870,w:305,h:120,l:'ent',tag:['dec','arq'],dcs:'D10',
  t:'D10 · Recursos pagos na interface',
  s:'Recomendo: desenhar o padrão de oferta uma vez e usar só onde houver recurso pago.',
  d:{sec:[
   ['A pergunta','<p>A interface da V1 mostra recursos pagos, e como?</p>'],
   ['Contexto','<p>A arquitetura define gratuito tudo que roda no aparelho e pago o que usa servidor (exportação 4K, ampliação de resolução), com marca d’água no preview. O quadro Veredito recomenda cobrar desde o primeiro usuário na fatia mínima.</p>'],
   ['Opções','<ul><li><strong>A.</strong> Desenhar o padrão uma vez: selo de recurso pago, oferta no momento de uso com o resultado na tela, tela de plano. Aplicar só onde existe recurso pago.</li><li><strong>B.</strong> V1 sem nada pago na interface.</li></ul>'],
   ['Recomendação','<p><strong>A</strong>.</p>'],
   ['Por que','<p>O padrão precisa ser desenhado de qualquer jeito e é barato desenhar uma vez. Espalhar ofertas pelas telas contradiz a proposta (sem crédito, sem cota) e o princípio Conforto.</p>'],
   ['Lacuna','<p>O que é pago ainda não está decidido comercialmente (L04).</p>']]}},
 {id:'d11',x:674,y:870,w:305,h:120,l:'ent',tag:['dec','rec'],dcs:'D11',
  t:'D11 · Idiomas',
  s:'Recomendo: interface em português do Brasil, pronta para tradução. Legendas em português, inglês e espanhol.',
  d:{sec:[
   ['A pergunta','<p>Quais idiomas na interface e nas legendas automáticas da V1?</p>'],
   ['Recomendação','<p>Interface só em português do Brasil, com textos separados do código para tradução futura. Legendas automáticas em português, inglês e espanhol.</p>'],
   ['Por que','<p>O modelo de transcrição atende os três idiomas sem custo de interface. Traduzir a interface triplica a revisão de microcopy. Desenhar em português já protege o layout, porque os textos costumam ser mais longos que em inglês.</p>']]}},

 {id:'l01',x:24,y:1110,w:305,h:120,l:'infra',tag:['lac','rec'],

 {id:'l02',x:349,y:1110,w:305,h:120,l:'infra',tag:['lac'],

 {id:'l03',x:674,y:1110,w:305,h:120,l:'infra',tag:['lac'],
  t:'L03 · Tipo de conteúdo dominante',
  s:'Falado para câmera, imagens com música ou tutorial de tela? Muda o peso da legenda contra a música.',

 {id:'l04',x:999,y:1110,w:317,h:120,l:'infra',tag:['lac'],

/* ---------- legenda ---------- */
function legend(grp){
  if (grp === 'des'){

  }
}

/* ---------- trilha ---------- */
let lastG = null;
BOARDS.forEach((b,i) => {
  if (b.grp !== lastG){
    const s = document.createElement('span');
    s.className = 'rgrp'; s.textContent = GRP[b.grp] || b.grp;
    rail.appendChild(s); lastG = b.grp;

  const btn = document.createElement('button');
  btn.className = 'rb'; btn.type = 'button'; btn.dataset.i = i;
  btn.innerHTML = '<em>' + b.num + '</em>' + esc(b.nome);
  btn.addEventListener('click', () => show(i));
  rail.appendChild(btn);
});

/* ---------- render de um quadro ---------- */
function show(i, keepView){
  cur = i; const b = BOARDS[i];

      '</h2><p>' + esc(b.head.p) + '</p>';
    world.appendChild(h);
  }

  (b.g || []).forEach(g => {
    const d = document.createElement('div');
    d.className = 'grp';
    d.style.cssText = 'left:' + g.x + 'px;top:' + g.y + 'px;width:' + g.w + 'px;height:' + g.h +
      'px;--gc:' + col(g.c) + ';border-color:color-mix(in srgb,' + col(g.c) + ' 40%,transparent)';
    d.innerHTML = '<b>' + esc(g.t) + '</b>' + (g.i ? '<i>' + esc(g.i) + '</i>' : '');
    world.appendChild(d);
  });

  (b.z || []).forEach(z => {
    const d = document.createElement('div');
    d.className = 'zfr';
    d.style.cssText = 'left:' + z.x + 'px;top:' + z.y + 'px;width:' + z.w + 'px';
    d.innerHTML = '<b>' + esc(z.t) + '</b><div class="zdev" style="height:' + z.h + 'px">' +
      z.zones.map(q => '<div class="zz' + (q[6] ? ' hot' : '') + '" style="left:' + q[0] + '%;top:' + q[1] +
        '%;width:' + q[2] + '%;height:' + q[3] + '%"><span>' + (q[5] ? '<em>' + q[5] + '</em>' : '') +
        esc(q[4]) + '</span></div>').join('') + '</div>' + (z.c ? '<i>' + esc(z.c) + '</i>' : '');
    world.appendChild(d);
  });

  (b.n || []).forEach(n => {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'n' + (n.dec ? ' dec' : '') + (n.term ? ' term' : '') + (n.ghost ? ' ghost' : '');
    el.style.cssText = 'left:' + n.x + 'px;top:' + n.y + 'px;width:' + n.w + 'px;min-height:' +
      n.h + 'px;--c:' + col(n.l);
    const tags = [].concat(n.tag || []);
    el.innerHTML = (tags.length ? '<span class="tags">' + tags.map(t => '<span class="tg ' + t + '">' +
        TSHORT[t] + '</span>').join('') + '</span>' : '') +
      (n.dec ? '<span class="tag">decisão</span>' : '') + '<b>' + esc(n.t) + '</b>' +
      (n.s ? '<small>' + esc(n.s) + '</small>' : '') +
      (n.dcs ? '<span class="stp" data-dcs="' + n.dcs + '"></span>' : '');
    el.addEventListener('click', e => { e.stopPropagation(); openPanel(n, el); });
    world.appendChild(el);
    nodeMap[n.id] = {el, n};
  });

  (b.k || []).forEach(k => {
    const d = document.createElement('div');
    d.className = 'note';
    d.style.cssText = 'left:' + k.x + 'px;top:' + k.y + 'px;width:' + k.w + 'px;--c:' + col(k.c);
    d.innerHTML = '<b>' + esc(k.b) + '</b>' + k.h;
    world.appendChild(d);
  });

  (b.t || []).forEach(t => {
    const d = document.createElement('div');
    d.className = 'tbl';
    d.style.cssText = 'left:' + t.x + 'px;top:' + t.y + 'px;width:' + t.w + 'px';
    d.innerHTML = '<table><caption>' + esc(t.cap) + '</caption><thead><tr>' +
      t.h.map(h => '<th>' + esc(h) + '</th>').join('') + '</tr></thead><tbody>' +
      t.r.map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>').join('') +
      '</tbody></table>';
    world.appendChild(d);
  });

  paintDecisions(); paintSections();
  requestAnimationFrame(() => { drawEdges(b); if (!keepView) frameBoard(); });
  try { history.replaceState(null, '', '#' + b.id); } catch(e){}
}

/* ---------- arestas ---------- */
function drawEdges(b){
  const NS = 'http://www.w3.org/2000/svg';
  svg.innerHTML = '';
  world.querySelectorAll('.elab').forEach(e => e.remove());
  const line = getComputedStyle(document.documentElement).getPropertyValue('--line-strong').trim();

  const defs = document.createElementNS(NS, 'defs');
  defs.innerHTML = '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" ' +
    'markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="' + line + '"/></marker>';
  svg.appendChild(defs);

  (b.e || []).forEach(e => {
    const A = nodeMap[e.f], B = nodeMap[e.t];
    if (!A || !B) return;
    const a = {x:A.n.x, y:A.n.y, w:A.n.w, h:A.el.offsetHeight || A.n.h};
    const z = {x:B.n.x, y:B.n.y, w:B.n.w, h:B.el.offsetHeight || B.n.h};
    const ac = {x:a.x + a.w/2, y:a.y + a.h/2}, zc = {x:z.x + z.w/2, y:z.y + z.h/2};
    const dx = zc.x - ac.x, dy = zc.y - ac.y;
    let p1, p2, c1, c2;
    if (Math.abs(dx) > Math.abs(dy) * 1.1){
      const s = dx > 0 ? 1 : -1;
      p1 = {x: dx > 0 ? a.x + a.w : a.x, y: ac.y};
      p2 = {x: dx > 0 ? z.x : z.x + z.w, y: zc.y};
      const d = Math.min(Math.abs(p2.x - p1.x) * 0.5, 80);
      c1 = {x: p1.x + s*d, y: p1.y}; c2 = {x: p2.x - s*d, y: p2.y};
    } else {
      const s = dy > 0 ? 1 : -1;
      p1 = {x: ac.x, y: dy > 0 ? a.y + a.h : a.y};
      p2 = {x: zc.x, y: dy > 0 ? z.y : z.y + z.h};
      const d = Math.min(Math.abs(p2.y - p1.y) * 0.5, 70);
      c1 = {x: p1.x, y: p1.y + s*d}; c2 = {x: p2.x, y: p2.y - s*d};
    }
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('d', 'M' + p1.x + ',' + p1.y + ' C' + c1.x + ',' + c1.y + ' ' + c2.x + ',' +
      c2.y + ' ' + p2.x + ',' + p2.y);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', line);
    path.setAttribute('stroke-width', '1.6');
    path.setAttribute('marker-end', 'url(#ah)');
    if (e.k === 'd') path.setAttribute('stroke-dasharray', '5 4');
    svg.appendChild(path);

    if (e.l){
      const t = 0.5;
      const bx = Math.pow(1-t,3)*p1.x + 3*Math.pow(1-t,2)*t*c1.x + 3*(1-t)*t*t*c2.x + t*t*t*p2.x;
      const by = Math.pow(1-t,3)*p1.y + 3*Math.pow(1-t,2)*t*c1.y + 3*(1-t)*t*t*c2.y + t*t*t*p2.y;
      const lab = document.createElement('div');
      lab.className = 'elab';
      lab.style.cssText = 'left:' + bx + 'px;top:' + by + 'px';
      lab.textContent = e.l;
      world.appendChild(lab);
    }
  });

  let maxX = 0, maxY = 0;
  [...world.children].forEach(c => {
    if (c.id === 'edges') return;
    maxX = Math.max(maxX, c.offsetLeft + c.offsetWidth);
    maxY = Math.max(maxY, c.offsetTop + c.offsetHeight);
  });
  svg.setAttribute('width', maxX + 200); svg.setAttribute('height', maxY + 200);
}

/* ---------- registro: decisões e seções ---------- */
function when(iso){
  if (!iso) return '';
  try { return 'registrado em ' + new Date(iso).toLocaleString('pt-BR', {dateStyle:'short', timeStyle:'short'}); }
  catch(e){ return ''; }
}
function paintDecisions(){
  document.querySelectorAll('[data-dcs]').forEach(e => {
    const st = (DSTATE[e.dataset.dcs] || {}).status;
    const k = DST[st] ? st : 'aguardando';
    e.className = 'stp ' + k; e.textContent = DST[k];
  });
  const c = document.getElementById('dcount');
  if (c){
    const ap = DIDS.filter(i => (DSTATE[i] || {}).status === 'aprovado').length;
    const aj = DIDS.filter(i => (DSTATE[i] || {}).status === 'ajustes').length;
    c.textContent = ap + ' aprovadas, ' + aj + ' com ajuste pedido, ' + (DIDS.length - ap - aj) +
      ' aguardando, de ' + DIDS.length + '.' + (DB ? '' : ' Registro indisponível nesta visualização.');
  }
  if (panelNode && panelNode.dcs){
    const s = DSTATE[panelNode.dcs] || {}, k = DST[s.status] ? s.status : 'aguardando';
    const st = document.getElementById('apst'), wh = document.getElementById('apwhen');
    if (st){ st.className = 'stp ' + k; st.textContent = DST[k]; }
    if (wh) wh.textContent = when(s.em);
  }
}
function paintSections(){
  document.querySelectorAll('[data-sec]').forEach(e => {
    const st = (SSTATE[e.dataset.sec] || {}).status;
    const k = SST[st] ? st : (e.dataset.def || 'nao_iniciado');
    e.className = 'stp ' + k; e.textContent = SST[k];
  });
}
const canWrite = () => !!DB && ME.owner !== false;
function approvalHTML(id){
  const s = DSTATE[id] || {}, k = DST[s.status] ? s.status : 'aguardando';
  return '<section class="appr"><h4>Sua decisão sobre ' + id + '</h4>' +
    '<div class="stline"><span class="stp ' + k + '" id="apst">' + DST[k] + '</span><span id="apwhen">' +
    when(s.em) + '</span></div>' +
    '<label for="apnote">Nota para mim (opcional)</label>' +
    '<textarea id="apnote" maxlength="2000" placeholder="Ex.: aprovo, mas quero ver a opção B desenhada na seção 2.">' +
    esc(s.nota || '') + '</textarea>' +
    '<div class="apb"><button type="button" class="pri" id="apok">Aprovar recomendação</button>' +
    '<button type="button" id="apadj">Pedir ajuste</button>' +
    '<button type="button" class="lnk" id="aprst">Voltar para aguardando</button></div>' +
    '<p class="aph" id="aph"></p></section>';
}
function wireApproval(id){
  const btns = ['apok','apadj','aprst'].map(x => document.getElementById(x));
  const hint = t => { const h = document.getElementById('aph'); if (h) h.textContent = t; };
  const sync = () => {
    btns.forEach(b => { if (b) b.disabled = !canWrite(); });
    if (!DB) hint('O registro não está disponível nesta visualização. Responda no chat citando ' + id + '.');
    else if (ME.owner === false) hint('Só o dono desta página registra decisões.');
  };
  sync();
  const save = async status => {
    if (!canWrite()) return;
    const ta = document.getElementById('apnote');
    const nota = ta ? ta.value.trim().slice(0, 2000) : '';
    btns.forEach(b => { if (b) b.disabled = true; });
    hint('Salvando.');
    try {
      await DB.collection('decisoes').doc(id).set({status, nota, em:new Date().toISOString(), por:ME.id || null});
      hint(status === 'aguardando' ? id + ' voltou para aguardando aprovação.'
        : 'Registrado. Eu leio este registro antes de seguir para a próxima etapa.');
    } catch(e){
      hint(e && e.code === 'invalid_argument' ? 'Só o dono desta página registra decisões. Responda no chat citando ' + id + '.'
        : 'Não deu para salvar agora. Sua nota continua no campo; tente de novo em instantes.');
    } finally { sync(); }
  };
  if (btns[0]) btns[0].addEventListener('click', () => save('aprovado'));
  if (btns[1]) btns[1].addEventListener('click', () => save('ajustes'));
  if (btns[2]) btns[2].addEventListener('click', () => save('aguardando'));
  panel._sync = sync;
}

/* ---------- painel ---------- */
function openPanel(n, el){
  if (sel) sel.classList.remove('on');
  sel = el; el.classList.add('on'); panelNode = n;
  const d = n.d || {}, tags = [].concat(n.tag || []);
  player.textContent = tags.length ? tags.map(t => TAGS[t]).join(' · ') : (LNAMES[n.l] || '');
  player.style.setProperty('--c', col(n.l));
  ptitle.textContent = n.t;
  let h = '';
  if (d.sec) d.sec.forEach(s => {
    h += '<section><h4>' + esc(s[0]) + '</h4>' + (s[1].charAt(0) === '<' ? s[1] : '<p>' + s[1] + '</p>') + '</section>';
  });
  if (d.q) h += '<section><h4>O que é</h4><p>' + d.q + '</p></section>';
  if (d.p) h += '<section><h4>Por que existe assim</h4><p>' + d.p + '</p></section>';
  if (d.te) h += '<section><h4>Tecnologia e critério</h4><p>' + d.te + '</p></section>';
  if (d.f) h += '<section><h4>Se falhar</h4><p class="fail">' + d.f + '</p></section>';
  if (!d.sec && !d.q && n.s) h += '<section><h4>Resumo</h4><p>' + esc(n.s) + '</p></section>';
  if (d.k && d.k.length) h += '<section><h4>Referências</h4><div class="chips">' +
    d.k.map(k => '<span class="chip">' + esc(k) + '</span>').join('') + '</div></section>';
  if (n.dcs) h += approvalHTML(n.dcs);
  pb.innerHTML = h || '<p>Sem detalhe adicional.</p>';
  pb.scrollTop = 0;
  panel._sync = null;
  if (n.dcs) wireApproval(n.dcs);
  panel.classList.add('open'); panel.setAttribute('aria-hidden','false');
}
function closePanel(){
  panel.classList.remove('open'); panel.setAttribute('aria-hidden','true');
  if (sel) { sel.classList.remove('on'); sel = null; }
  panelNode = null; panel._sync = null;
}
$('#pclose').addEventListener('click', closePanel);

/* ---------- transform ---------- */
function apply(){
  world.style.transform = 'translate(' + view.x + 'px,' + view.y + 'px) scale(' + view.k + ')';
  $('#zlvl').textContent = Math.round(view.k * 100) + '%';
}
function bounds(){
  let maxX = 0, maxY = 0, minX = 1e9, minY = 1e9;
  [...world.children].forEach(c => {
    if (c.id === 'edges') return;
    minX = Math.min(minX, c.offsetLeft); minY = Math.min(minY, c.offsetTop);
    maxX = Math.max(maxX, c.offsetLeft + c.offsetWidth);
    maxY = Math.max(maxY, c.offsetTop + c.offsetHeight);
  });
  return minX > 1e8 ? null : {minX, minY, maxX, maxY};
}
function fit(){
  const r = bounds(); if (!r) return;
  const pad = 56, vw = stage.clientWidth, vh = stage.clientHeight;
  const k = Math.min((vw - pad*2) / (r.maxX - r.minX), (vh - pad*2) / (r.maxY - r.minY), 1.1);
  view.k = Math.max(0.08, k);
  view.x = pad - r.minX * view.k + (vw - pad*2 - (r.maxX - r.minX)*view.k) / 2;
  view.y = pad - r.minY * view.k;
  apply();
}
/* quadro alto demais para caber legível: encaixa pela largura e começa do topo */
function frameBoard(){
  const r = bounds(); if (!r) return;
  const pad = 56, vw = stage.clientWidth, vh = stage.clientHeight;
  const kAll = Math.min((vw - pad*2) / (r.maxX - r.minX), (vh - pad*2) / (r.maxY - r.minY), 1.1);
  if (kAll >= 0.5 || vw < 700) return fit();
  view.k = Math.min((vw - pad*2) / (r.maxX - r.minX), 1);
  view.x = pad - r.minX * view.k + (vw - pad*2 - (r.maxX - r.minX)*view.k) / 2;
  view.y = pad - r.minY * view.k;
  apply();
}
function zoomAt(f, cx, cy){
  const k2 = Math.min(2.4, Math.max(0.08, view.k * f));
  const r = k2 / view.k;
  view.x = cx - (cx - view.x) * r; view.y = cy - (cy - view.y) * r;
  view.k = k2; apply();
}
$('#bzi').addEventListener('click', () => zoomAt(1.25, stage.clientWidth/2, stage.clientHeight/2));
$('#bzo').addEventListener('click', () => zoomAt(0.8, stage.clientWidth/2, stage.clientHeight/2));
$('#bfit').addEventListener('click', fit);

/* ---------- pan ---------- */
let drag = null;
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('.n, #panel, #legend, .tbl')) return;
  drag = {x:e.clientX, y:e.clientY, vx:view.x, vy:view.y, id:e.pointerId};
  stage.classList.add('drag');
  try { stage.setPointerCapture(e.pointerId); } catch(err){}
});
stage.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  view.x = drag.vx + (e.clientX - drag.x); view.y = drag.vy + (e.clientY - drag.y); apply();
});
const endDrag = () => { drag = null; stage.classList.remove('drag'); };
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);
stage.addEventListener('click', e => { if (!e.target.closest('.n, #panel')) closePanel(); });

stage.addEventListener('wheel', e => {
  if (e.target.closest('#panel, #legend')) return;
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey) zoomAt(e.deltaY < 0 ? 1.12 : 0.89, e.clientX - r.left, e.clientY - r.top);
  else { view.x -= e.deltaX; view.y -= e.deltaY; apply(); }
}, {passive:false});

/* pinça */
let pinch = null;
stage.addEventListener('touchstart', e => {
  if (e.touches.length === 2){
    const [a,b] = e.touches;
    pinch = {d: Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY), k: view.k};
    drag = null; stage.classList.remove('drag');
  }
}, {passive:true});
stage.addEventListener('touchmove', e => {
  if (e.touches.length === 2 && pinch){
    e.preventDefault();
    const [a,b] = e.touches, r = stage.getBoundingClientRect();
    const d = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    const target = Math.min(2.4, Math.max(0.08, pinch.k * (d / pinch.d)));
    const cx = (a.clientX + b.clientX)/2 - r.left, cy = (a.clientY + b.clientY)/2 - r.top;
    zoomAt(target / view.k, cx, cy);
  }
}, {passive:false});
stage.addEventListener('touchend', () => { pinch = null; }, {passive:true});

/* ---------- teclado ---------- */
document.addEventListener('keydown', e => {
  const tg = e.target.tagName;
  if (tg === 'INPUT' || tg === 'TEXTAREA') return;
  if (e.key === 'Escape') closePanel();
  if (e.key === '0') fit();
  if (e.key === 'ArrowRight' && e.altKey) show(Math.min(BOARDS.length-1, cur+1));
  if (e.key === 'ArrowLeft' && e.altKey) show(Math.max(0, cur-1));
});

/* ---------- tema ---------- */
$('#btheme').addEventListener('click', () => {
  const r = document.documentElement;
  const dark = r.getAttribute('data-theme') === 'dark' ||
    (!r.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  r.setAttribute('data-theme', dark ? 'light' : 'dark');
  try { localStorage.setItem('ep-theme', dark ? 'light' : 'dark'); } catch(err){}
  drawEdges(BOARDS[cur]);
});
try {
  const t = localStorage.getItem('ep-theme');
  if (t) document.documentElement.setAttribute('data-theme', t);
} catch(err){}

/* ---------- registro persistente (db) ---------- */
(async function initRegistro(){
  const c = window.claude;
  if (!c || typeof c.use !== 'function') return;
  try {
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
    if (user){
      try { ME.owner = await user.isOwner(); ME.id = await user.id(); } catch(e){}
    }
    if (!db) { paintDecisions(); return; }
    DB = db;
    db.collection('decisoes').onSnapshot(s => {
      const o = {}; s.docs.forEach(d => { if (d.exists) o[d.id] = d.data(); });
      DSTATE = o; paintDecisions();
    }, () => {});
    db.collection('secoes').onSnapshot(s => {
      const o = {}; s.docs.forEach(d => { if (d.exists) o[d.id] = d.data(); });
      SSTATE = o; paintSections();
    }, () => {});
    paintDecisions();
    if (typeof panel._sync === 'function') panel._sync();
  } catch(e){}
})();

/* ---------- boot ---------- */
let start = 0;
const hash = (location.hash || '').replace('#','');
if (hash){ const i = BOARDS.findIndex(b => b.id === hash); if (i >= 0) start = i; }
show(start);
/* link direto para outro quadro com a página já aberta */
addEventListener('hashchange', () => {
  const i = BOARDS.findIndex(b => b.id === (location.hash || '').slice(1));
  if (i >= 0 && i !== cur) show(i);
});
/* teclado virtual dispara resize: nunca redesenhar com o painel aberto, para não perder a nota digitada */
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => {
  if (panel.classList.contains('open')) return; drawEdges(BOARDS[cur]); frameBoard(); }, 180); });
})();
</script>
