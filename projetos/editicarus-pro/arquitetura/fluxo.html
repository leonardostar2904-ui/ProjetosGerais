<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const world = $('#world'), stage = $('#stage'), svg = $('#edges'), rail = $('#rail');
const panel = $('#panel'), pb = $('#pb'), ptitle = $('#ptitle'), player = $('#player');

const COL = {shell:'--l-shell',core:'--l-core',render:'--l-render',ai:'--l-ai',cat:'--l-cat',
  ent:'--l-ent',infra:'--l-infra',user:'--l-user',accent:'--accent',ok:'--ok',warn:'--warn'};
const col = l => 'var(' + (COL[l] || '--l-infra') + ')';
const LNAMES = {shell:'Casca de UI',core:'Núcleo de edição',render:'Motor de render',ai:'Inteligência',
  cat:'Catálogo',ent:'Acesso e cobrança',infra:'Plataforma',user:'Usuário',accent:'Decisão',
  ok:'Positivo',warn:'Atenção'};

let view = {x:60,y:40,k:1}, cur = 0, sel = null, nodeMap = {};

/* ---------- legenda ---------- */
$('#lkeys').innerHTML = ['shell','core','render','ai','cat','ent','infra','user']
  .map(l => '<span><i style="background:' + col(l) + '"></i>' + LNAMES[l] + '</span>').join('');

/* ---------- trilha ---------- */
BOARDS.forEach((b,i) => {
  const btn = document.createElement('button');
  btn.className = 'rb'; btn.type = 'button';
  btn.innerHTML = '<em>' + b.num + '</em>' + b.nome;
  btn.addEventListener('click', () => show(i));
  rail.appendChild(btn);
});

/* ---------- escape ---------- */
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ---------- render de um quadro ---------- */
function show(i, keepView){
  cur = i; const b = BOARDS[i];
  [...rail.children].forEach((c,j) => c.setAttribute('aria-current', j === i ? 'true' : 'false'));
  [...world.children].forEach(c => { if (c.id !== 'edges') c.remove(); });
  svg.innerHTML = ''; nodeMap = {}; closePanel();

  if (b.head){
    const h = document.createElement('div');
    h.className = 'bhead';
    h.style.cssText = 'left:' + b.head.x + 'px;top:' + b.head.y + 'px;width:' + b.head.w + 'px';
    h.innerHTML = '<span class="kick">' + esc(b.head.kick) + '</span><h2>' + esc(b.head.t) +
      '</h2><p>' + esc(b.head.p) + '</p>';
    world.appendChild(h);
  }

  (b.g || []).forEach(g => {
    const d = document.createElement('div');
    d.className = 'grp';
    d.style.cssText = 'left:' + g.x + 'px;top:' + g.y + 'px;width:' + g.w + 'px;height:' + g.h +
      'px;--gc:' + col(g.c) + ';border-color:color-mix(in srgb,' + col(g.c) + ' 40%,transparent)';
    d.innerHTML = '<b>' + esc(g.t) + '</b>' + (g.i ? '<i>' + esc(g.i) + '</i>' : '');
    world.appendChild(d);
  });

  (b.n || []).forEach(n => {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'n' + (n.dec ? ' dec' : '') + (n.term ? ' term' : '') + (n.ghost ? ' ghost' : '');
    el.style.cssText = 'left:' + n.x + 'px;top:' + n.y + 'px;width:' + n.w + 'px;min-height:' +
      n.h + 'px;--c:' + col(n.l);
    el.innerHTML = (n.dec ? '<span class="tag">decisão</span>' : '') + '<b>' + esc(n.t) + '</b>' +
      (n.s ? '<small>' + esc(n.s) + '</small>' : '');
    el.addEventListener('click', e => { e.stopPropagation(); openPanel(n, el); });
    world.appendChild(el);
    nodeMap[n.id] = {el, n};
  });

  (b.k || []).forEach(k => {
    const d = document.createElement('div');
    d.className = 'note';
    d.style.cssText = 'left:' + k.x + 'px;top:' + k.y + 'px;width:' + k.w + 'px;--c:' + col(k.c);
    d.innerHTML = '<b>' + esc(k.b) + '</b>' + k.h;
    world.appendChild(d);
  });

  (b.t || []).forEach(t => {
    const d = document.createElement('div');
    d.className = 'tbl';
    d.style.cssText = 'left:' + t.x + 'px;top:' + t.y + 'px;width:' + t.w + 'px';
    d.innerHTML = '<table><caption>' + esc(t.cap) + '</caption><thead><tr>' +
      t.h.map(h => '<th>' + esc(h) + '</th>').join('') + '</tr></thead><tbody>' +
      t.r.map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>').join('') +
      '</tbody></table>';
    world.appendChild(d);
  });

  requestAnimationFrame(() => { drawEdges(b); if (!keepView) fit(); });
  try { history.replaceState(null, '', '#' + b.id); } catch(e){}
}

/* ---------- arestas ---------- */
function drawEdges(b){
  const NS = 'http://www.w3.org/2000/svg';
  svg.innerHTML = '';
  world.querySelectorAll('.elab').forEach(e => e.remove());
  const line = getComputedStyle(document.documentElement).getPropertyValue('--line-strong').trim();

  const defs = document.createElementNS(NS, 'defs');
  defs.innerHTML = '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" ' +
    'markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="' + line + '"/></marker>';
  svg.appendChild(defs);

  (b.e || []).forEach(e => {
    const A = nodeMap[e.f], B = nodeMap[e.t];
    if (!A || !B) return;
    const a = {x:A.n.x, y:A.n.y, w:A.n.w, h:A.el.offsetHeight || A.n.h};
    const z = {x:B.n.x, y:B.n.y, w:B.n.w, h:B.el.offsetHeight || B.n.h};
    const ac = {x:a.x + a.w/2, y:a.y + a.h/2}, zc = {x:z.x + z.w/2, y:z.y + z.h/2};
    const dx = zc.x - ac.x, dy = zc.y - ac.y;
    let p1, p2, c1, c2;
    if (Math.abs(dx) > Math.abs(dy) * 1.1){
      const s = dx > 0 ? 1 : -1;
      p1 = {x: dx > 0 ? a.x + a.w : a.x, y: ac.y};
      p2 = {x: dx > 0 ? z.x : z.x + z.w, y: zc.y};
      const d = Math.min(Math.abs(p2.x - p1.x) * 0.5, 80);
      c1 = {x: p1.x + s*d, y: p1.y}; c2 = {x: p2.x - s*d, y: p2.y};
    } else {
      const s = dy > 0 ? 1 : -1;
      p1 = {x: ac.x, y: dy > 0 ? a.y + a.h : a.y};
      p2 = {x: zc.x, y: dy > 0 ? z.y : z.y + z.h};
      const d = Math.min(Math.abs(p2.y - p1.y) * 0.5, 70);
      c1 = {x: p1.x, y: p1.y + s*d}; c2 = {x: p2.x, y: p2.y - s*d};
    }
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('d', 'M' + p1.x + ',' + p1.y + ' C' + c1.x + ',' + c1.y + ' ' + c2.x + ',' +
      c2.y + ' ' + p2.x + ',' + p2.y);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', line);
    path.setAttribute('stroke-width', '1.6');
    path.setAttribute('marker-end', 'url(#ah)');
    if (e.k === 'd') path.setAttribute('stroke-dasharray', '5 4');
    svg.appendChild(path);

    if (e.l){
      const t = 0.5;
      const bx = Math.pow(1-t,3)*p1.x + 3*Math.pow(1-t,2)*t*c1.x + 3*(1-t)*t*t*c2.x + t*t*t*p2.x;
      const by = Math.pow(1-t,3)*p1.y + 3*Math.pow(1-t,2)*t*c1.y + 3*(1-t)*t*t*c2.y + t*t*t*p2.y;
      const lab = document.createElement('div');
      lab.className = 'elab';
      lab.style.cssText = 'left:' + bx + 'px;top:' + by + 'px';
      lab.textContent = e.l;
      world.appendChild(lab);
    }
  });

  let maxX = 0, maxY = 0;
  [...world.children].forEach(c => {
    if (c.id === 'edges') return;
    maxX = Math.max(maxX, c.offsetLeft + c.offsetWidth);
    maxY = Math.max(maxY, c.offsetTop + c.offsetHeight);
  });
  svg.setAttribute('width', maxX + 200); svg.setAttribute('height', maxY + 200);
}

/* ---------- painel ---------- */
function openPanel(n, el){
  if (sel) sel.classList.remove('on');
  sel = el; el.classList.add('on');
  const d = n.d || {};
  player.textContent = LNAMES[n.l] || '';
  player.style.setProperty('--c', col(n.l));
  ptitle.textContent = n.t;
  let h = '';
  if (d.q) h += '<section><h4>O que é</h4><p>' + d.q + '</p></section>';
  if (d.p) h += '<section><h4>Por que existe assim</h4><p>' + d.p + '</p></section>';
  if (d.te) h += '<section><h4>Tecnologia e critério</h4><p>' + d.te + '</p></section>';
  if (d.f) h += '<section><h4>Se falhar</h4><p class="fail">' + d.f + '</p></section>';
  if (d.k && d.k.length) h += '<section><h4>Referências</h4><div class="chips">' +
    d.k.map(k => '<span class="chip">' + esc(k) + '</span>').join('') + '</div></section>';
  pb.innerHTML = h || '<p>Sem detalhe adicional.</p>';
  pb.scrollTop = 0;
  panel.classList.add('open'); panel.setAttribute('aria-hidden','false');
}
function closePanel(){
  panel.classList.remove('open'); panel.setAttribute('aria-hidden','true');
  if (sel) { sel.classList.remove('on'); sel = null; }
}
$('#pclose').addEventListener('click', closePanel);

/* ---------- transform ---------- */
function apply(){
  world.style.transform = 'translate(' + view.x + 'px,' + view.y + 'px) scale(' + view.k + ')';
  $('#zlvl').textContent = Math.round(view.k * 100) + '%';
}
function fit(){
  let maxX = 0, maxY = 0, minX = 1e9, minY = 1e9;
  [...world.children].forEach(c => {
    if (c.id === 'edges') return;
    minX = Math.min(minX, c.offsetLeft); minY = Math.min(minY, c.offsetTop);
    maxX = Math.max(maxX, c.offsetLeft + c.offsetWidth);
    maxY = Math.max(maxY, c.offsetTop + c.offsetHeight);
  });
  if (minX > 1e8) return;
  const pad = 56, vw = stage.clientWidth, vh = stage.clientHeight;
  const k = Math.min((vw - pad*2) / (maxX - minX), (vh - pad*2) / (maxY - minY), 1.1);
  view.k = Math.max(0.08, k);
  view.x = pad - minX * view.k + (vw - pad*2 - (maxX-minX)*view.k) / 2;
  view.y = pad - minY * view.k;
  apply();
}
function zoomAt(f, cx, cy){
  const k2 = Math.min(2.4, Math.max(0.08, view.k * f));
  const r = k2 / view.k;
  view.x = cx - (cx - view.x) * r; view.y = cy - (cy - view.y) * r;
  view.k = k2; apply();
}
$('#bzi').addEventListener('click', () => zoomAt(1.25, stage.clientWidth/2, stage.clientHeight/2));
$('#bzo').addEventListener('click', () => zoomAt(0.8, stage.clientWidth/2, stage.clientHeight/2));
$('#bfit').addEventListener('click', fit);

/* ---------- pan ---------- */
let drag = null;
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('.n, #panel, #legend, .tbl')) return;
  drag = {x:e.clientX, y:e.clientY, vx:view.x, vy:view.y, id:e.pointerId};
  stage.classList.add('drag');
  try { stage.setPointerCapture(e.pointerId); } catch(err){}
});
stage.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  view.x = drag.vx + (e.clientX - drag.x); view.y = drag.vy + (e.clientY - drag.y); apply();
});
const endDrag = () => { drag = null; stage.classList.remove('drag'); };
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);
stage.addEventListener('click', e => { if (!e.target.closest('.n, #panel')) closePanel(); });

stage.addEventListener('wheel', e => {
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey) zoomAt(e.deltaY < 0 ? 1.12 : 0.89, e.clientX - r.left, e.clientY - r.top);
  else { view.x -= e.deltaX; view.y -= e.deltaY; apply(); }
}, {passive:false});

/* pinça */
let pinch = null;
stage.addEventListener('touchstart', e => {
  if (e.touches.length === 2){
    const [a,b] = e.touches;
    pinch = {d: Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY), k: view.k};
    drag = null; stage.classList.remove('drag');
  }
}, {passive:true});
stage.addEventListener('touchmove', e => {
  if (e.touches.length === 2 && pinch){
    e.preventDefault();
    const [a,b] = e.touches, r = stage.getBoundingClientRect();
    const d = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    const target = Math.min(2.4, Math.max(0.08, pinch.k * (d / pinch.d)));
    const cx = (a.clientX + b.clientX)/2 - r.left, cy = (a.clientY + b.clientY)/2 - r.top;
    zoomAt(target / view.k, cx, cy);
  }
}, {passive:false});
stage.addEventListener('touchend', () => { pinch = null; }, {passive:true});

/* ---------- teclado ---------- */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePanel();
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === '0'){ fit(); }
  if (e.key === 'ArrowRight' && e.altKey){ show(Math.min(BOARDS.length-1, cur+1)); }
  if (e.key === 'ArrowLeft' && e.altKey){ show(Math.max(0, cur-1)); }
});

/* ---------- tema ---------- */
$('#btheme').addEventListener('click', () => {
  const r = document.documentElement;
  const dark = r.getAttribute('data-theme') === 'dark' ||
    (!r.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  r.setAttribute('data-theme', dark ? 'light' : 'dark');
  try { localStorage.setItem('ep-theme', dark ? 'light' : 'dark'); } catch(err){}
  drawEdges(BOARDS[cur]);
});
try {
  const t = localStorage.getItem('ep-theme');
  if (t) document.documentElement.setAttribute('data-theme', t);
} catch(err){}

/* ---------- boot ---------- */
let start = 0;
const hash = (location.hash || '').replace('#','');
if (hash){ const i = BOARDS.findIndex(b => b.id === hash); if (i >= 0) start = i; }
show(start);
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => show(cur, false), 180); });
})();
</script>
