}

/* ---------- eventos ---------- */
function clique(e){
  if (Math.abs(e.clientX - SUPR.x) < 3 && Math.abs(e.clientY - SUPR.y) < 3 && e.timeStamp - SUPR.t < 600) return;
  const p1 = e.target.closest('[data-p1]');
  if (p1){ ctl(p1.dataset.p1, p1.dataset.v, p1); return; }
  const fr = e.target.closest('[data-dev]'); if (!fr) return;
  const dev = fr.dataset.dev, el = e.target.closest('[data-a]');
  if (!el || !fr.contains(el)){
    const it = e.target.closest('[data-el]');
    if (it){ S.sel = {k:it.dataset.el, id:it.dataset.id}; if (dev === 'm') S.ui.m.sheet = null; render(); return; }
    if (e.target.closest('.trk') && S.sel){ S.sel = null; render(); }
    return;
  }
  if (el.dataset.self && e.target !== el) return;
  if (el.disabled) return;
  if (el.getAttribute('aria-disabled') === 'true'){ aviso('Sem conexão. Este item precisa de rede para baixar.', null, null, false, 'semrede'); render(); return; }
  const fn = A[el.dataset.a]; if (!fn) return;
  gestoFim();
  if (fn(el.dataset.v, dev, el) !== false) render();
}
function entrada(e){
  const el = e.target, n = el.dataset && el.dataset.in;
  if (!n || !ENTRADA[n]) return;
  if (ENTRADA[n](el.value, el) === true) render();
}
/* change só fecha o gesto de desfazer: redesenhar aqui destruiria o botão que o usuário está clicando */
function mudou(e){ if (e.target.dataset && e.target.dataset.in) gestoFim(); }
function captura(e){ try { ROOT.setPointerCapture(e.pointerId); } catch(err){} }
function emTl(e, fr, k){ const tin = fr.querySelector('[data-tlin]'); if (!tin) return 0; return (e.clientX - tin.getBoundingClientRect().left) / k; }
function aperta(e){
  if (e.button) return;
  const fr = e.target.closest('[data-dev]'); if (!fr || !ROOT.contains(fr)) return;
  const dev = fr.dataset.dev, k = K[dev] || 1, t = e.target;
  const cmp = t.closest('[data-cmp]');
  if (cmp){ ARR = {tipo:'cmp', el:cmp}; moveCmp(e); captura(e); e.preventDefault(); return; }
  if (S.scr !== 'editor' || !S.doc) return;
  const h = t.closest('[data-hdl]');
  if (h){
    const c = S.doc.clips.find(x => x.id === h.dataset.id); if (!c) return;
    gestoIni(); pausa();
    ARR = {tipo:'trim', lado:h.dataset.hdl, id:c.id, x:e.clientX, k, Z: dev === 'd' ? S.zoom : S.zoomM, dur:c.dur, ini:c.in,
      itens: S.doc.caps.concat(S.doc.texts).filter(i => i.c === c.id).map(i => [i, i.a, i.b])};
    captura(e); e.preventDefault(); return;
  }
  if (dev === 'd' && t.closest('[data-scrub]')){ pausa(); pintaPlay(); ARR = {tipo:'scrub', fr, k}; moveScrub(e); captura(e); e.preventDefault(); return; }
  const cl = t.closest('[data-el="clip"]');
  if (dev === 'd' && cl){ ARR = {tipo:'clip?', id:cl.dataset.id, x:e.clientX, k, fr, el:cl}; return; }
  const msc = t.closest('[data-msc]');
  if (dev === 'm' && msc && e.pointerType === 'mouse'){ ARR = {tipo:'pan?', el:msc, x:e.clientX, sl:msc.scrollLeft, k}; }

let REG = null;
async function registro(){
  if (REG) return REG;
  const c = window.claude;
  if (!c || typeof c.use !== 'function') return (REG = {db:null, dono:false, id:null});
  try {
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
    let dono = false, id = null;
    if (user){ try { dono = await user.isOwner(); id = await user.id(); } catch(e){} }
    return (REG = {db, dono, id});
  } catch(e){ return (REG = {db:null, dono:false, id:null}); }
}
function ligaSistema(el){
  el.addEventListener('click', async e => {
    const b = e.target.closest('[data-ap]'); if (!b) return;
    const box = b.closest('[data-pp]'), id = box.dataset.pp, h = box.querySelector('.pp-h');
    const r = await registro();
    if (!r.db){ h.textContent = 'O registro não está disponível nesta visualização. Responda no chat citando ' + id + '.'; return; }
    if (r.dono === false){ h.textContent = 'Só o dono desta página registra decisões. Responda no chat citando ' + id + '.'; return; }
    box.querySelectorAll('[data-ap]').forEach(x => { x.disabled = true; });
    h.textContent = 'Salvando.';
    try {
      await r.db.collection('decisoes').doc(id).set({status:b.dataset.ap, nota:'', em:new Date().toISOString(), por:r.id || null});
      h.textContent = b.dataset.ap === 'aguardando' ? id + ' voltou para aguardando aprovação.' : 'Registrado. Eu leio este registro antes da próxima etapa.';
    } catch(err){ h.textContent = 'Não deu para salvar agora. Tente de novo em instantes.'; }
    finally { box.querySelectorAll('[data-ap]').forEach(x => { x.disabled = false; }); }
  });
}

    d.innerHTML = '<b>' + esc(z.t) + '</b><div class="zdev" style="height:' + z.h + 'px">' +
      z.zones.map(q => '<div class="zz' + (q[6] ? ' hot' : '') + '" style="left:' + q[0] + '%;top:' + q[1] +
        '%;width:' + q[2] + '%;height:' + q[3] + '%"><span>' + (q[5] ? '<em>' + q[5] + '</em>' : '') +
        esc(q[4]) + '</span></div>').join('') + '</div>' + (z.c ? '<i>' + esc(z.c) + '</i>' : '');
    world.appendChild(d);
  });

  (b.n || []).forEach(n => {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'n' + (n.dec ? ' dec' : '') + (n.term ? ' term' : '') + (n.ghost ? ' ghost' : '');
    el.style.cssText = 'left:' + n.x + 'px;top:' + n.y + 'px;width:' + n.w + 'px;min-height:' +
      n.h + 'px;--c:' + col(n.l);
    const tags = [].concat(n.tag || []);
    el.innerHTML = (tags.length ? '<span class="tags">' + tags.map(t => '<span class="tg ' + t + '">' +
        TSHORT[t] + '</span>').join('') + '</span>' : '') +
      (n.dec ? '<span class="tag">decisão</span>' : '') + '<b>' + esc(n.t) + '</b>' +
      (n.s ? '<small>' + esc(n.s) + '</small>' : '') +
      (n.dcs ? '<span class="stp" data-dcs="' + n.dcs + '"></span>' : '');
    el.addEventListener('click', e => { e.stopPropagation(); openPanel(n, el); });
    world.appendChild(el);
    nodeMap[n.id] = {el, n};
  });

  (b.k || []).forEach(k => {
    const d = document.createElement('div');
    d.className = 'note';
    d.style.cssText = 'left:' + k.x + 'px;top:' + k.y + 'px;width:' + k.w + 'px;--c:' + col(k.c);
    d.innerHTML = '<b>' + esc(k.b) + '</b>' + k.h;
    world.appendChild(d);
  });

  (b.t || []).forEach(t => {
    const d = document.createElement('div');
    d.className = 'tbl';
    d.style.cssText = 'left:' + t.x + 'px;top:' + t.y + 'px;width:' + t.w + 'px';
    d.innerHTML = '<table><caption>' + esc(t.cap) + '</caption><thead><tr>' +
      t.h.map(h => '<th>' + esc(h) + '</th>').join('') + '</tr></thead><tbody>' +
      t.r.map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>').join('') +
      '</tbody></table>';
    world.appendChild(d);
  });

  /* blocos livres: gráficos e calculadoras */
  (b.x || []).forEach(x => {
    const d = document.createElement('div');
    d.className = 'xblk' + (x.cls ? ' ' + x.cls : '');
    d.style.cssText = 'left:' + x.x + 'px;top:' + x.y + 'px;width:' + x.w + 'px';
    d.innerHTML = typeof x.html === 'function' ? x.html() : x.html;
    world.appendChild(d);
    if (typeof x.init === 'function') try { x.init(d); } catch(e){}
  });

  paintDecisions(); paintSections();
  requestAnimationFrame(() => { drawEdges(b); if (!keepView) frameBoard(); });
  try { history.replaceState(null, '', '#' + b.id); } catch(e){}
}

/* ---------- arestas ---------- */
function drawEdges(b){
  const NS = 'http://www.w3.org/2000/svg';
  svg.innerHTML = '';
  world.querySelectorAll('.elab').forEach(e => e.remove());
  const line = getComputedStyle(document.documentElement).getPropertyValue('--line-strong').trim();

  const defs = document.createElementNS(NS, 'defs');
  defs.innerHTML = '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" ' +
    'markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="' + line + '"/></marker>';
  svg.appendChild(defs);

  (b.e || []).forEach(e => {
    const A = nodeMap[e.f], B = nodeMap[e.t];
    if (!A || !B) return;
    const a = {x:A.n.x, y:A.n.y, w:A.n.w, h:A.el.offsetHeight || A.n.h};
    const z = {x:B.n.x, y:B.n.y, w:B.n.w, h:B.el.offsetHeight || B.n.h};
    const ac = {x:a.x + a.w/2, y:a.y + a.h/2}, zc = {x:z.x + z.w/2, y:z.y + z.h/2};
    const dx = zc.x - ac.x, dy = zc.y - ac.y;
    let p1, p2, c1, c2;
    if (Math.abs(dx) > Math.abs(dy) * 1.1){
      const s = dx > 0 ? 1 : -1;
      p1 = {x: dx > 0 ? a.x + a.w : a.x, y: ac.y};
      p2 = {x: dx > 0 ? z.x : z.x + z.w, y: zc.y};
      const d = Math.min(Math.abs(p2.x - p1.x) * 0.5, 80);
      c1 = {x: p1.x + s*d, y: p1.y}; c2 = {x: p2.x - s*d, y: p2.y};
    } else {
      const s = dy > 0 ? 1 : -1;
      p1 = {x: ac.x, y: dy > 0 ? a.y + a.h : a.y};
      p2 = {x: zc.x, y: dy > 0 ? z.y : z.y + z.h};
      const d = Math.min(Math.abs(p2.y - p1.y) * 0.5, 70);
      c1 = {x: p1.x, y: p1.y + s*d}; c2 = {x: p2.x, y: p2.y - s*d};
    }
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('d', 'M' + p1.x + ',' + p1.y + ' C' + c1.x + ',' + c1.y + ' ' + c2.x + ',' +
      c2.y + ' ' + p2.x + ',' + p2.y);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', line);
    path.setAttribute('stroke-width', '1.6');
    path.setAttribute('marker-end', 'url(#ah)');
    if (e.k === 'd') path.setAttribute('stroke-dasharray', '5 4');
    svg.appendChild(path);

    if (e.l){
      const t = 0.5;
      const bx = Math.pow(1-t,3)*p1.x + 3*Math.pow(1-t,2)*t*c1.x + 3*(1-t)*t*t*c2.x + t*t*t*p2.x;
      const by = Math.pow(1-t,3)*p1.y + 3*Math.pow(1-t,2)*t*c1.y + 3*(1-t)*t*t*c2.y + t*t*t*p2.y;
      const lab = document.createElement('div');
      lab.className = 'elab';
      lab.style.cssText = 'left:' + bx + 'px;top:' + by + 'px';
      lab.textContent = e.l;
      world.appendChild(lab);
    }
  });

  let maxX = 0, maxY = 0;
  [...world.children].forEach(c => {
    if (c.id === 'edges') return;
    maxX = Math.max(maxX, c.offsetLeft + c.offsetWidth);
    maxY = Math.max(maxY, c.offsetTop + c.offsetHeight);
  });
  svg.setAttribute('width', maxX + 200); svg.setAttribute('height', maxY + 200);
}

/* ---------- registro: decisões e seções ---------- */
function when(iso){
  if (!iso) return '';
  try { return 'registrado em ' + new Date(iso).toLocaleString('pt-BR', {dateStyle:'short', timeStyle:'short'}); }
  catch(e){ return ''; }
}
function paintDecisions(){
  document.querySelectorAll('[data-dcs]').forEach(e => {
    const st = (DSTATE[e.dataset.dcs] || {}).status;
    const k = DST[st] ? st : 'aguardando';
    e.className = 'stp ' + k; e.textContent = DST[k];
  });
  const c = document.getElementById('dcount');
  if (c){
    const ap = DIDS.filter(i => (DSTATE[i] || {}).status === 'aprovado').length;
    const aj = DIDS.filter(i => (DSTATE[i] || {}).status === 'ajustes').length;
    c.textContent = ap + ' aprovadas, ' + aj + ' com ajuste pedido, ' + (DIDS.length - ap - aj) +
      ' aguardando, de ' + DIDS.length + '.' + (DB ? '' : ' Registro indisponível nesta visualização.');
  }
  if (panelNode && panelNode.dcs){
    const s = DSTATE[panelNode.dcs] || {}, k = DST[s.status] ? s.status : 'aguardando';
    const st = document.getElementById('apst'), wh = document.getElementById('apwhen');
    if (st){ st.className = 'stp ' + k; st.textContent = DST[k]; }
    if (wh) wh.textContent = when(s.em);
  }
}
function paintSections(){
  document.querySelectorAll('[data-sec]').forEach(e => {
    const st = (SSTATE[e.dataset.sec] || {}).status;
    const k = SST[st] ? st : (e.dataset.def || 'nao_iniciado');
    e.className = 'stp ' + k; e.textContent = SST[k];
  });
}
const canWrite = () => !!DB && ME.owner !== false;
function approvalHTML(id){
  const s = DSTATE[id] || {}, k = DST[s.status] ? s.status : 'aguardando';
  return '<section class="appr"><h4>Sua decisão sobre ' + id + '</h4>' +
    '<div class="stline"><span class="stp ' + k + '" id="apst">' + DST[k] + '</span><span id="apwhen">' +
    when(s.em) + '</span></div>' +
    '<label for="apnote">Nota para mim (opcional)</label>' +
    '<textarea id="apnote" maxlength="2000" placeholder="Ex.: aprovo, mas quero ver a opção B desenhada na seção 2.">' +
    esc(s.nota || '') + '</textarea>' +
    '<div class="apb"><button type="button" class="pri" id="apok">Aprovar recomendação</button>' +
    '<button type="button" id="apadj">Pedir ajuste</button>' +
    '<button type="button" class="lnk" id="aprst">Voltar para aguardando</button></div>' +
    '<p class="aph" id="aph"></p></section>';
}
function wireApproval(id){
  const btns = ['apok','apadj','aprst'].map(x => document.getElementById(x));
  const hint = t => { const h = document.getElementById('aph'); if (h) h.textContent = t; };
  const sync = () => {
    btns.forEach(b => { if (b) b.disabled = !canWrite(); });
    if (!DB) hint('O registro não está disponível nesta visualização. Responda no chat citando ' + id + '.');
    else if (ME.owner === false) hint('Só o dono desta página registra decisões.');
  };
  sync();
  const save = async status => {
    if (!canWrite()) return;
    const ta = document.getElementById('apnote');
    const nota = ta ? ta.value.trim().slice(0, 2000) : '';
    btns.forEach(b => { if (b) b.disabled = true; });
    hint('Salvando.');
    try {
      await DB.collection('decisoes').doc(id).set({status, nota, em:new Date().toISOString(), por:ME.id || null});
      hint(status === 'aguardando' ? id + ' voltou para aguardando aprovação.'
        : 'Registrado. Eu leio este registro antes de seguir para a próxima etapa.');
    } catch(e){
      hint(e && e.code === 'invalid_argument' ? 'Só o dono desta página registra decisões. Responda no chat citando ' + id + '.'
        : 'Não deu para salvar agora. Sua nota continua no campo; tente de novo em instantes.');
    } finally { sync(); }
  };
  if (btns[0]) btns[0].addEventListener('click', () => save('aprovado'));
  if (btns[1]) btns[1].addEventListener('click', () => save('ajustes'));
  if (btns[2]) btns[2].addEventListener('click', () => save('aguardando'));
  panel._sync = sync;
}

/* ---------- painel ---------- */
function openPanel(n, el){
  if (sel) sel.classList.remove('on');
  sel = el; el.classList.add('on'); panelNode = n;
  const d = n.d || {}, tags = [].concat(n.tag || []);
  player.textContent = tags.length ? tags.map(t => TAGS[t]).join(' · ') : (LNAMES[n.l] || '');
  player.style.setProperty('--c', col(n.l));
  ptitle.textContent = n.t;
  let h = '';
  if (d.sec) d.sec.forEach(s => {
    h += '<section><h4>' + esc(s[0]) + '</h4>' + (s[1].charAt(0) === '<' ? s[1] : '<p>' + s[1] + '</p>') + '</section>';
  });
  if (d.q) h += '<section><h4>O que é</h4><p>' + d.q + '</p></section>';
  if (d.p) h += '<section><h4>Por que existe assim</h4><p>' + d.p + '</p></section>';
  if (d.te) h += '<section><h4>Tecnologia e critério</h4><p>' + d.te + '</p></section>';
  if (d.f) h += '<section><h4>Se falhar</h4><p class="fail">' + d.f + '</p></section>';
  if (!d.sec && !d.q && n.s) h += '<section><h4>Resumo</h4><p>' + esc(n.s) + '</p></section>';
  if (d.k && d.k.length) h += '<section><h4>Referências</h4><div class="chips">' +
    d.k.map(k => '<span class="chip">' + esc(k) + '</span>').join('') + '</div></section>';
  if (n.dcs) h += approvalHTML(n.dcs);
  pb.innerHTML = h || '<p>Sem detalhe adicional.</p>';
  pb.scrollTop = 0;
  panel._sync = null;
  if (n.dcs) wireApproval(n.dcs);
  panel.classList.add('open'); panel.setAttribute('aria-hidden','false');
}
function closePanel(){
  panel.classList.remove('open'); panel.setAttribute('aria-hidden','true');
  if (sel) { sel.classList.remove('on'); sel = null; }
  panelNode = null; panel._sync = null;
}
$('#pclose').addEventListener('click', closePanel);

/* ---------- transform ---------- */
function apply(){
  world.style.transform = 'translate(' + view.x + 'px,' + view.y + 'px) scale(' + view.k + ')';
  $('#zlvl').textContent = Math.round(view.k * 100) + '%';
}
function bounds(){
  let maxX = 0, maxY = 0, minX = 1e9, minY = 1e9;
  [...world.children].forEach(c => {
    if (c.id === 'edges') return;
    minX = Math.min(minX, c.offsetLeft); minY = Math.min(minY, c.offsetTop);
    maxX = Math.max(maxX, c.offsetLeft + c.offsetWidth);
    maxY = Math.max(maxY, c.offsetTop + c.offsetHeight);
  });
  return minX > 1e8 ? null : {minX, minY, maxX, maxY};
}
function fit(){
  const r = bounds(); if (!r) return;
  const pad = 56, vw = stage.clientWidth, vh = stage.clientHeight;
  const k = Math.min((vw - pad*2) / (r.maxX - r.minX), (vh - pad*2) / (r.maxY - r.minY), 1.1);
  view.k = Math.max(0.08, k);
  view.x = pad - r.minX * view.k + (vw - pad*2 - (r.maxX - r.minX)*view.k) / 2;
  view.y = pad - r.minY * view.k;
  apply();
}
/* quadro alto demais para caber legível: encaixa pela largura e começa do topo */
function frameBoard(){
  const r = bounds(); if (!r) return;
  const pad = 56, vw = stage.clientWidth, vh = stage.clientHeight;
  const kAll = Math.min((vw - pad*2) / (r.maxX - r.minX), (vh - pad*2) / (r.maxY - r.minY), 1.1);
  if (kAll >= 0.5 || (vw < 700 && kAll >= 0.15)) return fit();
  view.k = Math.min((vw - pad*2) / (r.maxX - r.minX), 1);
  view.x = pad - r.minX * view.k + (vw - pad*2 - (r.maxX - r.minX)*view.k) / 2;
  view.y = pad - r.minY * view.k;
  apply();
}
function zoomAt(f, cx, cy){
  const k2 = Math.min(2.4, Math.max(0.08, view.k * f));
  const r = k2 / view.k;
  view.x = cx - (cx - view.x) * r; view.y = cy - (cy - view.y) * r;
  view.k = k2; apply();
}
$('#bzi').addEventListener('click', () => zoomAt(1.25, stage.clientWidth/2, stage.clientHeight/2));
$('#bzo').addEventListener('click', () => zoomAt(0.8, stage.clientWidth/2, stage.clientHeight/2));
$('#bfit').addEventListener('click', fit);

/* ---------- pan ---------- */
let drag = null;
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('.n, #panel, #legend, .tbl, .calc, a, .xblk button, .xblk input, .xblk select, .xblk label')) return;
  drag = {x:e.clientX, y:e.clientY, vx:view.x, vy:view.y, id:e.pointerId};
  stage.classList.add('drag');
  try { stage.setPointerCapture(e.pointerId); } catch(err){}
});
stage.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  view.x = drag.vx + (e.clientX - drag.x); view.y = drag.vy + (e.clientY - drag.y); apply();
});
const endDrag = () => { drag = null; stage.classList.remove('drag'); };
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);
stage.addEventListener('click', e => { if (!e.target.closest('.n, #panel')) closePanel(); });

stage.addEventListener('wheel', e => {
  if (e.target.closest('#panel, #legend')) return;
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey) zoomAt(e.deltaY < 0 ? 1.12 : 0.89, e.clientX - r.left, e.clientY - r.top);
  else { view.x -= e.deltaX; view.y -= e.deltaY; apply(); }
}, {passive:false});

/* pinça */
let pinch = null;
stage.addEventListener('touchstart', e => {
  if (e.touches.length === 2){
    const [a,b] = e.touches;
    pinch = {d: Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY), k: view.k};
    drag = null; stage.classList.remove('drag');
  }
}, {passive:true});
stage.addEventListener('touchmove', e => {
  if (e.touches.length === 2 && pinch){
    e.preventDefault();
    const [a,b] = e.touches, r = stage.getBoundingClientRect();
    const d = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    const target = Math.min(2.4, Math.max(0.08, pinch.k * (d / pinch.d)));
    const cx = (a.clientX + b.clientX)/2 - r.left, cy = (a.clientY + b.clientY)/2 - r.top;
    zoomAt(target / view.k, cx, cy);
  }
}, {passive:false});
stage.addEventListener('touchend', () => { pinch = null; }, {passive:true});

/* ---------- teclado ---------- */
document.addEventListener('keydown', e => {
  const tg = e.target.tagName;
  if (tg === 'INPUT' || tg === 'TEXTAREA') return;
  if (e.key === 'Escape') closePanel();
  if (e.key === '0' && !BOARDS[cur].page) fit();
  if (e.key === 'ArrowRight' && e.altKey) show(Math.min(BOARDS.length-1, cur+1));
  if (e.key === 'ArrowLeft' && e.altKey) show(Math.max(0, cur-1));
});

/* ---------- tema ---------- */
$('#btheme').addEventListener('click', () => {
  const r = document.documentElement;
  const dark = r.getAttribute('data-theme') === 'dark' ||
    (!r.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  r.setAttribute('data-theme', dark ? 'light' : 'dark');
  try { localStorage.setItem('ep-theme', dark ? 'light' : 'dark'); } catch(err){}
  if (!BOARDS[cur].page) drawEdges(BOARDS[cur]);
});
try {
  const t = localStorage.getItem('ep-theme');
  if (t) document.documentElement.setAttribute('data-theme', t);
} catch(err){}

/* ---------- registro persistente (db) ---------- */
(async function initRegistro(){
  const c = window.claude;
  if (!c || typeof c.use !== 'function') return;
  try {
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
    if (user){
      try { ME.owner = await user.isOwner(); ME.id = await user.id(); } catch(e){}
    }
    if (!db) { paintDecisions(); return; }
    DB = db;
    db.collection('decisoes').onSnapshot(s => {
      const o = {}; s.docs.forEach(d => { if (d.exists) o[d.id] = d.data(); });
      DSTATE = o; paintDecisions();
    }, () => {});
    db.collection('secoes').onSnapshot(s => {
      const o = {}; s.docs.forEach(d => { if (d.exists) o[d.id] = d.data(); });
      SSTATE = o; paintSections();
    }, () => {});
    paintDecisions();
    if (typeof panel._sync === 'function') panel._sync();
  } catch(e){}
})();

/* ---------- boot ---------- */
let start = Math.max(0, BOARDS.findIndex(b => b.id === 'prototipo'));
const hash = (location.hash || '').replace('#','');
if (hash){ const i = BOARDS.findIndex(b => b.id === hash); if (i >= 0) start = i; }
show(start);
/* navegação entre quadros chamada de dentro das páginas do protótipo */
window.irPara = id => { const i = BOARDS.findIndex(b => b.id === id); if (i >= 0) show(i); };
/* link direto para outro quadro com a página já aberta */
addEventListener('hashchange', () => {
  const i = BOARDS.findIndex(b => b.id === (location.hash || '').slice(1));
  if (i >= 0 && i !== cur) show(i);
});
/* teclado virtual dispara resize: nunca redesenhar com o painel aberto, para não perder a nota digitada */
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => {
  if (BOARDS[cur].page || panel.classList.contains('open')) return; drawEdges(BOARDS[cur]); frameBoard(); }, 180); });
})();
</script>
